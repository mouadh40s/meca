</script>
<script>
(function () {
const $ = s => document.querySelector(s);
const main = $('#main');
const KEY = 'atelier-meca-v1';
const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let S = { done: {}, quiz: {}, cards: {}, days: [], prac: {}, check: {}, exam: 0 };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} updXP(); }
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const dayNum = s => Math.round(new Date(s + 'T12:00:00').getTime() / 864e5);
function touch() { const t = today(); if (!S.days.includes(t)) { S.days.push(t); if (S.days.length > 400) S.days = S.days.slice(-400); } }
function streak() { const set = new Set(S.days.map(dayNum)); let n = dayNum(today()); if (!set.has(n)) n--; let c = 0; while (set.has(n)) { c++; n--; } return c; }
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fr = (n, d = 0) => Number(n).toLocaleString('fr-FR', { maximumFractionDigits: d, minimumFractionDigits: d });

const ALL_LESSONS = [];
MODULES.forEach((m, mi) => m.lessons.forEach((l, li) => ALL_LESSONS.push({ m, l, mi, li, key: m.id + '/' + l.id })));
const ALL_CARDS = [];
MODULES.forEach(m => m.cards.forEach((c, i) => ALL_CARDS.push({ key: m.id + ':' + i, m, f: c[0], b: c[1] })));
const N_Q = MODULES.reduce((s, m) => s + m.quiz.length, 0);
const N_D = Object.keys(DIAGRAMS).length;

function xp() {
  let x = Object.keys(S.done).length * 20;
  for (const k in S.quiz) x += S.quiz[k] * 5;
  for (const k in S.cards) x += (S.cards[k].b || 0) * 2;
  x += Object.keys(S.prac).length * 15 + (S.exam || 0) * 3;
  return x;
}
const LEVELS = [[0, 'Curieux'], [100, 'Apprenti'], [300, 'Aide-mécanicien'], [650, 'Mécanicien'], [1100, 'Mécanicien confirmé'], [1700, 'Technicien'], [2500, 'Chef d\'atelier']];
function level() {
  const x = xp(); let i = 0;
  while (i < LEVELS.length - 1 && x >= LEVELS[i + 1][0]) i++;
  const c = LEVELS[i], n = LEVELS[i + 1];
  return { x, i, name: c[1], next: n ? n[1] : null, pct: n ? (x - c[0]) / (n[0] - c[0]) : 1, need: n ? n[0] - x : 0 };
}
function updXP() { $('#xp').textContent = fr(xp()) + ' XP'; }

const INT = [0, 1, 2, 4, 8, 16];
const isDue = c => { const s = S.cards[c.key]; return s && s.b > 0 && s.due <= dayNum(today()); };
const dueCards = l => l.filter(isDue);
const newCards = l => l.filter(c => !S.cards[c.key]);
function grade(c, ok) {
  const t = dayNum(today()); const s = S.cards[c.key] || { b: 0, due: t };
  if (ok) { s.b = Math.min(5, (s.b || 0) + 1); s.due = t + INT[s.b]; } else { s.b = 1; s.due = t; }
  S.cards[c.key] = s; touch(); save();
}

function chrome(title, tab, back) {
  $('#title').textContent = title;
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === tab));
  const b = $('#back'); b.hidden = !back; b.onclick = () => { location.hash = back; };
}
function modProgress(m) { const d = m.lessons.filter(l => S.done[m.id + '/' + l.id]).length; return { d, t: m.lessons.length, pct: d / m.lessons.length }; }

/* ---------- Schémas ---------- */
function diagramHTML(id) {
  const d = DIAGRAMS[id]; if (!d) return '';
  if (id === 'fourStroke') return fourStrokeHTML();
  const ks = Object.keys(d.parts);
  const chips = ks.map(k => `<button class="chip" data-pc="${k}">${d.parts[k][0]}</button>`).join('');
  return `<figure class="dg" data-dg="${id}"><div class="dg-head">${d.title}<span>schéma interactif</span></div><div class="dg-svg"><svg viewBox="${d.vb}" role="img" aria-label="${d.title}">${d.svg}</svg></div><div class="dg-info"><b>${ks.length} éléments à découvrir</b><span>Touche le schéma ou un nom ci-dessous.</span></div><div class="chips">${chips}</div></figure>`;
}
document.addEventListener('click', e => {
  const fig = e.target.closest('.dg[data-dg]'); if (!fig) return;
  const d = DIAGRAMS[fig.dataset.dg]; if (!d || !d.parts) return;
  const chip = e.target.closest('[data-pc]'), shape = e.target.closest('[data-p]');
  const id = chip ? chip.dataset.pc : shape ? shape.dataset.p : null; if (!id) return;
  const svg = fig.querySelector('svg'), same = fig.dataset.sel === id;
  fig.querySelectorAll('.on').forEach(x => x.classList.remove('on'));
  if (same) { delete fig.dataset.sel; svg.classList.remove('sel'); fig.querySelector('.dg-info').innerHTML = `<b>${Object.keys(d.parts).length} éléments à découvrir</b><span>Touche le schéma ou un nom ci-dessous.</span>`; return; }
  fig.dataset.sel = id; svg.classList.add('sel');

    const pinY = cy - (r * Math.cos(th) + Math.sqrt(L * L - Math.pow(r * Math.sin(th), 2)));

    }
  }
  function loop(t) {

    if (st.playing) { if (st.last != null) st.a = (st.a + (t - st.last) * 0.1) % 720; st.last = t; } else st.last = null;

}

}

function quiz(id) {
  let qs, title, back;
  if (id === 'exam') { qs = shuffle(MODULES.flatMap(m => m.quiz.map(q => Object.assign({ mod: m.title }, q)))).slice(0, 20); title = 'Examen final'; back = 'accueil'; }
  else { const m = MODULES.find(x => x.id === id); if (!m) return home(); qs = shuffle(m.quiz.map(q => Object.assign({ mod: m.title }, q))); title = 'Quiz · ' + m.title; back = 'cours--' + m.id; }
  qs = qs.map(q => { const o = shuffle(q.a.map((_, i) => i)); return Object.assign({}, q, { a: o.map(i => q.a[i]), c: o.indexOf(q.c) }); });
  chrome(id === 'exam' ? 'Examen final' : 'Quiz', id === 'exam' ? 'accueil' : 'cours', back);
  let i = 0, score = 0; const miss = [];
  function render() {
    const q = qs[i];
    main.innerHTML = `<div class="stack"><div class="qhead"><span>${title}</span><span>${i + 1}/${qs.length} · ${score} ✓</span></div><div class="bar"><i style="width:${i / qs.length * 100}%"></i></div>
${id === 'exam' ? `<div class="eyebrow">${q.mod}</div>` : ''}<p class="qq">${q.q}</p><div class="opts">${q.a.map((a, k) => `<button class="opt" data-k="${k}"><span class="lt">${'ABCD'[k]}</span><span>${a}</span></button>`).join('')}</div><div id="fb"></div></div>`;
    main.querySelector('.opts').onclick = e => {
      const b = e.target.closest('.opt'); if (!b || b.disabled) return; const k = +b.dataset.k, ok = k === q.c;
      main.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (+x.dataset.k === q.c) x.classList.add('ok'); });
      if (!ok) { b.classList.add('ko'); miss.push(q); } else score++;
      $('#fb').innerHTML = `<div class="expl"><b style="color:var(--${ok ? 'good' : 'bad'})">${ok ? 'Exact' : 'Pas tout à fait'}</b>${q.e}</div><button class="btn block" id="nq" style="margin-top:12px">${i + 1 < qs.length ? 'Question suivante' : 'Voir mon résultat'}</button>`;
      $('#nq').onclick = () => { i++; if (i < qs.length) { render(); window.scrollTo(0, 0); } else end(); };
      $('#nq').scrollIntoView({ block: 'nearest', behavior: reduced ? 'auto' : 'smooth' });
    };
  }
  function end() {
    if (id === 'exam') S.exam = Math.max(S.exam || 0, score); else S.quiz[id] = Math.max(S.quiz[id] || 0, score);
    touch(); save();
    const pct = score / qs.length; const msg = pct === 1 ? 'Sans faute.' : pct >= .8 ? 'Très solide.' : pct >= .6 ? 'Bonne base. Relis les points ratés.' : 'Reprends les leçons du module, puis retente.';
    main.innerHTML = `<div class="stack"><div class="card" style="text-align:center"><div class="eyebrow">${title}</div><div class="score">${score}/${qs.length}</div><p style="margin:6px 0 0">${msg}</p></div>
<div class="row"><button class="btn grow" id="again">Recommencer</button><a class="btn ghost grow" href="#${back}">Retour</a></div>
${miss.length ? `<h3>À revoir</h3>${miss.map(q => `<div class="card"><b>${q.q}</b><p class="small" style="margin:6px 0 0"><span style="color:var(--good);font-weight:600">${q.a[q.c]}</span> · ${q.e}</p></div>`).join('')}` : ''}</div>`;
    $('#again').onclick = () => quiz(id); window.scrollTo(0, 0);
  }
  render();
}

function session(deck, mode) {
  const list = deck === 'all' ? ALL_CARDS : ALL_CARDS.filter(c => c.m.id === deck);
  if (!list.length) return cartes();
  chrome('Révision', 'cartes', 'cartes');

  if (!queue.length) { main.innerHTML = `<div class="card empty"><h3 style="margin-top:0">Tout est à jour</h3><p class="muted">Aucune carte n'est due pour ${deck === 'all' ? 'l\'instant' : 'ce module'}. Tu peux quand même t'entraîner sur toutes les cartes.</p><a class="btn" href="#fc--${deck}--libre">Réviser tout en mode libre</a></div>`; return; }
  const retried = new Set(); let known = 0, seen = 0;
  function render() {
    if (!queue.length) return end();
    const c = queue[0];
    main.innerHTML = `<div class="stack"><div class="qhead"><span>${mode === 'libre' ? 'Mode libre' : 'Révision du jour'}</span><span>${queue.length} restante${queue.length > 1 ? 's' : ''}</span></div>

<div class="fc-btns"><button class="btn no" id="no" disabled>À revoir</button><button class="btn yes" id="yes" disabled>Je savais</button></div></div>`;
    const fc = $('#fc'); const flip = () => { fc.classList.toggle('flip'); $('#no').disabled = $('#yes').disabled = false; };
    fc.onclick = flip; fc.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } };
    $('#yes').onclick = () => { grade(c, true); known++; seen++; queue.shift(); render(); };
    $('#no').onclick = () => { grade(c, false); seen++; queue.shift(); if (!retried.has(c.key)) { retried.add(c.key); queue.push(c); } render(); };
  }
  function end() { main.innerHTML = `<div class="stack"><div class="card" style="text-align:center"><div class="eyebrow">Session terminée</div><div class="score">${known}/${seen}</div><p>réponses connues du premier ou second coup.</p></div><a class="btn block" href="#cartes">Retour aux flashcards</a><a class="btn ghost block" href="#cours">Continuer les cours</a></div>`; }
  render();
}

    case 'q': quiz(p[1]); break;
    case 'exam': quiz('exam'); break;
    case 'fc': session(p[1] || 'all', p[2]); break;
    case 'cours': cours(p[1]); break;
    case 'cartes': cartes(); break;
    case 'outils': outils(); break;
    case 'diag': diag(); break;
    case 'glossaire': glossaire(); break;
    case 'pratique': pratique(); break;
    case 'schemas': schemas(); break;
    case 'schema': schemaView(p[1]); break;
    case 'decodeurs': decodeurs(); break;
    default: home();
  }
  if (p[0] !== 'cours' || !p[1]) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
updXP(); route();
})();
