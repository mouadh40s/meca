MODULES.push({
  id: 'freinage', title: 'Le freinage', sub: 'Hydraulique, disques, ABS, changer ses plaquettes',
  lessons: [
    { id: 'hydraulique', title: 'Le circuit hydraulique', min: 12,
      goals: ['Comprendre comment le freinage transforme le mouvement en chaleur', 'Comprendre comment un liquide multiplie la force du pied', 'Suivre le trajet de la pédale jusqu\'aux roues', 'Interpréter une pédale molle ou qui s\'enfonce'],
      body: `
<h3>Freiner, c'est chauffer</h3>
<p>Une voiture lancée possède une énergie de mouvement (l'énergie cinétique). Pour l'arrêter, il faut faire disparaître cette énergie. Les freins la transforment en <strong>chaleur</strong> par frottement.</p>
<div class="note ex">Frotte tes mains l'une contre l'autre très vite : elles chauffent. Une voiture de 1 300 kg à 90 km/h qui freine jusqu'à l'arrêt produit à peu près autant de chaleur qu'il en faut pour porter un litre d'eau de 20 °C à presque 100 °C, le tout en quelques secondes, concentré sur quatre disques. C'est pour ça que les disques peuvent dépasser 500 °C.</div>
<h3>Le problème : la force</h3>
<p>Pour arrêter une voiture d'une tonne et demie, il faut presser les plaquettes contre les disques avec une force énorme, de l'ordre de plusieurs centaines de kilos par roue. Ton pied ne peut pas fournir ça. Le circuit de freinage <strong>multiplie</strong> la force de ton pied, et la répartit sur les quatre roues.</p>
<h3>Le principe hydraulique (Pascal)</h3>
<p>Un liquide est presque <strong>incompressible</strong> : on ne peut pas réduire son volume en appuyant dessus. Quand tu pousses sur un liquide enfermé, la pression se transmet instantanément et partout de la même façon. Si cette pression appuie sur un piston plus grand, elle produit une force plus grande.</p>
<div class="note ex">Le maître-cylindre a un piston de 2 cm² de surface. Les étriers ont des pistons de 20 cm². Tu pousses le petit piston avec 100 newtons : la pression est de 100 ÷ 2 = 50 N par cm². Cette pression arrive dans l'étrier et pousse sur 20 cm² : 50 × 20 = 1 000 newtons. La force est multipliée par 10, simplement grâce au rapport des surfaces.</div>
<div class="note ana">C'est le même principe qu'un cric hydraulique de garage : en pompant avec une main, tu soulèves une voiture.</div>
<div data-d="brakeHydraulic"></div>
<h3>Le trajet, de la pédale aux roues</h3>
<ol class="steps">
<li>La <strong>pédale</strong> est un levier : elle multiplie déjà ton effort par 3 à 5.</li>
<li>Le <strong>servofrein</strong> (le gros tambour noir rond derrière le maître-cylindre, côté conducteur) amplifie encore l'effort. À l'intérieur, une membrane sépare deux chambres : quand tu freines, l'une reste en dépression (aspirée par le moteur, ou par une pompe à vide sur les diesels) et l'autre reçoit l'air ambiant. La différence de pression pousse la membrane et aide ton pied.</li>
<li>Le <strong>maître-cylindre</strong> transforme cette poussée en pression dans le liquide de frein. Au-dessus, le <strong>bocal</strong> contient la réserve de liquide.</li>
<li>Des <strong>canalisations</strong> rigides en acier, puis des <strong>flexibles</strong> en caoutchouc près des roues (qui bougent avec la suspension), amènent la pression aux quatre roues.</li>
<li>Aux roues, les pistons des <strong>étriers</strong> (freins à disque) ou des <strong>cylindres de roue</strong> (freins à tambour) poussent les garnitures contre le disque ou le tambour.</li>
</ol>
<p>Le circuit est <strong>doublé</strong> : le maître-cylindre a deux pistons, chacun alimentant un circuit séparé. Le plus souvent en X : avant gauche avec arrière droit, avant droit avec arrière gauche. Si un circuit fuit, l'autre freine encore avec une roue avant et une roue arrière, en diagonale, ce qui garde la voiture stable.</p>
<p>L'avant fait environ 70 % du travail de freinage, car le poids de la voiture bascule vers l'avant quand elle ralentit. C'est pour ça que les freins avant sont plus gros, et s'usent plus vite.</p>
<h3>Interpréter la pédale</h3>
<div class="note warn"><strong>Pédale spongieuse</strong>, molle, qui s'enfonce plus que d'habitude avant de freiner : il y a de l'<strong>air</strong> dans le circuit, ou un liquide trop vieux qui a absorbé de l'eau. L'air, contrairement au liquide, se comprime : une partie de ta course de pédale sert à comprimer les bulles au lieu de pousser les plaquettes. Il faut <strong>purger</strong> le circuit (faire sortir l'air par des vis de purge sur chaque étrier).</div>
<div class="note danger"><strong>Pédale qui descend jusqu'au plancher</strong>, ou qui s'enfonce lentement quand tu maintiens l'appui à l'arrêt : fuite de liquide ou maître-cylindre défaillant. Ne roule pas.</div>
<p>Moteur coupé, le servofrein garde de la dépression pour deux ou trois appuis, puis la pédale devient très dure. C'est normal : tu freines alors à la force du pied seule. C'est d'ailleurs ce qui arrive si le moteur cale en roulant.</p>`,
      keys: ['Freiner = transformer le mouvement en chaleur', 'Le liquide incompressible transmet la pression ; un grand piston multiplie la force', 'Pédale → servofrein → maître-cylindre → canalisations → étriers', 'Circuit doublé en X ; pédale spongieuse = air dans le circuit'] },

    { id: 'disques', title: 'Disques, plaquettes et tambours', min: 11,
      goals: ['Connaître les pièces d\'un frein à disque', 'Savoir contrôler l\'usure des disques et des plaquettes', 'Comprendre le frein à tambour', 'Connaître le piège du frein de parking électrique'],
      body: `
<div data-d="disc"></div>
<h3>Le frein à disque</h3>
<p>Le <strong>disque</strong> est fixé au moyeu, entre le moyeu et la jante : il tourne avec la roue. L'<strong>étrier</strong>, lui, est fixé au porte-moyeu : il ne tourne pas. Il enjambe le disque comme une pince. À l'intérieur, une ou plusieurs <strong>plaquettes</strong> de chaque côté du disque.</p>
<p>Quand tu freines, le liquide sous pression pousse le <strong>piston</strong> de l'étrier, qui presse les plaquettes contre le disque. Le frottement freine la roue.</p>
<ul>
<li><strong>Étrier flottant</strong> (le plus courant) : le piston n'est que d'un côté. Quand il pousse la plaquette intérieure, l'étrier glisse sur des <strong>colonnettes</strong> (des axes graissés) et ramène la plaquette extérieure contre l'autre face. Si les colonnettes se grippent, l'étrier ne coulisse plus : une plaquette s'use beaucoup plus que l'autre, ou le frein reste légèrement serré.</li>
<li><strong>Étrier fixe</strong> : des pistons des deux côtés. Plus efficace, plus cher, sur les voitures sportives.</li>
<li><strong>Disque plein</strong> : un simple disque d'acier, souvent à l'arrière.</li>
<li><strong>Disque ventilé</strong> : deux faces séparées par des ailettes. L'air circule entre elles et le refroidit mieux. Presque toujours à l'avant.</li>
</ul>
<h3>Contrôler l'usure</h3>
<p><strong>Les plaquettes</strong> : une plaquette neuve a environ 10 à 12 mm de garniture. On la remplace vers 2 à 3 mm. Beaucoup ont un <strong>témoin d'usure</strong> : soit une petite languette métallique qui vient frotter le disque et produit un grincement aigu caractéristique, soit un fil électrique noyé dans la garniture qui allume un voyant au tableau de bord quand il est atteint.</p>
<p><strong>Les disques</strong> s'usent aussi, plus lentement (on change souvent les disques toutes les deux tournées de plaquettes). Leur épaisseur minimale est gravée sur leur tranche ou leur bol.</p>
<div class="note ex">Tu lis sur un disque « MIN TH 22 mm » (minimum thickness, épaisseur minimale). Avec un pied à coulisse, tu mesures 21,6 mm. Il est en dessous de la limite : à changer. Un disque trop fin chauffe plus vite, se voile (se déforme) et peut se fissurer. On sent aussi souvent un rebord au bord extérieur du disque, là où la plaquette ne frotte pas : plus il est marqué, plus le disque est usé.</div>
<p>Un disque <strong>voilé</strong> se reconnaît à des vibrations dans le volant ou la pédale quand tu freines, surtout en descendant d'une vitesse élevée.</p>
<h3>Le frein à tambour</h3>
<p>Encore présent à l'arrière de nombreuses petites voitures (il coûte moins cher et intègre facilement le frein à main). Le <strong>tambour</strong>, une sorte de casserole en fonte, tourne avec la roue. À l'intérieur, fixes, deux <strong>mâchoires</strong> en forme de croissant, garnies de friction. Un <strong>cylindre de roue</strong> (un petit cylindre hydraulique à deux pistons) les écarte contre la paroi intérieure du tambour. Des ressorts les ramènent au repos, et un <strong>rattrapage automatique</strong> compense l'usure.</p>
<p>Il refroidit moins bien qu'un disque (la chaleur reste enfermée), d'où son usage à l'arrière, qui freine moins.</p>
<h3>Le frein de stationnement</h3>
<p>Il bloque les roues arrière à l'arrêt, mécaniquement, sans passer par le liquide :</p>
<ul>
<li>par <strong>câble</strong> : le levier tire un câble qui actionne les mâchoires ou un mécanisme dans l'étrier arrière ;</li>
<li>par <strong>moteur électrique</strong> (EPB, Electric Parking Brake) : un bouton, et un petit moteur sur chaque étrier arrière serre les plaquettes.</li>
</ul>
<div class="note warn">Avec un frein de parking électrique, on ne peut pas repousser les pistons arrière à la main pour changer les plaquettes : le mécanisme interne est une vis entraînée par le moteur électrique. Il faut passer le système en <strong>mode maintenance</strong> (avec un outil de diagnostic, ou parfois une combinaison de boutons indiquée dans le manuel), qui fait reculer les pistons électriquement. Forcer casse le moteur de l'étrier.</div>`,
      keys: ['Étrier fixe + piston + plaquettes pincent le disque qui tourne', 'Plaquettes à changer vers 2–3 mm ; témoin qui grince ou voyant', 'Épaisseur mini gravée sur le disque (ex. MIN TH 22 mm)', 'Frein de parking électrique : mode maintenance obligatoire'] },

    { id: 'abs', title: 'ABS, ESP et aides au freinage', min: 9,
      goals: ['Comprendre pourquoi une roue bloquée freine mal', 'Savoir comment l\'ABS l\'empêche', 'Comprendre le rôle de l\'ESP', 'Interpréter les voyants ABS et ESP'],
      body: `
<h3>Pourquoi une roue bloquée est un problème</h3>
<p>Un pneu adhère mieux quand il roule (même en freinant fort) que quand il glisse. Dès qu'une roue se <strong>bloque</strong>, deux choses arrivent :</p>
<ul>
<li>la distance de freinage s'allonge, car un pneu qui glisse accroche moins qu'un pneu qui roule à la limite ;</li>
<li>surtout, on perd la <strong>direction</strong> : une roue avant bloquée qui glisse ne dirige plus rien. Tu tournes le volant, la voiture continue tout droit.</li>
</ul>
<div class="note ana">Sur un sol gelé, si tu cours et que tu t'arrêtes en bloquant tes pieds, tu glisses et tu ne contrôles plus rien. Si tu freines en faisant de tout petits pas rapides, tu gardes l'équilibre et tu peux changer de direction. L'ABS fait ces « petits pas » à ta place.</div>
<h3>L'ABS : antiblocage des roues</h3>
<ul>
<li>Un <strong>capteur de vitesse</strong> sur chaque roue lit une couronne dentée ou magnétique qui tourne avec la roue. Le calculateur connaît en permanence la vitesse de chaque roue.</li>
<li>Si une roue ralentit beaucoup plus brutalement que les autres, c'est qu'elle est sur le point de se bloquer.</li>
<li>Le <strong>bloc hydraulique ABS</strong>, placé entre le maître-cylindre et les roues, relâche alors un peu la pression sur cette roue, la laisse repartir, puis remet la pression. Il répète ça jusqu'à une quinzaine de fois par seconde.</li>
</ul>
<p>Pendant un freinage d'urgence, la pédale <strong>vibre</strong> fortement et grogne : ce sont les électrovannes qui travaillent. C'est normal. La consigne est de garder l'appui à fond et de diriger la voiture, pas de relâcher.</p>
<div class="note ex">Tu freines fort sur route mouillée et un obstacle apparaît : grâce à l'ABS, tu peux freiner à fond <em>et</em> tourner le volant pour l'éviter. Sans ABS, il fallait relâcher le frein pour pouvoir tourner.</div>
<h3>L'ESP : le correcteur de trajectoire</h3>
<p>L'<strong>ESP</strong> (on dit aussi ESC ou DSC selon les marques) utilise les mêmes capteurs de roues et le même bloc hydraulique, plus deux capteurs supplémentaires :</p>
<ul>
<li>un <strong>capteur d'angle de volant</strong> : il sait où tu veux aller ;</li>
<li>un <strong>capteur de lacet</strong> : il mesure la rotation réelle de la voiture sur elle-même, comme une toupie.</li>
</ul>
<p>Il compare en permanence les deux. Si la voiture tourne trop (l'arrière glisse, on dit qu'elle <strong>survire</strong>) ou pas assez (l'avant tire tout droit, elle <strong>sous-vire</strong>), il freine automatiquement une roue précise pour la remettre en ligne, et peut réduire la puissance du moteur.</p>
<div class="note ex">Dans un virage sur route mouillée, l'arrière commence à glisser vers l'extérieur. L'ESP freine la roue avant extérieure : cela crée une force qui fait pivoter la voiture dans l'autre sens et la remet droite. Tout se passe en une fraction de seconde, souvent sans que le conducteur s'en rende compte, à part le voyant qui clignote.</div>
<h3>Les autres aides</h3>
<ul>
<li><strong>AFU</strong> (aide au freinage d'urgence) : détecte un appui très rapide sur la pédale et applique immédiatement la pression maximale. Beaucoup de conducteurs n'appuient pas assez fort en cas de panique.</li>
<li><strong>Antipatinage</strong> (ASR, TCS) : freine une roue motrice qui patine à l'accélération.</li>
<li><strong>Aide au démarrage en côte</strong> : maintient le frein une à deux secondes après que tu as relâché la pédale.</li>
</ul>
<div class="note tip">Un voyant ABS allumé en permanence vient très souvent d'un capteur de roue encrassé (boue, limaille) ou d'un câble abîmé par un caillou. Le freinage normal reste disponible, mais sans antiblocage : prudence sur route mouillée. Un lecteur OBD capable de lire l'ABS indique quel capteur est en défaut.</div>`,
      keys: ['Une roue bloquée freine moins bien et ne dirige plus', 'ABS : capteurs de roue + bloc hydraulique qui relâche et réapplique', 'Pédale qui vibre au freinage d\'urgence = normal, garder l\'appui', 'ESP : compare volant et rotation réelle, freine une roue pour corriger'] },

    { id: 'plaquettes', title: 'Pratique : changer ses plaquettes', min: 14,
      goals: ['Préparer le matériel et les pièces', 'Remplacer les plaquettes avant pas à pas', 'Connaître les erreurs à éviter', 'Faire le rodage'],
      body: `
<p>C'est l'une des premières vraies interventions qu'on peut faire soi-même. Compte 1 à 2 heures la première fois, 30 minutes avec l'habitude. Avant de commencer, regarde une vidéo pour <strong>ton modèle exact</strong> : les principes sont les mêmes partout, mais les tailles de vis et les petites particularités changent.</p>
<div class="note why">Pourquoi changer <strong>toujours les deux côtés d'un même essieu</strong> ? Si une roue freine avec des plaquettes neuves et l'autre avec des usées, elles n'ont pas la même efficacité : la voiture tire d'un côté au freinage. C'est d'ailleurs un motif de contre-visite au contrôle technique.</div>
<h3>Le matériel</h3>
<ul>
<li>Plaquettes neuves (un jeu pour un essieu = 4 plaquettes), commandées avec la plaque ou le VIN.</li>
<li>Cric, chandelle, cales, clé de roue, clé dynamométrique.</li>
<li>Douilles ou embouts pour les vis de guidage d'étrier (souvent 7 mm six-pans, 13 ou 15 mm).</li>
<li>Repousse-piston (ou un grand serre-joint et une vieille plaquette pour protéger le piston).</li>
<li>Brosse métallique, nettoyant freins en bombe, graisse spéciale freins (au cuivre ou céramique), chiffon, gants.</li>
</ul>
<h3>Les étapes</h3>
<ol class="steps">
<li>Voiture au sol, frein à main serré, desserrer d'environ un quart de tour les écrous de la roue. Voiture au sol, la roue ne peut pas tourner pendant que tu forces.</li>
<li>Lever la voiture, poser la chandelle, déposer la roue.</li>
<li>Ouvrir le bocal de liquide de frein sous le capot. En repoussant le piston, tu vas faire remonter du liquide dans le bocal : vérifie qu'il ne déborde pas (s'il est au MAX, retire un peu de liquide avec une seringue).</li>
<li>Repérer les deux vis de guidage à l'arrière de l'étrier (souvent cachées par des capuchons caoutchouc). Les dévisser en tenant la colonnette avec une clé plate si elle tourne.</li>
<li>Déposer l'étrier ou le basculer vers le haut. Ne jamais le laisser pendre par son flexible : le flexible pourrait s'abîmer à l'intérieur sans que ça se voie. Accroche l'étrier au ressort de suspension avec un fil de fer.</li>
<li>Retirer les plaquettes usées. Observe-les : usées pareil ? Si l'une est beaucoup plus usée, les colonnettes ou le piston grippent.</li>
<li>Contrôler le disque : épaisseur au-dessus du minimum, pas de fissure, pas de rayure profonde.</li>
<li>Repousser le piston dans l'étrier, doucement et bien droit, avec le repousse-piston, jusqu'à ce qu'il soit au fond. Il faut faire de la place pour les plaquettes neuves, plus épaisses. À l'arrière, certains pistons se vissent au lieu de se pousser, et avec un frein de parking électrique il faut le mode maintenance.</li>
<li>Nettoyer le support d'étrier à la brosse métallique (la rouille empêche les plaquettes de coulisser), et appliquer une très fine couche de graisse sur les points de contact métal-métal des plaquettes et sur les colonnettes. <strong>Jamais de graisse sur la garniture ni sur le disque.</strong></li>
<li>Poser les plaquettes neuves (avec leurs clips ou ressorts, dans le bon sens), remonter l'étrier, serrer les vis de guidage au couple constructeur (souvent entre 25 et 35 N·m pour les vis de guidage).</li>
<li>Faire l'autre côté de la même façon.</li>
<li>Remonter les roues, reposer la voiture au sol, serrer les écrous de roue en étoile au couple.</li>
<li><strong>Pomper la pédale</strong> plusieurs fois, moteur coupé, jusqu'à ce qu'elle redevienne ferme. Les pistons sont au fond : les premiers appuis servent à les ramener contre les plaquettes. Si tu démarres sans faire ça, ton premier freinage ne freinera presque pas.</li>
<li>Vérifier le niveau du bocal et le refermer.</li>
</ol>
<h3>Le rodage</h3>
<p>Des plaquettes neuves et un disque ne se sont pas encore « adaptés » l'un à l'autre : la surface de contact n'est pas parfaite. Pendant les 200 à 300 premiers kilomètres, freine progressivement, en évitant les freinages violents et prolongés. Le freinage sera un peu moins mordant au début, c'est normal.</p>
<div class="note danger">Le freinage est un organe de sécurité. Au moindre doute sur le remontage (une vis oubliée, une pédale molle, un bruit anormal), fais vérifier par un professionnel avant de rouler. Fais ton premier essai sur un parking vide, à basse vitesse.</div>`,

      body: `
<h3>Deux missions qui se contredisent</h3>
<p>La suspension doit à la fois :</p>
<ul>
<li>garder les pneus <strong>collés à la route</strong> en permanence, même sur une route bosselée. Un pneu qui décolle, même une fraction de seconde, ne freine plus et ne dirige plus : c'est la <strong>sécurité</strong> ;</li>
<li><strong>filtrer les chocs</strong> pour que les passagers ne les ressentent pas : c'est le <strong>confort</strong>.</li>
</ul>
<p>Une suspension très souple est confortable mais laisse la voiture tanguer et rouler en virage. Une suspension très ferme tient bien la route mais secoue. Chaque constructeur cherche un compromis.</p>
<div data-d="macpherson"></div>
<h3>Ressort et amortisseur : le duo</h3>
<p>C'est la confusion la plus fréquente, alors prenons le temps.</p>
<p>Le <strong>ressort</strong> (souvent un gros ressort hélicoïdal, comme un ressort de stylo géant) <strong>porte le poids</strong> de la voiture et <strong>absorbe le choc</strong> : quand la roue passe sur une bosse, il se comprime, puis se détend.</p>
<p>Mais un ressort seul ne s'arrête jamais de rebondir. Lâche une balle rebondissante, ou appuie sur un matelas à ressorts : ça oscille plusieurs fois.</p>
<p>L'<strong>amortisseur</strong> sert à calmer ce rebond. C'est un tube rempli d'huile dans lequel coulisse un piston percé de petits trous. Pour bouger, l'huile doit passer par ces trous, ce qui freine le mouvement. Il transforme l'énergie du rebond en chaleur.</p>
<div class="note ana">Prends une cuillère et remue-la vite dans un verre d'eau : facile. Fais pareil dans un pot de miel : c'est freiné, tu ne peux pas faire de mouvements brusques. L'amortisseur, c'est la cuillère dans le miel. Son nom est trompeur : il n'amortit pas le choc (ça, c'est le ressort), il amortit le <em>rebond</em>.</div>
<div class="note ex">Une voiture avec des amortisseurs morts passe sur un dos d'âne : l'avant monte, redescend, remonte, redescend, comme un bateau. Avec des amortisseurs en bon état, l'avant monte, redescend, et c'est fini. C'est le principe du test qu'on fait en appuyant fort sur un coin de la voiture puis en relâchant : elle doit remonter et se stabiliser presque tout de suite, sans rebondir.</div>
<h3>Les autres pièces</h3>
<dl class="defs">
<dt>Le triangle (bras de suspension)</dt><dd>Une pièce en acier, souvent en forme de triangle, qui relie le bas du porte-moyeu à la caisse. Il guide la roue pour qu'elle monte et descende sans partir en avant ou en arrière.</dd>
<dt>Les silentblocs</dt><dd>Des bagues de caoutchouc serties dans du métal, aux points d'articulation du triangle. Elles permettent le mouvement tout en filtrant les vibrations. Avec l'âge, le caoutchouc se fend ou se décolle.</dd>
<dt>La rotule</dt><dd>Une articulation en forme de boule dans une coupelle, comme l'épaule humaine. Elle relie le triangle au porte-moyeu et permet à la roue à la fois de braquer et de débattre.</dd>
<dt>La barre stabilisatrice (anti-roulis)</dt><dd>Une barre d'acier qui relie les suspensions gauche et droite. En virage, la voiture penche vers l'extérieur (c'est le <strong>roulis</strong>). La barre se tord et résiste, ce qui limite l'inclinaison. Elle est reliée aux suspensions par deux petites tiges articulées, les <strong>biellettes</strong>.</dd>
<dt>La coupelle</dt><dd>Le support du haut de l'amortisseur, fixé à la caisse, avec un roulement qui permet à l'ensemble de pivoter quand on braque.</dd>
</dl>
<p>Le <strong>MacPherson</strong>, du nom de son inventeur, est le montage le plus répandu à l'avant : l'amortisseur et le ressort forment une « jambe » qui sert aussi d'axe de pivot pour la direction. Simple, compact et peu coûteux.</p>
<h3>Les signes d'usure</h3>
<table class="tbl"><thead><tr><th>Symptôme</th><th>Pièce probable</th></tr></thead><tbody>
<tr><td>La voiture rebondit après une bosse, plonge fort au freinage, penche beaucoup en virage</td><td>Amortisseurs</td></tr>
<tr><td>Traces d'huile qui coulent sur le corps de l'amortisseur</td><td>Amortisseur qui fuit</td></tr>
<tr><td>Usure du pneu en « vagues » ou en facettes</td><td>Amortisseurs</td></tr>
<tr><td>Claquement sourd sur les petites bosses à basse vitesse (pavés, ralentisseurs)</td><td>Biellettes de barre stabilisatrice, souvent</td></tr>
<tr><td>Claquement au freinage ou au démarrage, flou dans la direction</td><td>Silentblocs de triangle</td></tr>
<tr><td>Craquement en tournant le volant à l'arrêt</td><td>Coupelle d'amortisseur</td></tr>
<tr><td>Voiture plus basse d'un côté</td><td>Ressort cassé (souvent la dernière spire)</td></tr>
</tbody></table>
<div class="note tip">On remplace amortisseurs et ressorts par paire sur un même essieu, pour que les deux côtés réagissent pareil. Un amortisseur dure souvent entre 80 000 et 150 000 km selon les routes.</div>`,
      keys: ['Ressort = porte le poids et absorbe le choc', 'Amortisseur = freine le rebond (cuillère dans le miel)', 'Barre stabilisatrice = limite le roulis ; biellettes usées = claquement sur petites bosses', 'Amortisseurs remplacés par essieu'] },

    { id: 'direction', title: 'La direction', min: 9,

      body: `
<h3>Du volant aux roues</h3>
<ol class="steps">
<li>Le <strong>volant</strong> est relié à la <strong>colonne de direction</strong>, un arbre qui descend vers le compartiment moteur.</li>
<li>Au bout de la colonne, un petit <strong>pignon</strong> engrène sur une barre dentée horizontale : la <strong>crémaillère</strong>. Quand le pignon tourne, la crémaillère se déplace vers la gauche ou la droite.</li>
<li>À chaque extrémité de la crémaillère, une <strong>biellette de direction</strong> (ou « biellette axiale ») la relie à la roue.</li>
<li>Au bout de la biellette, une <strong>rotule de direction</strong> se fixe sur un bras du porte-moyeu.</li>
<li>Quand la crémaillère pousse ou tire, le porte-moyeu pivote : la roue braque.</li>
</ol>
<div class="note ana">Pose une règle sur une table et une pièce de monnaie dessus. Fais rouler la pièce en la tournant avec ton doigt : la règle avance d'un côté ou de l'autre. Le pignon est la pièce, la crémaillère est la règle. Tu transformes une rotation en mouvement en ligne droite.</div>
<div class="note ex">Sur une voiture courante, il faut environ 2,5 à 3 tours de volant pour aller d'une butée à l'autre, pendant que les roues pivotent d'environ 35 à 40° de chaque côté. Le système démultiplie : un grand mouvement du volant pour un petit mouvement des roues, ce qui rend la direction précise et moins dure.</div>
<h3>L'assistance</h3>
<p>À l'arrêt, une voiture moderne avec des pneus larges serait très dure à braquer à la seule force des bras. On ajoute donc une assistance :</p>
<ul>
<li><strong>Hydraulique</strong> (voitures plus anciennes) : une pompe entraînée par la courroie d'accessoires met de l'huile sous pression, qui aide à pousser la crémaillère. Elle a un réservoir de liquide. Elle siffle ou gémit quand le niveau est bas ou quand on reste en butée.</li>
<li><strong>Électrique</strong> (la norme aujourd'hui) : un moteur électrique, sur la colonne ou directement sur la crémaillère. Pas de liquide, pas de pompe, moins de consommation, et elle permet les aides modernes : stationnement automatique, maintien dans la voie.</li>
</ul>
<h3>Les symptômes</h3>
<ul>
<li><strong>Jeu dans le volant</strong> : on peut tourner un peu le volant sans que les roues réagissent, ou la direction est floue. Souvent des rotules ou des biellettes de direction usées.</li>
<li><strong>Claquement</strong> en roulant sur des pavés ou en tournant le volant d'un côté à l'autre : rotules usées.</li>
<li>Le <strong>volant n'est pas droit</strong> en ligne droite, ou la voiture tire d'un côté : géométrie à refaire (leçon suivante).</li>
<li>La direction devient <strong>dure d'un coup</strong> : perte d'assistance. Pour une électrique, regarde les voyants et les fusibles. Pour une hydraulique, le niveau de liquide et la courroie.</li>
</ul>
<div class="note warn">Après le remplacement d'une rotule ou d'une biellette de direction, un <strong>réglage du parallélisme</strong> est obligatoire. La position de la rotule sur la biellette détermine l'angle de la roue : quelques millimètres d'écart suffisent à faire tirer la voiture et à user un pneu en quelques milliers de kilomètres.</div>`,
      keys: ['Volant → colonne → pignon → crémaillère → biellettes → rotules → roues', 'Le pignon transforme la rotation en mouvement latéral de la crémaillère', 'Assistance hydraulique ou électrique', 'Changement de rotule ou biellette = parallélisme à refaire'] },

    { id: 'geometrie', title: 'La géométrie des trains', min: 11,
      goals: ['Comprendre pourquoi les roues ne sont pas parfaitement droites', 'Savoir ce que sont le parallélisme, le carrossage et la chasse', 'Relier une usure de pneu à un défaut de géométrie', 'Savoir quand faire contrôler la géométrie'],
      body: `
<p>On pourrait croire que les roues d'une voiture sont parfaitement verticales et parfaitement parallèles. En fait, elles sont légèrement inclinées, de quelques dixièmes de degré à quelques degrés, selon des angles précis choisis par le constructeur. Ces angles assurent la stabilité en ligne droite, le retour du volant au centre après un virage, et une usure régulière des pneus. On appelle l'ensemble la <strong>géométrie</strong> (ou le « train avant » et le « train arrière »).</p>
<p>Il y a trois angles principaux. Chacun se regarde depuis un point de vue différent :</p>
<div data-d="geometry"></div>
<h3>1. Le parallélisme : vu de dessus</h3>
<p>Imagine que tu regardes la voiture depuis un drone. Les deux roues avant sont-elles parfaitement parallèles ?</p>
<ul>
<li>Si l'avant des roues se rapproche, comme des pieds tournés vers l'intérieur : c'est un <strong>pincement</strong>.</li>
<li>Si l'avant des roues s'écarte, comme les pieds d'un canard : c'est une <strong>ouverture</strong>.</li>
</ul>
<p>Le constructeur choisit un très léger pincement ou une très légère ouverture (souvent quelques millimètres, ou une fraction de degré), qui compense la façon dont les roues ont tendance à s'ouvrir ou se fermer en roulant.</p>
<div class="note ex">Un parallélisme déréglé fait <strong>frotter</strong> le pneu sur la route au lieu de le faire rouler parfaitement droit. Passe ta main sur la bande de roulement d'avant en arrière, puis d'arrière en avant : si c'est lisse dans un sens et que ça accroche comme une râpe dans l'autre, on dit que le pneu s'use « en dents de scie ». Signe typique d'un parallélisme faux. Un pneu peut être détruit en 5 000 km.</div>
<h3>2. Le carrossage : vu de face</h3>
<p>Maintenant, place-toi devant la voiture. Les roues sont-elles verticales ?</p>
<ul>
<li>Si le haut des roues penche vers l'intérieur de la voiture (comme un « A ») : carrossage <strong>négatif</strong>.</li>
<li>Si le haut penche vers l'extérieur (comme un « V ») : carrossage <strong>positif</strong>.</li>
</ul>
<p>Les voitures modernes ont un léger carrossage négatif (souvent entre −0,5° et −1,5°). En virage, la voiture penche vers l'extérieur, et ce léger angle permet au pneu extérieur de se retrouver bien à plat sur la route, là où il travaille le plus.</p>
<div class="note ex">Un carrossage trop négatif (souvent après un choc violent contre un trottoir qui a tordu une pièce) use uniquement <strong>l'intérieur</strong> du pneu. C'est sournois, car on ne voit pas l'intérieur du pneu sans se pencher : tu le découvres quand la toile apparaît.</div>
<h3>3. La chasse : vu de côté</h3>
<p>Enfin, regarde la roue avant de profil. Elle pivote autour d'un axe (l'axe qui passe par la rotule du bas et la coupelle du haut). Cet axe n'est pas vertical : il est incliné vers l'arrière en haut.</p>
<div class="note ana">Regarde la fourche d'un vélo : elle est inclinée vers l'arrière. C'est grâce à ça qu'un vélo roule droit tout seul, et que tu peux lâcher le guidon. Ou pense à la roulette d'un caddie : elle se place toujours derrière son axe et s'aligne d'elle-même dans le sens de la marche. La chasse, c'est ça.</div>
<p>La chasse donne la <strong>stabilité en ligne droite</strong> et fait <strong>revenir le volant au centre</strong> tout seul après un virage. Une chasse incorrecte (pièce tordue) donne une voiture instable ou un volant qui ne revient pas.</p>
<h3>Qu'est-ce qui est réglable ?</h3>
<p>Sur la plupart des voitures courantes, seul le <strong>parallélisme</strong> se règle : on visse ou dévisse les biellettes de direction pour les allonger ou les raccourcir. Le carrossage et la chasse dépendent de la forme de pièces fixes (triangles, porte-moyeux, berceau). S'ils sont faux, c'est qu'une pièce est tordue, et il faut la remplacer.</p>
<h3>Quand faire contrôler la géométrie ?</h3>
<ul>
<li>après un choc (trottoir, nid-de-poule profond) ;</li>
<li>après le remplacement d'une rotule, d'une biellette ou d'un triangle ;</li>
<li>si la voiture tire d'un côté sur route plate ou si le volant n'est pas droit ;</li>
<li>si un pneu s'use de façon anormale ou plus vite que l'autre ;</li>
<li>idéalement, lors du montage de pneus neufs.</li>
</ul>
<p>Le réglage se fait sur un banc de géométrie, avec des capteurs fixés sur les roues. Compte environ 60 à 100 €.</p>`,
      keys: ['Parallélisme = vue de dessus (pincement / ouverture)', 'Carrossage = vue de face (négatif : le haut rentre)', 'Chasse = vue de côté, comme la fourche d\'un vélo : stabilité et retour du volant', 'Parallélisme faux = usure en dents de scie ; seul le parallélisme est généralement réglable'] },

<tr><td>55</td><td>La <strong>série</strong> : la hauteur du flanc exprimée en <em>pourcentage</em> de la largeur</td><td>Le flanc fait 55 % de 205 mm, soit environ 113 mm de haut</td></tr>
<tr><td>R</td><td>La <strong>structure</strong> : R = radiale (la toile interne est disposée en rayons). C'est le cas de tous les pneus de voiture actuels</td><td>Pneu radial</td></tr>

<tr><td>V</td><td>L'<strong>indice de vitesse</strong> : une lettre qui renvoie à un tableau</td><td>V = 240 km/h maximum</td></tr>

<div class="note why">Pourquoi un pourcentage pour la hauteur, et pas directement des millimètres ? Parce que ça décrit la <em>forme</em> du pneu. Une série basse (40, 45) donne un flanc fin : pneu sportif, plus précis mais moins confortable. Une série haute (65, 70) donne un flanc épais : pneu confortable, typique des petites voitures et des SUV.</div>
<div class="note ex">Comparons deux pneus de même largeur : un 205/45 a un flanc de 205 × 0,45 ≈ 92 mm. Un 205/65 a un flanc de 205 × 0,65 ≈ 133 mm. Ce dernier est 4 cm plus épais : beaucoup plus de caoutchouc pour absorber les trous.</div>
<p>On peut calculer le diamètre total de la roue : jante (16 × 25,4 = 406 mm) + deux fois le flanc (2 × 113 = 226 mm) = environ 632 mm. Si tu changes de dimension de pneus, ce diamètre doit rester quasiment identique, sinon le compteur de vitesse et l'ABS sont faussés.</p>
<p>Les deux tableaux d'indices, les plus courants :</p>

</tbody></table>
<p>Le pneu doit avoir des indices au moins égaux à ceux indiqués sur la carte grise ou le certificat de conformité. On peut monter mieux, jamais moins bien (sauf pneus hiver, avec une tolérance sur la vitesse).</p>
<p>Essaie avec le marquage de ta propre voiture : touche chaque partie pour l'explication.</p>
<div data-w="pneu"></div>
<h3>La date de fabrication</h3>
<p>Quelque part sur le flanc, après les lettres <strong>DOT</strong>, se trouve un code se terminant par 4 chiffres encadrés : <strong>la semaine puis l'année</strong> de fabrication.</p>
<div class="note ex"><strong>2324</strong> = 23e semaine de 2024, soit début juin 2024. <strong>0719</strong> = 7e semaine de 2019, mi-février 2019. Un pneu « neuf » acheté en 2026 mais fabriqué en 2021 a déjà 5 ans.</div>
<p>Le caoutchouc durcit avec le temps, même si le pneu roule peu et semble avoir beaucoup de gomme : il accroche alors beaucoup moins, surtout sur le mouillé. Au-delà de 6 à 10 ans, il est raisonnable de le remplacer, quelle que soit son usure.</p>
<h3>L'usure</h3>
<p>La profondeur minimale légale en France est de <strong>1,6 mm</strong>. Pour la vérifier sans outil, cherche les <strong>témoins d'usure</strong> : de petits bossages au fond des rainures principales, repérés sur le flanc par un petit triangle ou les lettres « TWI » (Tread Wear Indicator). Quand la surface du pneu arrive au niveau du bossage, il est à 1,6 mm.</p>
<div class="note why">Un pneu neuf a environ 8 mm de profondeur. Les rainures servent à évacuer l'eau : à 90 km/h sous la pluie, un pneu doit évacuer plusieurs litres d'eau par seconde. Sous 3 mm environ, il en évacue nettement moins et le risque d'aquaplaning augmente fortement. Beaucoup de spécialistes recommandent de changer vers 3 mm sans attendre la limite légale.</div>
<h3>La pression</h3>
<p>La bonne pression est indiquée sur une étiquette dans l'encadrement de la porte conducteur, ou dans la trappe à carburant. Elle s'exprime en <strong>bars</strong> (souvent entre 2,0 et 2,8 bars), parfois aussi en PSI (unité américaine : 2,2 bars ≈ 32 PSI).</p>
<ul>
<li>Elle se règle <strong>à froid</strong> (moins de 2 à 3 km parcourus). Un pneu chaud a une pression plus élevée, car l'air se dilate : si tu dégonfles un pneu chaud pour atteindre la valeur, il sera sous-gonflé une fois froid.</li>
<li>L'étiquette donne souvent deux valeurs : charge normale et pleine charge. Avant un départ en vacances chargé, on gonfle à la valeur pleine charge.</li>
<li>Un pneu perd naturellement environ 0,1 bar par mois : contrôle une fois par mois.</li>
</ul>
<table class="tbl"><thead><tr><th>Pneu</th><th>Usure</th><th>Autres effets</th></tr></thead><tbody>
<tr><td>Sous-gonflé</td><td>Sur les deux bords (épaules)</td><td>Échauffement (risque d'éclatement), surconsommation, tenue de route molle</td></tr>
<tr><td>Surgonflé</td><td>Au centre</td><td>Moins d'adhérence, moins de confort</td></tr>
<tr><td>Bien gonflé</td><td>Régulière sur toute la largeur</td><td></td></tr>
</tbody></table>
<p>On monte des pneus identiques (même marque, modèle, dimension) sur un même essieu. Si on ne change que deux pneus, les neufs se montent à l'<strong>arrière</strong> : sur route mouillée, un arrière qui adhère moins que l'avant fait partir la voiture en tête-à-queue, alors qu'un avant moins adhérent fait juste tirer tout droit, ce qui est plus facile à rattraper.</p>
<h3>Serrer une roue</h3>
<ol class="steps">
<li>Visser tous les écrous à la main, la roue bien en appui sur le moyeu.</li>
<li>Serrer légèrement <strong>en étoile</strong> : un écrou, puis celui d'en face, et ainsi de suite en croisant. Ça centre la roue sur le moyeu.</li>
<li>Reposer la voiture au sol.</li>
<li>Serrer au couple constructeur, toujours en étoile, avec une clé dynamométrique.</li>
<li>Après 50 à 100 km, revérifier le serrage.</li>
</ol>`,

      body: `
<h3>Le cerveau de la voiture</h3>
<p>Il y a quarante ans, le moteur était réglé mécaniquement : la pédale tirait un câble, un carburateur dosait l'essence avec des gicleurs. Aujourd'hui, un ordinateur décide de tout, plusieurs centaines de fois par seconde. On l'appelle le <strong>calculateur moteur</strong>, ou ECU (Engine Control Unit).</p>
<div class="note ana">Ton corps fonctionne pareil. Tes yeux, tes oreilles et ta peau (les <strong>capteurs</strong>) envoient des informations à ton cerveau (le <strong>calculateur</strong>), qui décide et envoie des ordres à tes muscles (les <strong>actionneurs</strong>). Tu touches une plaque chaude, ta peau prévient, ton cerveau décide, ta main se retire.</div>
<div data-d="ecu"></div>
<h3>Les capteurs principaux</h3>
<table class="tbl"><thead><tr><th>Capteur</th><th>Ce qu'il mesure</th><th>S'il lâche…</th></tr></thead><tbody>
<tr><td>Capteur de vilebrequin (régime / PMH)</td><td>La position exacte et la vitesse du vilebrequin, en lisant une roue dentée</td><td>Le moteur ne démarre pas, ou cale brutalement. Le compte-tours ne bouge pas au démarreur.</td></tr>
<tr><td>Capteur d'arbre à cames</td><td>Quel cylindre est en compression (le vilebrequin seul ne le dit pas, car il fait 2 tours par cycle)</td><td>Démarrage long, parfois mode dégradé</td></tr>
<tr><td>Sonde de température du liquide</td><td>La température moteur</td><td>Démarrage difficile, consommation élevée, ventilateur qui tourne en permanence</td></tr>
<tr><td>Débitmètre d'air</td><td>La masse d'air admise</td><td>Perte de puissance, fumée noire, à-coups</td></tr>
<tr><td>Sonde lambda</td><td>L'oxygène dans les gaz d'échappement</td><td>Consommation en hausse, voyant moteur</td></tr>
<tr><td>Capteur de pédale d'accélérateur</td><td>La demande du conducteur (il n'y a plus de câble)</td><td>Mode dégradé, la voiture n'accélère plus ou peu</td></tr>
<tr><td>Capteur de cliquetis</td><td>Un micro vissé sur le bloc qui « entend » les combustions anormales</td><td>Le calculateur réduit l'avance par sécurité : perte de puissance</td></tr>
</tbody></table>
<p>Les <strong>actionneurs</strong>, eux, exécutent : injecteurs, bobines d'allumage, boîtier papillon motorisé, vanne EGR, régulation du turbo, motoventilateur, pompe à carburant.</p>
<div class="note ex">Au ralenti, le calculateur lit : 820 tr/min, liquide à 88 °C, 3 g/s d'air, pédale relâchée, sonde lambda indiquant un mélange légèrement riche. Il en déduit : ouvrir chaque injecteur 2,1 millisecondes au lieu de 2,2, allumer 8° avant le PMH, ventilateur arrêté. Et il recommence le calcul quelques millisecondes plus tard.</div>
<h3>Le multiplexage : le bus CAN</h3>
<p>Une voiture moderne compte souvent plusieurs dizaines de calculateurs : moteur, boîte, ABS/ESP, airbags, climatisation, tableau de bord, portes, phares… Plutôt que de relier chacun à tous les autres par des centaines de fils, ils partagent un réseau de deux fils torsadés, le <strong>bus CAN</strong>, sur lequel ils échangent des messages. Comme un réseau informatique dans ta voiture.</p>
<div class="note ex">La vitesse affichée au compteur vient des capteurs de roues de l'ABS. Le calculateur ABS l'envoie sur le réseau, et le tableau de bord, la boîte automatique et le régulateur de vitesse la lisent. Si le calculateur ABS ne communique plus, plusieurs voyants peuvent s'allumer d'un coup et le compteur peut tomber à zéro : une seule panne, beaucoup de symptômes.</div>
<h3>Le mode dégradé</h3>
<p>Quand un capteur envoie une valeur impossible ou qu'un défaut grave est détecté, le calculateur passe en <strong>mode dégradé</strong> (aussi appelé « mode sécurité » ou « limp mode ») : il limite la puissance et le régime pour protéger le moteur, tout en te permettant de rouler jusqu'à un garage. C'est un signal d'alerte, pas une panne en soi. Couper et redémarrer le moteur le fait parfois disparaître temporairement, mais le défaut reste enregistré.</p>`,

<h3>La prise de diagnostic</h3>
<p>Quand le calculateur détecte une anomalie, il l'enregistre sous forme de <strong>code défaut</strong>. Pour les lire, toutes les voitures vendues en Europe depuis 2001 (essence) et 2004 (diesel) ont une prise normalisée : la prise <strong>OBD</strong> (On-Board Diagnostics, en Europe on parle d'EOBD). C'est un connecteur trapézoïdal à 16 broches, presque toujours sous le volant ou près de la boîte à fusibles, parfois derrière un petit cache.</p>
<p>Tu y branches un lecteur (une valise de diagnostic, ou un petit boîtier Bluetooth relié à une appli sur ton téléphone), contact mis, et tu lis les codes.</p>
<h3>Lire un code : P0301</h3>
<p>Un code OBD a toujours 5 caractères, et chacun a un sens :</p>
<table class="tbl"><thead><tr><th>Position</th><th>Dans P0301</th><th>Signification</th></tr></thead><tbody>
<tr><td>1re lettre</td><td>P</td><td>Le système concerné : <strong>P</strong> = groupe motopropulseur (moteur et boîte, « Powertrain »), <strong>B</strong> = carrosserie (« Body » : airbags, confort), <strong>C</strong> = châssis (ABS, direction), <strong>U</strong> = réseau de communication</td></tr>
<tr><td>2e caractère</td><td>0</td><td><strong>0</strong> = code générique : il veut dire la même chose sur toutes les marques. <strong>1</strong> = code propre au constructeur : il faut une documentation de la marque</td></tr>
<tr><td>3e caractère</td><td>3</td><td>Le sous-système : 1 et 2 = air et carburant, <strong>3 = allumage et ratés</strong>, 4 = dépollution, 5 = ralenti et vitesse, 6 = calculateur, 7 à 9 = boîte</td></tr>
<tr><td>4e et 5e</td><td>01</td><td>Le défaut précis. Pour les ratés, c'est le numéro du cylindre : 01 = cylindre 1</td></tr>
</tbody></table>
<div class="note ex">P0301 se lit donc : « moteur – code générique – allumage/ratés – cylindre 1 ». Raté d'allumage sur le cylindre 1. De la même façon, P0420 : moteur, générique, dépollution, défaut 20 = efficacité du catalyseur insuffisante. Et P0171 : moteur, générique, air/carburant, défaut 71 = mélange trop pauvre.</div>
<p>Essaie avec d'autres codes :</p>
<div data-w="obd"></div>
<h3>Un code n'est pas une pièce</h3>
<p>C'est la leçon la plus importante du diagnostic. Le code dit <strong>ce que le calculateur a constaté</strong>, pas quelle pièce est cassée.</p>
<div class="note ex">P0171 « mélange trop pauvre » veut dire : la sonde lambda voit trop d'oxygène, et le calculateur a beau rajouter du carburant, ça ne suffit pas. Les causes possibles : une prise d'air sur une durite (très fréquent), un débitmètre encrassé qui sous-estime l'air, une pompe à carburant faible, un filtre à carburant colmaté, un injecteur bouché. La sonde lambda, elle, fonctionne peut-être parfaitement : elle a juste rapporté ce qu'elle voyait. Changer la sonde parce que le code parle de mélange serait de l'argent jeté.</div>
<h3>Les règles d'or</h3>

<li><strong>Effacer un code ne répare rien.</strong> Le voyant s'éteint, mais si la cause est toujours là, le défaut revient après quelques trajets.</li>

<li>Les lecteurs génériques lisent très bien le moteur (codes P0xxx). Pour l'ABS, l'airbag, la boîte automatique ou les codes constructeur (P1xxx), il faut un outil plus complet ou spécifique à la marque.</li>
</ul>`,

<tr><td>Batterie</td><td>L'alternateur ne charge plus</td><td>La voiture roule sur la batterie : il reste environ 20 à 60 minutes selon les équipements. Couper tout ce qui est inutile (clim, radio, sièges chauffants), aller directement au garage. Vérifier la courroie d'accessoires : si elle est cassée et qu'elle entraînait la pompe à eau, la surchauffe suit.</td></tr>
<tr><td>Point d'exclamation dans un cercle, ou « BRAKE »</td><td>Frein de parking serré, ou niveau de liquide de frein bas</td><td>Desserrer le frein à main. Si le voyant reste, contrôler le niveau du bocal. Niveau bas : ne pas rouler.</td></tr>
<tr><td>Personnage avec ceinture</td><td>Ceinture non bouclée</td><td>La boucler.</td></tr>
</tbody></table>
<h3>Le voyant moteur : fixe ou clignotant</h3>
<p>Le voyant orange en forme de silhouette de moteur (aussi appelé « check engine » ou voyant de dépollution) s'allume pour tout défaut de gestion moteur ou de pollution. Il peut s'agir de presque rien (bouchon de réservoir mal fermé) comme de quelque chose de sérieux.</p>
<ul>
<li><strong>Fixe</strong> : un défaut est enregistré. On peut rouler normalement, mais il faut lire le code rapidement. Sans ça, impossible de savoir s'il est bénin, et une voiture avec ce voyant allumé est recalée au contrôle technique.</li>
<li><strong>Clignotant</strong> : des ratés de combustion importants sont en cours. Du carburant non brûlé part dans l'échappement et peut faire surchauffer et fondre le catalyseur (une pièce qui coûte souvent plusieurs centaines d'euros). Réduire immédiatement l'allure, éviter d'accélérer fort, et faire vérifier au plus vite.</li>
</ul>
<h3>Les voyants orange courants</h3>
<table class="tbl"><thead><tr><th>Voyant</th><th>Signification et conduite à tenir</th></tr></thead><tbody>
<tr><td>Ressort (diesel)</td><td>Préchauffage. Normal quelques secondes au contact : attendre qu'il s'éteigne avant de démarrer. S'il clignote en roulant : défaut moteur diesel.</td></tr>
<tr><td>ABS</td><td>Antiblocage désactivé. Le freinage classique fonctionne, mais sans l'antiblocage : prudence sur le mouillé.</td></tr>
<tr><td>Voiture qui dérape</td><td>ESP. S'il clignote, c'est que l'ESP est en train d'intervenir (route glissante, lève le pied). S'il reste fixe, il est désactivé ou en défaut.</td></tr>
<tr><td>Personnage avec un ballon</td><td>Airbag. Les airbags et les prétensionneurs de ceinture pourraient ne pas se déclencher en cas d'accident. À faire vérifier.</td></tr>
<tr><td>Fer à cheval avec un point d'exclamation</td><td>Pression des pneus. Un pneu a perdu de la pression. Contrôler les quatre pressions, regonfler, puis réinitialiser le système (procédure dans le manuel).</td></tr>
<tr><td>Boîte avec des points (diesel)</td><td>FAP chargé. Rouler une vingtaine de minutes sur voie rapide à régime régulier, si possible, pour permettre la régénération.</td></tr>
<tr><td>Clé plate ou « SERVICE »</td><td>Entretien à prévoir. Pas une panne : un rappel.</td></tr>
</tbody></table>
<div class="note tip">Les pictogrammes varient un peu selon les marques. La page « voyants » du manuel de ta voiture est l'une des plus utiles : prends cinq minutes pour la parcourir au calme, avant d'en avoir besoin sur le bord de la route.</div>`,

      body: `
<p>Le réflexe du débutant, c'est : « ça fait ça, donc c'est telle pièce, je la change ». Si ça ne marche pas, on change la suivante. Les mécaniciens appellent ça « jouer au lance-pièces ». C'est cher, ça prend du temps, et ça n'apprend rien. Un bon mécanicien raisonne comme un médecin ou un enquêteur : il observe, il formule des hypothèses, il les teste, et seulement ensuite il répare.</p>
<h3>La méthode en 7 étapes</h3>
<ol class="steps">
<li><strong>Comprendre le symptôme précisément.</strong> Pas « ça fait un bruit », mais : quel bruit ? D'où vient-il ? Depuis quand ? À froid ou à chaud ? À l'arrêt ou en roulant ? À quelle vitesse ? En accélérant, en freinant, en tournant ? Sur bosses ? Tout le temps ou de temps en temps ?</li>
<li><strong>Reproduire le problème</strong> si possible, par un essai routier dans les conditions décrites. Un symptôme qu'on a vu soi-même vaut dix descriptions.</li>
<li><strong>Vérifier les bases.</strong> Niveaux, état de la batterie, fusibles, connecteurs débranchés, durites fendues, fuites visibles, câbles rongés. Une bonne partie des pannes se trouve ici, et ça ne coûte rien.</li>
<li><strong>Lire les codes défaut</strong> et les données en direct.</li>
<li><strong>Lister les causes possibles</strong>, et les classer : d'abord les plus probables et les plus simples à vérifier, ensuite les plus rares et les plus compliquées.</li>
<li><strong>Tester avant de remplacer.</strong> Mesurer une tension, une résistance, une pression, écouter avec un stéthoscope de mécanicien, intervertir deux pièces identiques. Chaque test confirme ou élimine une hypothèse.</li>
<li><strong>Réparer, puis vérifier.</strong> Effacer les codes, faire un essai routier dans les conditions où le problème apparaissait, relire les codes.</li>
</ol>
<h3>Un cas concret, pas à pas</h3>
<div class="note ex"><strong>Le symptôme</strong> : « Ma voiture essence tremble au ralenti depuis une semaine, et le voyant moteur est allumé. »<br><strong>Questions</strong> : à froid ou à chaud ? « Surtout à froid, ça va un peu mieux une fois chaud. » Perte de puissance ? « Un peu. » Le voyant clignote ? « Non, il est fixe. »<br><strong>Les bases</strong> : niveau d'huile bon, pas de fuite visible, toutes les durites bien en place.<br><strong>Les codes</strong> : P0302, raté d'allumage cylindre 2.<br><strong>Les hypothèses</strong>, classées : bobine du cylindre 2 (fréquent, facile à tester), bougie du cylindre 2 (fréquent, facile), injecteur du cylindre 2 (moins fréquent), problème de compression (rare, plus long à vérifier).<br><strong>Le test</strong> : on intervertit les bobines 2 et 3, on efface, on roule. Le code revient en P0303 : le défaut a suivi la bobine.<br><strong>La réparation</strong> : une bobine neuve sur le cylindre 3 (où se trouve maintenant la mauvaise). Code effacé, essai à froid le lendemain : plus de tremblement, plus de code. Coût : une bobine, au lieu de quatre bougies, quatre bobines et un injecteur.</div>
<h3>Les bons réflexes</h3>
<ul>
<li><strong>Le plus simple d'abord.</strong> Une panne de démarrage est plus souvent une batterie qu'un calculateur.</li>
<li><strong>Un seul changement à la fois.</strong> Si tu changes trois choses en même temps et que ça marche, tu ne sauras jamais laquelle était en cause.</li>
<li><strong>Cherche les pannes connues.</strong> Tape « code moteur + symptôme » sur internet (par exemple « K9K perte de puissance »). Les mêmes pannes reviennent souvent sur un même moteur, et les forums et bulletins techniques des constructeurs font gagner des heures.</li>
<li><strong>Note tout</strong> : ce que tu as vérifié, mesuré, changé. Ça évite de tourner en rond.</li>
</ul>
<p>Pour t'entraîner, va dans <strong>Outils → Diagnostic</strong> : chaque symptôme y est présenté avec ses causes classées de la plus probable à la plus rare.</p>`,

MODULES.push({
  id: 'entretien', title: 'Entretien et pannes courantes', sub: 'Plan d\'entretien, contrôles, symptômes, CT',

    { id: 'plan', title: 'Le plan d\'entretien', min: 10,
      goals: ['Savoir où trouver le plan d\'entretien de sa voiture', 'Comprendre la règle « km ou années »', 'Connaître les ordres de grandeur des intervalles', 'Savoir ce que sont les conditions sévères'],
      body: `
<p>L'entretien, c'est remplacer les pièces d'usure et les fluides <em>avant</em> qu'ils ne causent une panne. Une voiture bien entretenue peut dépasser 300 000 km ; une voiture négligée casse souvent bien avant 150 000.</p>
<h3>La référence : le carnet constructeur</h3>
<p>Chaque constructeur publie un <strong>plan d'entretien</strong> pour chaque moteur : ce qu'il faut remplacer, et quand. On le trouve dans le carnet d'entretien papier, dans le manuel, sur le site ou l'appli de la marque, ou en demandant à un garage de la marque avec le VIN. C'est toujours lui qui fait foi : les valeurs varient énormément d'un moteur à l'autre.</p>
<h3>La règle « km ou années »</h3>
<p>Presque tous les intervalles sont exprimés en double : par exemple « 20 000 km ou 1 an ». On fait l'opération <strong>dès que l'un des deux est atteint</strong>, le premier des deux.</p>
<div class="note why">Pourquoi un délai en années, même si la voiture roule peu ? Parce que beaucoup de choses vieillissent avec le temps, pas avec les kilomètres : l'huile s'oxyde et se charge d'humidité, le liquide de frein absorbe l'eau, le caoutchouc des courroies et des durites durcit et se craquelle.</div>
<div class="note ex">Ta voiture fait 8 000 km par an. Le carnet dit « vidange tous les 20 000 km ou 1 an ». Tu fais donc une vidange chaque année, à 8 000, 16 000, 24 000 km, même si tu n'atteins jamais les 20 000 km entre deux vidanges.</div>
<h3>Les ordres de grandeur</h3>
<table class="tbl"><thead><tr><th>Élément</th><th>Fréquence indicative</th><th>Pourquoi</th></tr></thead><tbody>
<tr><td>Vidange + filtre à huile</td><td>10 000 à 30 000 km ou 1 à 2 ans</td><td>L'huile se dégrade et se charge d'impuretés</td></tr>
<tr><td>Filtre à air</td><td>20 000 à 60 000 km</td><td>Un filtre colmaté étouffe le moteur</td></tr>
<tr><td>Filtre d'habitacle</td><td>Tous les ans ou 15 000 à 20 000 km</td><td>Il filtre l'air que tu respires ; colmaté, la ventilation faiblit et les vitres s'embuent</td></tr>
<tr><td>Filtre à gazole</td><td>30 000 à 60 000 km</td><td>Protège les injecteurs diesel, très sensibles</td></tr>
<tr><td>Bougies d'allumage</td><td>30 000 à 100 000 km selon le type</td><td>Les électrodes s'usent</td></tr>
<tr><td>Courroie de distribution</td><td>Selon constructeur (km ou années)</td><td>Sa casse détruit le moteur</td></tr>
<tr><td>Courroie d'accessoires</td><td>Souvent avec la distribution, ou à l'usure</td><td>Entraîne l'alternateur</td></tr>
<tr><td>Liquide de frein</td><td>Tous les 2 ans</td><td>Il absorbe l'humidité</td></tr>
<tr><td>Liquide de refroidissement</td><td>Souvent 4 à 5 ans</td><td>Ses additifs anticorrosion s'épuisent</td></tr>
<tr><td>Plaquettes et disques</td><td>À l'usure (contrôle à chaque vidange)</td><td>Pièces de friction</td></tr>
<tr><td>Balais d'essuie-glace</td><td>Tous les ans environ</td><td>Le caoutchouc durcit au soleil et au gel</td></tr>
<tr><td>Batterie</td><td>Durée de vie typique 4 à 6 ans</td><td>Elle perd progressivement sa capacité</td></tr>
</tbody></table>
<h3>Les conditions sévères</h3>
<p>Les intervalles standards supposent un usage « normal » : des trajets assez longs pour que le moteur chauffe bien. Les carnets prévoient des intervalles raccourcis en <strong>conditions sévères</strong> :</p>
<ul>
<li>petits trajets répétés (moins de 10 km), surtout par temps froid ;</li>
<li>circulation urbaine dense, bouchons, beaucoup de ralenti ;</li>
<li>routes poussiéreuses ;</li>
<li>remorquage, caravane, voiture souvent chargée ;</li>
<li>climats très chauds ou très froids ; conduite sportive.</li>
</ul>
<div class="note ex">Un taxi parisien ou une voiture qui fait 4 km par jour pour aller à l'école sont en conditions sévères, même s'ils roulent peu. Leur huile ne chauffe jamais assez pour évaporer l'eau de condensation et le carburant qui s'y mélangent.</div>
<div class="note tip">Tiens un carnet : date, kilométrage, opération, références des pièces et de l'huile, avec les factures. C'est indispensable pour suivre l'entretien, et ça rassure énormément un acheteur à la revente.</div>`,
      keys: ['Le carnet constructeur fait foi', '« km ou années » : le premier atteint', 'Le temps vieillit l\'huile, le liquide de frein et le caoutchouc', 'Conditions sévères (petits trajets, ville, remorquage) = intervalles raccourcis'] },

    { id: 'controles', title: 'Les contrôles à faire soi-même', min: 8,
      goals: ['Savoir faire le tour de contrôle mensuel en 10 minutes', 'Savoir ce qu\'on regarde à chaque point et pourquoi'],
      body: `
<p>Une fois par mois, et avant chaque long trajet, ces vérifications prennent une dizaine de minutes et évitent la majorité des pannes sur la route. C'est aussi le meilleur moyen de te familiariser avec ta voiture.</p>
<p>Tout se fait <strong>moteur froid</strong> (le matin idéalement) et <strong>voiture à plat</strong>. Coche au fur et à mesure, la liste se remet à zéro chaque mois :</p>
<div data-w="checklist"></div>
<h3>Ce qu'il faut regarder, point par point</h3>
<dl class="defs">
<dt>Huile</dt><dd>Entre MIN et MAX. Note la consommation d'un mois sur l'autre : une baisse rapide doit t'alerter.</dd>
<dt>Liquide de refroidissement</dt><dd>Dans le vase, entre MIN et MAX, moteur froid. S'il baisse régulièrement, il y a une fuite quelque part (durite, radiateur, pompe, ou pire, joint de culasse).</dd>
<dt>Liquide de frein</dt><dd>Entre MIN et MAX. Une baisse lente est normale (usure des plaquettes). Une baisse rapide : fuite, à faire vérifier tout de suite.</dd>
<dt>Pneus</dt><dd>La pression à froid, mais aussi l'état : coupures, hernies (une bosse sur le flanc, signe que la structure interne est cassée, pneu à changer immédiatement), clous, usure irrégulière.</dd>
<dt>Éclairage</dt><dd>Un ami devant et derrière, ou en se garant face à un mur ou une vitrine pour voir les reflets. Croisement, route, stops, clignotants, feux de recul, plaque.</dd>
<dt>Essuie-glaces</dt><dd>Ils doivent essuyer sans laisser de traces ni broutiller.</dd>
<dt>Sous la voiture</dt><dd>Regarde le sol à l'endroit où elle a stationné une nuit. Une goutte claire sous la clim en été, c'est de l'eau de condensation, normal. Sinon : brun ou noir = huile, rose/vert/bleu et odeur sucrée = liquide de refroidissement, clair et huileux près d'une roue = liquide de frein (grave).</dd>
</dl>
<div class="note tip">Les bouchons sont repérés par des pictogrammes et souvent des couleurs (jaune ou orange pour la jauge d'huile). Prends le manuel une première fois et repère chaque réservoir, capot ouvert, au calme.</div>`,
      keys: ['Niveaux, pneus, éclairage, essuie-glaces : une fois par mois', 'Moteur froid, voiture à plat', 'Une hernie sur le flanc = pneu à changer immédiatement', 'Les taches au sol indiquent quel fluide fuit'] },

    { id: 'signes', title: 'Lire les signes : fumées, bruits, odeurs', min: 12,
      goals: ['Interpréter la couleur de la fumée d\'échappement', 'Associer un bruit à une famille de pannes', 'Reconnaître les odeurs inquiétantes'],
      body: `
<p>Une voiture parle avec ses fumées, ses bruits et ses odeurs. Apprendre à les interpréter, c'est comme apprendre les symptômes d'une maladie : ça ne remplace pas le diagnostic, mais ça oriente immédiatement vers la bonne piste.</p>
<h3>La couleur de la fumée</h3>
<table class="tbl"><thead><tr><th>Fumée</th><th>Ce qui brûle</th><th>Causes possibles</th></tr></thead><tbody>
<tr><td><span class="smoke" style="--s:#9fb3d1"></span>Bleutée</td><td><strong>De l'huile</strong>, qui arrive là où elle ne devrait pas</td><td>Segments usés, joints de queues de soupapes, turbo qui fuit, trop d'huile dans le moteur</td></tr>
<tr><td><span class="smoke" style="--s:#f4f4f4"></span>Blanche légère, au démarrage à froid</td><td>De la vapeur d'eau (condensation)</td><td><strong>Normal</strong>, surtout en hiver, si elle disparaît en quelques minutes</td></tr>
<tr><td><span class="smoke" style="--s:#e6e6e6"></span>Blanche épaisse, persistante, odeur sucrée</td><td><strong>Du liquide de refroidissement</strong></td><td>Joint de culasse claqué, culasse fissurée. Vérifie le niveau du vase.</td></tr>
<tr><td><span class="smoke" style="--s:#333"></span>Noire</td><td><strong>Trop de carburant</strong> pour l'air disponible (mélange riche)</td><td>Filtre à air colmaté, injecteur qui fuit, turbo, vanne EGR, débitmètre défaillant</td></tr>
</tbody></table>
<div class="note ex">Comment distinguer une fumée bleue d'une blanche ? La vapeur d'eau se dissipe vite dans l'air et ne laisse pas d'odeur. La fumée d'huile reste en nappe bleutée et sent l'huile brûlée. Celle du liquide de refroidissement est épaisse, ne se dissipe pas, et a une odeur douceâtre.</div>
<h3>Les bruits</h3>
<p>Pour un bruit, la question clé est : <strong>à quoi est-il lié ?</strong> À la vitesse de la voiture (il change quand la voiture accélère, même au point mort) ? Au régime du moteur (il change quand le moteur monte dans les tours, même à l'arrêt) ? Au freinage ? Au braquage ? Aux bosses ?</p>
<table class="tbl"><thead><tr><th>Bruit</th><th>Lié à…</th><th>Piste principale</th></tr></thead><tbody>
<tr><td>Grincement métallique aigu</td><td>Au freinage</td><td>Témoin d'usure des plaquettes : il est temps de les changer</td></tr>
<tr><td>Frottement grave, métal contre métal</td><td>Au freinage</td><td>Plaquettes finies, le support métallique frotte le disque : urgent</td></tr>
<tr><td>Ronronnement ou grondement qui augmente avec la vitesse, change en virage</td><td>À la vitesse</td><td>Roulement de roue. En virage, le côté chargé fait plus de bruit</td></tr>
<tr><td>Claquement rythmé en braquant à fond</td><td>Au braquage</td><td>Cardan</td></tr>
<tr><td>Claquement sourd sur petites bosses</td><td>Aux bosses</td><td>Biellettes de barre stabilisatrice, silentblocs</td></tr>
<tr><td>Sifflement aigu au démarrage ou par temps humide</td><td>Au régime</td><td>Courroie d'accessoires qui patine sur ses poulies</td></tr>
<tr><td>Cliquetis métallique quelques secondes au démarrage à froid</td><td>Au régime</td><td>Chaîne de distribution détendue, ou poussoirs hydrauliques</td></tr>
<tr><td>Cognement grave et sourd qui suit le régime</td><td>Au régime</td><td>Bielle : arrêter le moteur immédiatement</td></tr>
<tr><td>Bruit d'échappement plus fort, comme un moteur de tracteur</td><td>Au régime</td><td>Silencieux percé ou joint d'échappement</td></tr>

<div class="note ex">Le test du roulement : sur une ligne droite déserte, à 70 km/h, donne de légers coups de volant à gauche puis à droite. Si le bruit augmente quand tu tournes à gauche, la voiture charge le côté droit : c'est souvent le roulement droit. Et inversement.</div>
<h3>Les odeurs</h3>
<ul>
<li><strong>Sucrée</strong> (comme du sirop) : fuite de liquide de refroidissement, dans le moteur ou dans l'habitacle (radiateur de chauffage, avec de la buée grasse sur le pare-brise).</li>

<li><strong>Essence</strong> : fuite de carburant. Ne roule pas, pas de flamme ni de cigarette.</li>
<li><strong>Plastique ou câble brûlé</strong> : court-circuit. Coupe le contact et cherche l'origine.</li>
<li><strong>Huile brûlée</strong> : fuite d'huile qui goutte sur l'échappement chaud.</li>

    { id: 'ct', title: 'Le contrôle technique', min: 9,

      body: `
<p>En France, le <strong>contrôle technique</strong> (CT) est une inspection obligatoire réalisée par un centre agréé. Il ne répare rien : il vérifie que la voiture est sûre et ne pollue pas trop.</p>
<h3>Les échéances</h3>
<ul>
<li>Premier contrôle : dans les <strong>6 mois qui précèdent les 4 ans</strong> de la voiture (date de première immatriculation, champ B de la carte grise).</li>
<li>Ensuite, <strong>tous les 2 ans</strong>.</li>
<li>En cas de vente d'une voiture de plus de 4 ans, le CT doit avoir moins de 6 mois.</li>
</ul>
<div class="note ex">Une voiture immatriculée le 15 mars 2022 doit passer son premier CT entre le 15 septembre 2025 et le 15 mars 2026. Si elle le passe le 10 février 2026, le suivant est à faire avant le 10 février 2028.</div>
<h3>Les trois niveaux de défaillance</h3>
<p>Le contrôleur vérifie plus de 130 points (freinage, direction, visibilité, éclairage, liaisons au sol, structure, équipements, pollution…). Chaque défaut trouvé est classé selon sa gravité :</p>
<table class="tbl"><thead><tr><th>Défaillance</th><th>Exemple</th><th>Conséquence</th></tr></thead><tbody>
<tr><td><span class="pill g">Mineure</span></td><td>Légère fuite d'huile, petit défaut esthétique de feu</td><td>Résultat favorable. La réparation est conseillée, mais pas imposée.</td></tr>
<tr><td><span class="pill o">Majeure</span></td><td>Ampoule de stop grillée, pneus usés, soufflet de cardan fendu, déséquilibre de freinage</td><td>Contre-visite obligatoire dans les <strong>2 mois</strong>. On peut rouler pendant ce délai.</td></tr>
<tr><td><span class="pill r">Critique</span></td><td>Freinage quasi inexistant, fuite de carburant, pneu dont la toile apparaît</td><td>Véhicule jugé dangereux : il peut rouler <strong>jusqu'à minuit le jour du contrôle</strong>, puis plus du tout avant réparation. Contre-visite sous 2 mois.</td></tr>
</tbody></table>
<p>Une <strong>contre-visite</strong>, c'est un second passage où le contrôleur ne vérifie que les points en défaut, après réparation. Elle coûte moins cher qu'un contrôle complet. Si le délai de 2 mois est dépassé, il faut repasser un contrôle complet.</p>
<p>Depuis le 1er janvier 2026, le contrôleur vérifie aussi les <strong>rappels constructeur graves</strong> non traités, comme certains airbags rappelés avec une consigne d'arrêt immédiat (« stop drive »).</p>
<h3>Les causes de contre-visite les plus fréquentes</h3>
<ul>
<li><strong>Freinage</strong> : déséquilibre entre la gauche et la droite d'un même essieu, efficacité insuffisante, disques ou plaquettes usés. Le contrôle est devenu plus strict en 2026 sur le déséquilibre.</li>
<li><strong>Éclairage</strong> : ampoule grillée, phares mal réglés (ils éblouissent ou éclairent trop bas), optiques jaunies et opaques.</li>
<li><strong>Pneus</strong> : usure sous 1,6 mm, pneus différents sur un même essieu, coupure ou hernie.</li>
<li><strong>Liaisons au sol</strong> : jeu dans les rotules, silentblocs usés, soufflets de cardan fendus, amortisseurs qui fuient.</li>
<li><strong>Pollution</strong> : opacité des fumées diesel trop élevée, voyant moteur allumé.</li>
<li>Fuites d'huile importantes, échappement percé.</li>
</ul>
<h3>Préparer le passage</h3>
<p>Une bonne partie des défauts relevés sont des petites choses qu'on peut vérifier soi-même en 15 minutes, gratuitement :</p>
<ul>
<li>tous les feux, y compris plaque et feu de recul ;</li>
<li>essuie-glaces, lave-glace, klaxon ;</li>
<li>pneus : usure, pression, état ;</li>
<li>aucun voyant allumé au tableau de bord ;</li>
<li>ceintures qui s'enroulent et se bouclent ;</li>
<li>pare-brise sans fissure dans le champ de vision du conducteur ;</li>
<li>apporter la carte grise.</li>
</ul>
<div class="note tip">Pour un diesel, faire 20 à 30 minutes de voie rapide juste avant le contrôle aide à passer le test d'opacité des fumées : le moteur est chaud et le FAP propre.</div>`,
      keys: ['Premier CT dans les 6 mois avant les 4 ans, puis tous les 2 ans', 'Mineure : favorable ; majeure : contre-visite sous 2 mois', 'Critique : circulation jusqu\'à minuit le jour du contrôle', 'Vérifier soi-même feux, pneus, essuie-glaces, voyants avant le passage'] }

  id: 'electrique', title: 'Hybrides et électriques', sub: 'Architectures, haute tension, entretien',

    { id: 'familles', title: 'Les familles de motorisations électrifiées', min: 12,
      goals: ['Distinguer micro-hybride, hybride, hybride rechargeable et électrique', 'Connaître les composants d\'une voiture électrique', 'Comprendre le freinage régénératif', 'Savoir pourquoi une électrique a toujours une batterie 12 V'],
      body: `
<p>On met souvent toutes les voitures « électrifiées » dans le même sac, mais il y a une grande différence entre une voiture qui a juste un petit coup de pouce électrique et une voiture 100 % électrique. On peut les ranger sur une échelle, du moins au plus électrique :</p>
<table class="tbl"><thead><tr><th>Type</th><th>Principe</th><th>Roule en tout électrique ?</th><th>Se recharge sur prise ?</th></tr></thead><tbody>
<tr><td>Micro-hybride (MHEV, 48 V)</td><td>Un alterno-démarreur renforcé et une petite batterie 48 V aident le moteur thermique à l'accélération et récupèrent l'énergie au freinage</td><td>Non</td><td>Non</td></tr>
<tr><td>Hybride (HEV, « full hybrid »)</td><td>Un vrai moteur électrique et une batterie haute tension de petite capacité travaillent avec le thermique</td><td>Oui, sur quelques centaines de mètres à basse vitesse</td><td>Non, elle se recharge en roulant et en freinant</td></tr>
<tr><td>Hybride rechargeable (PHEV)</td><td>Comme un hybride, avec une batterie bien plus grosse</td><td>Oui, souvent 40 à 80 km</td><td>Oui</td></tr>
<tr><td>Électrique (BEV)</td><td>Plus de moteur thermique du tout</td><td>Toujours</td><td>Oui, uniquement</td></tr>
</tbody></table>
<div class="note ex">Une Toyota Yaris hybride (HEV) démarre en silence sur le parking en électrique, puis le moteur essence se met en route quand on accélère. Une Peugeot 3008 hybride rechargeable (PHEV) peut faire un trajet domicile-travail de 40 km sans consommer d'essence si on la recharge chaque soir. Une Renault Mégane E-Tech électrique n'a pas de réservoir du tout.</div>
<h3>Les composants d'une électrique</h3>
<div data-d="ev"></div>
<dl class="defs">
<dt>La batterie de traction (haute tension)</dt><dd>Des centaines de cellules (proches des batteries de téléphone, en beaucoup plus gros) assemblées en modules, sous le plancher. Sa tension : environ 400 V sur la plupart des voitures, 800 V sur certaines récentes qui chargent plus vite. Sa capacité se compte en <strong>kWh</strong> (kilowattheures) : 50 kWh, c'est l'énergie pour fournir 50 kW pendant une heure. Une électrique consomme souvent 15 à 20 kWh pour 100 km : une batterie de 60 kWh donne donc environ 300 à 400 km. Un calculateur, le <strong>BMS</strong>, surveille la tension et la température de chaque cellule.</dd>
<dt>L'onduleur</dt><dd>La batterie fournit du courant <strong>continu</strong> (qui circule toujours dans le même sens). Le moteur électrique a besoin de courant <strong>alternatif</strong> (qui change de sens des centaines de fois par seconde). L'onduleur fait la conversion, et en faisant varier la fréquence, il règle la vitesse du moteur.</dd>
<dt>Le moteur électrique</dt><dd>Il produit son couple maximal dès 0 tr/min : c'est pour ça qu'une électrique démarre si vivement. Il peut tourner jusqu'à 15 000 tr/min ou plus.</dd>
<dt>Le réducteur</dt><dd>Grâce à cette plage de régime énorme, pas besoin de boîte de vitesses : un seul rapport fixe (souvent autour de 9:1) suffit de 0 à la vitesse maximale.</dd>
<dt>Le chargeur embarqué</dt><dd>Le réseau électrique de la maison ou d'une borne normale fournit de l'alternatif. Le chargeur embarqué le convertit en continu pour la batterie. Sa puissance (souvent 7 à 11 kW) limite la vitesse de recharge sur ces bornes. Sur une <strong>borne rapide (DC)</strong>, la conversion se fait dans la borne, qui alimente directement la batterie à 50, 150 kW ou plus.</dd>
<dt>Le convertisseur DC/DC</dt><dd>Il remplace l'alternateur : il prend un peu d'énergie sur la haute tension pour recharger la batterie 12 V.</dd>
</dl>
<h3>Le freinage régénératif</h3>
<p>Un moteur électrique peut fonctionner à l'envers : si on le fait tourner, il produit du courant, comme une dynamo. Quand tu lèves le pied ou que tu freines, le moteur se transforme en générateur : les roues l'entraînent, il produit de l'électricité qui retourne dans la batterie, et ça freine la voiture. L'énergie de mouvement, au lieu de partir en chaleur dans les disques, est en partie récupérée.</p>
<div class="note ex">En ville, une électrique récupère ainsi une part significative de l'énergie à chaque ralentissement. Beaucoup permettent de conduire avec une seule pédale : lever le pied freine assez fort pour s'arrêter, et on utilise rarement la pédale de frein.</div>
<div class="note why">Pourquoi garder une batterie 12 V ? Tous les équipements classiques d'une voiture (calculateurs, éclairage, essuie-glaces, vitres, radio) fonctionnent en 12 V, comme sur une thermique. Et surtout, c'est la 12 V qui « réveille » la voiture et ferme les relais qui connectent la batterie haute tension. Si la 12 V est à plat, la voiture ne démarre pas, même avec une batterie haute tension pleine. C'est l'une des pannes les plus fréquentes sur les électriques.</div>`,
      keys: ['MHEV < HEV < PHEV < BEV, du moins au plus électrique', 'Capacité en kWh ; 15–20 kWh/100 km', 'Onduleur : continu ↔ alternatif ; un seul rapport (réducteur)', 'Freinage régénératif : le moteur devient générateur', 'La batterie 12 V réveille la voiture : à plat, pas de démarrage'] },

    { id: 'ht', title: 'La sécurité haute tension', min: 8,
      goals: ['Comprendre pourquoi la haute tension est dangereuse', 'Savoir reconnaître les composants haute tension', 'Connaître le principe de l\'habilitation et de la consignation', 'Savoir ce qu\'un débutant peut faire ou non'],
      body: `
<h3>Pourquoi c'est dangereux</h3>
<p>Le 12 V d'une batterie classique ne traverse pas le corps humain de façon dangereuse : la peau est trop résistante. Avec plusieurs centaines de volts, c'est différent. Souviens-toi de la loi d'Ohm : I = U ÷ R. Avec une tension 30 à 60 fois plus élevée, le courant qui traverse le corps est 30 à 60 fois plus fort. Quelques dizaines de milliampères à travers le cœur suffisent à provoquer un arrêt cardiaque. Et en courant continu, les muscles se contractent : on peut ne plus pouvoir lâcher le câble.</p>
<div class="note danger">Les câbles et composants <strong>orange</strong> sont sous haute tension, à plusieurs centaines de volts en continu. Un contact peut être mortel. On n'y touche jamais sans formation.</div>
<p>Les composants concernés sont signalés par la couleur orange et des étiquettes avec un éclair : batterie de traction, onduleur, moteur électrique, chargeur, compresseur de climatisation électrique, câbles qui les relient, prise de recharge.</p>
<h3>L'habilitation électrique</h3>
<p>En France, intervenir sur les circuits haute tension d'un véhicule nécessite une <strong>habilitation électrique</strong> spécifique aux véhicules, délivrée par l'employeur après une formation. Les niveaux sont désignés par des codes (B0L, B1VL, B2VL, BCL…) selon ce que la personne est autorisée à faire : travailler à proximité, intervenir sous la direction d'un chargé de travaux, consigner le véhicule, etc.</p>
<h3>La consignation</h3>
<p>Avant d'intervenir, un professionnel habilité <strong>consigne</strong> le véhicule, c'est-à-dire qu'il le met en sécurité de façon vérifiée :</p>
<ol class="steps">
<li>Couper le contact et éloigner la clé.</li>
<li>Retirer le <strong>connecteur de service</strong> (« plug de service »), qui coupe physiquement la batterie haute tension en deux.</li>
<li>Attendre que les <strong>condensateurs</strong> de l'onduleur se déchargent : ils gardent une charge dangereuse plusieurs minutes après la coupure (souvent 5 à 10 minutes, selon le constructeur).</li>
<li>Vérifier l'<strong>absence de tension</strong> avec un appareil de mesure adapté, en portant des gants isolants.</li>
<li>Empêcher toute remise sous tension accidentelle (cadenas, panneau).</li>
</ol>
<h3>Ce qu'un débutant peut faire</h3>
<p>Une bonne partie de l'entretien d'une électrique ou d'une hybride ne touche pas la haute tension :</p>
<ul>
<li>pneus, roues, essuie-glaces, ampoules, filtre d'habitacle ;</li>
<li>freins classiques (en respectant le mode maintenance éventuel du frein de parking électrique) ;</li>
<li>batterie 12 V, lave-glace, liquide de frein.</li>
</ul>
<p>Et rien qui concerne un élément orange, la batterie de traction, l'onduleur ou le moteur électrique. Sur une hybride, attention aussi : le moteur thermique peut démarrer tout seul tant que la voiture est « prête » (READY affiché), pour recharger la batterie.</p>`,
      keys: ['Orange = haute tension, contact potentiellement mortel', 'Habilitation électrique obligatoire pour la HT', 'Consignation : plug de service, attente décharge des condensateurs, vérification d\'absence de tension', 'Débutant : pneus, freins, 12 V, niveaux, rien d\'orange'] },

    { id: 'entretien-ev', title: 'Ce qui change à l\'entretien', min: 7,

      body: `
<p>Une électrique n'a ni huile moteur, ni bougies, ni courroie de distribution, ni embrayage, ni échappement. L'entretien mécanique est donc beaucoup plus léger. Mais certaines choses restent, et d'autres apparaissent.</p>
<table class="tbl"><thead><tr><th>Élément</th><th>Sur une électrique</th></tr></thead><tbody>
<tr><td>Vidange moteur</td><td>Aucune. (Les hybrides, elles, gardent l'entretien de leur moteur thermique.) Le réducteur contient de l'huile, rarement remplacée.</td></tr>
<tr><td>Freins</td><td>S'usent beaucoup moins grâce au freinage régénératif : des plaquettes peuvent dépasser 100 000 km. Mais les disques <strong>rouillent</strong> faute de servir, et les étriers peuvent gripper. Un freinage franc de temps en temps les nettoie.</td></tr>
<tr><td>Liquide de frein</td><td>Toujours tous les 2 ans : il absorbe l'humidité de la même façon.</td></tr>
<tr><td>Pneus</td><td>S'usent souvent plus vite : la voiture est lourde (la batterie pèse souvent 300 à 500 kg) et le couple est instantané.</td></tr>
<tr><td>Refroidissement</td><td>Un circuit de liquide refroidit (ou réchauffe) la batterie et l'électronique. À contrôler selon le carnet.</td></tr>
<tr><td>Climatisation</td><td>Souvent une pompe à chaleur. Le compresseur électrique utilise une huile spécifique, isolante électriquement : on ne recharge pas une clim d'électrique avec n'importe quelle station.</td></tr>
<tr><td>Batterie 12 V</td><td>Toujours présente, cause fréquente de panne.</td></tr>
<tr><td>Batterie de traction</td><td>Elle perd lentement de la capacité. On mesure son <strong>état de santé (SoH)</strong>, en pourcentage de la capacité d'origine, avec un outil de diagnostic ou l'appli du constructeur.</td></tr>
</tbody></table>
<div class="note ex">Une électrique de 5 ans avec un SoH de 92 % a encore 92 % de sa capacité d'origine : si elle faisait 400 km neuve, elle en fait environ 370. Lors d'un achat d'occasion, le certificat de SoH est le document le plus important, comme le carnet d'entretien pour une thermique.</div>
<div class="note tip">Pour préserver une batterie de traction au quotidien : éviter de la laisser longtemps à 100 % ou presque vide, et limiter les recharges rapides répétées quand ce n'est pas nécessaire. Beaucoup de voitures permettent de régler une limite de charge à 80 % pour l'usage quotidien.</div>
<p>Globalement, une électrique demande moins d'entretien mécanique, mais plus de compétences en électronique et en diagnostic. C'est vers là qu'évolue le métier de mécanicien.</p>`,
