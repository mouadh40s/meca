MODULES.push({
  id: 'alimentation', title: 'Air, carburant, échappement', sub: 'Injection, turbo, dépollution',
  lessons: [
    { id: 'injection', title: 'Le mélange air-carburant et l\'injection', min: 14,
      goals: ['Comprendre le rapport 14,7:1 et ce qu\'il représente concrètement', 'Savoir ce qu\'est un mélange riche ou pauvre', 'Suivre le trajet de l\'air et du carburant jusqu\'au cylindre', 'Faire la différence entre injection directe et indirecte'],
      body: `
<h3>Le feu a besoin d'air</h3>
<p>Une bougie sous un verre s'éteint quand elle a consommé l'oxygène. Le carburant, c'est pareil : pour brûler, il a besoin de l'oxygène de l'air. Et pas dans n'importe quelle proportion. Pour que tout le carburant brûle, sans en laisser et sans gaspiller d'air, il faut un dosage précis.</p>
<h3>Le rapport stœchiométrique : 14,7:1</h3>
<p>Ce mot compliqué veut juste dire « la proportion chimiquement parfaite ». Pour l'essence, il faut <strong>14,7 grammes d'air pour brûler 1 gramme d'essence</strong>. On l'écrit <strong>14,7:1</strong> (« 14,7 pour 1 »), comme le taux de compression, mais attention, ça n'a rien à voir : ici on compare des <em>masses</em> d'air et de carburant.</p>
<div class="note ex">Ça paraît peu, 14,7 fois. Mais l'air est très léger : 1 litre d'air pèse environ 1,2 gramme, alors qu'1 litre d'essence pèse environ 750 grammes. Pour brûler 1 litre d'essence (750 g), il faut 750 × 14,7 ≈ 11 000 g d'air, soit environ <strong>9 000 litres d'air</strong>. C'est le volume d'une petite pièce. Un moteur est avant tout une énorme pompe à air.</div>
<p>Pour le diesel, le rapport idéal est d'environ 14,5:1, mais un diesel fonctionne presque toujours avec un excès d'air (on y reviendra).</p>
<h3>Riche ou pauvre</h3>
<ul>
<li><strong>Mélange riche</strong> : trop de carburant pour l'air disponible (par exemple 12:1). Le carburant ne brûle pas entièrement. Conséquences : consommation en hausse, fumée noire (de la suie, du carburant mal brûlé), bougies encrassées, catalyseur qui souffre.</li>
<li><strong>Mélange pauvre</strong> : trop d'air pour le carburant (par exemple 17:1). La combustion est plus chaude et plus lente. Conséquences : perte de puissance, ratés, à-coups, risque de surchauffe des pistons et des soupapes.</li>
</ul>
<div class="note ex">Le code défaut P0171 « mélange trop pauvre » est l'un des plus courants. Cause classique : une durite d'admission fendue. De l'air entre par la fissure sans être compté par le débitmètre, donc le calculateur injecte trop peu de carburant pour la quantité réelle d'air.</div>
<h3>Le circuit d'air</h3>
<p>L'air suit un trajet précis avant d'arriver au cylindre :</p>
<ol class="steps">
<li><strong>Le filtre à air</strong> arrête la poussière. Un grain de sable dans un cylindre raye la paroi comme du papier de verre.</li>
<li><strong>Le débitmètre</strong> mesure la masse d'air qui entre. C'est l'information n°1 du calculateur pour savoir combien de carburant injecter. (Certains moteurs utilisent plutôt un capteur de pression dans le collecteur.)</li>
<li><strong>Le turbo</strong>, s'il y en a un, comprime l'air (leçon suivante).</li>
<li><strong>Le boîtier papillon</strong> (sur les essences) est un volet qui s'ouvre plus ou moins pour doser l'air : c'est lui que tu commandes avec la pédale d'accélérateur. Le diesel n'en a quasiment pas besoin : il dose la puissance en jouant uniquement sur la quantité de gazole.</li>
<li><strong>Le collecteur d'admission</strong> répartit l'air entre les cylindres.</li>
<li>Les <strong>soupapes d'admission</strong> le laissent entrer dans chaque cylindre.</li>
</ol>
<h3>Le circuit de carburant</h3>
<div data-d="fuelSystem"></div>
<p>Une <strong>pompe électrique</strong> immergée dans le réservoir envoie le carburant vers le moteur à faible pression, à travers un <strong>filtre</strong>. Sur les moteurs modernes, une <strong>pompe haute pression</strong> entraînée par le moteur monte ensuite cette pression très haut, et remplit une <strong>rampe commune</strong> (en anglais « common rail ») : un tube épais qui sert de réservoir sous pression, sur lequel sont branchés tous les injecteurs.</p>
<p>Les <strong>injecteurs</strong> sont des électrovannes : de minuscules robinets commandés électriquement. Le calculateur les ouvre pendant quelques millisecondes (une milliseconde = un millième de seconde). Plus il les laisse ouverts longtemps, plus il injecte de carburant.</p>
<div class="note why">Pourquoi une pression si haute ? Plus la pression est forte, plus le carburant sort de l'injecteur en gouttelettes fines, comme un brumisateur. Des gouttelettes fines se mélangent mieux à l'air et brûlent plus complètement : plus de puissance, moins de consommation, moins de pollution.</div>
<h3>Directe ou indirecte</h3>
<table class="tbl"><thead><tr><th>Type</th><th>Où est injecté le carburant</th><th>Pression typique</th></tr></thead><tbody>
<tr><td>Injection indirecte (essence)</td><td>Dans le conduit d'admission, juste devant la soupape. Le carburant entre dans le cylindre déjà mélangé à l'air.</td><td>3 à 5 bars</td></tr>
<tr><td>Injection directe essence</td><td>Directement dans le cylindre, avec un injecteur qui débouche dans la chambre de combustion</td><td>Environ 200 à 350 bars</td></tr>
<tr><td>Diesel common rail</td><td>Directement dans le cylindre, dans l'air brûlant en fin de compression</td><td>Jusqu'à 2 000 bars et plus</td></tr>
</tbody></table>
<p>Le <strong>bar</strong> est une unité de pression : 1 bar, c'est à peu près la pression de l'air autour de nous. Un pneu de voiture est gonflé à environ 2,2 bars. 2 000 bars, c'est donc près de mille fois la pression d'un pneu.</p>
<div class="note warn">Un circuit diesel haute pression ne s'ouvre jamais moteur tournant : un jet de gazole à cette pression traverse la peau et provoque des blessures graves.</div>`,
      keys: ['14,7:1 = 14,7 g d\'air pour 1 g d\'essence (≈ 9 000 L d\'air par litre d\'essence)', 'Riche = trop de carburant (fumée noire) ; pauvre = trop d\'air (ratés)', 'Le débitmètre mesure l\'air, le calculateur dose le carburant', 'Common rail : rampe sous haute pression alimentant les injecteurs'] },

    { id: 'turbo', title: 'Le turbocompresseur', min: 10,
      goals: ['Comprendre pourquoi comprimer l\'air donne de la puissance', 'Savoir comment fonctionne un turbo', 'Connaître le rôle de l\'échangeur et de la wastegate', 'Savoir préserver un turbo'],
      body: `
<h3>Le principe : faire entrer plus d'air</h3>
<p>Tu as vu qu'un moteur est une pompe à air, et qu'il faut 14,7 g d'air pour brûler 1 g d'essence. La puissance d'un moteur est donc limitée par la quantité d'air qu'il peut avaler. Pour avoir plus de puissance, deux solutions : augmenter la cylindrée (moteur plus gros, plus lourd, qui consomme plus), ou <strong>forcer plus d'air dans les mêmes cylindres</strong>. C'est le rôle du turbo.</p>
<div class="note ana">Souffler sur des braises les fait rougir et brûler plus fort. Le turbo souffle de l'air comprimé dans le moteur : avec plus d'oxygène, on peut brûler plus de carburant à chaque cycle.</div>
<div class="note ex">Grâce au turbo, un 1.2 essence moderne de 130 ch fait aussi bien qu'un 2.0 atmosphérique (sans turbo) d'il y a vingt ans, tout en consommant moins quand on roule tranquillement. C'est ce qu'on appelle le « downsizing ».</div>
<div data-d="turbo"></div>
<h3>Comment il fonctionne</h3>
<p>Le turbo est fait de deux roues à ailettes reliées par un même axe :</p>
<ul>
<li>la <strong>turbine</strong>, placée dans l'échappement. Les gaz d'échappement, qui sortent chauds et rapides, la font tourner comme le vent fait tourner une éolienne ;</li>
<li>le <strong>compresseur</strong>, placé dans l'admission. Entraîné par la turbine via l'axe, il aspire l'air frais et le comprime avant de l'envoyer au moteur.</li>
</ul>
<p>L'idée géniale : on récupère l'énergie des gaz d'échappement, qui partait sinon à la poubelle. L'axe peut dépasser <strong>150 000 tours par minute</strong>, cinquante fois plus vite que le moteur.</p>
<p>La pression que fournit le turbo s'appelle la <strong>pression de suralimentation</strong>. Elle se compte en bars au-dessus de la pression atmosphérique : souvent entre 0,8 et 1,5 bar sur une voiture courante. Concrètement, ça peut faire entrer presque deux fois plus d'air dans le cylindre.</p>
<h3>L'échangeur (intercooler)</h3>
<p>Comprimer de l'air le chauffe, souvent au-delà de 100 °C (souviens-toi de la pompe à vélo). Or l'air chaud est moins dense : il contient moins d'oxygène dans un même volume. On le fait donc passer dans un <strong>échangeur</strong>, un petit radiateur placé à l'avant de la voiture, qui le refroidit avant qu'il entre dans le moteur.</p>
<h3>La wastegate et la géométrie variable</h3>
<p>Plus le moteur tourne vite, plus il y a de gaz d'échappement, plus le turbo tourne vite, plus il comprime. Sans limite, la pression deviendrait dangereuse pour le moteur. La <strong>wastegate</strong> (« porte de décharge ») est une petite soupape qui, à partir d'une certaine pression, laisse une partie des gaz contourner la turbine.</p>
<p>Beaucoup de diesels utilisent un <strong>turbo à géométrie variable</strong> : des ailettes orientables autour de la turbine. À bas régime, elles se resserrent pour accélérer les gaz et faire tourner le turbo plus tôt. À haut régime, elles s'ouvrent. Avec la suie, elles se grippent parfois : la voiture passe alors en mode dégradé.</p>
<h3>Le temps de réponse</h3>
<p>Il faut une fraction de seconde pour que les gaz fassent tourner le turbo assez vite : c'est le <strong>temps de réponse</strong> (ou « lag »). Tu le sens sur certains moteurs : on appuie, il se passe peu de chose, puis la poussée arrive d'un coup.</p>
<h3>Préserver un turbo</h3>
<ul>
<li><strong>L'axe tourne sur un film d'huile moteur</strong>, à 150 000 tr/min, à côté d'une turbine qui peut dépasser 800 °C. Une huile vieillie ou de mauvaise qualité le tue. Les vidanges régulières sont sa meilleure assurance.</li>
<li><strong>Moteur froid</strong>, l'huile est épaisse et circule mal : ne pas monter dans les tours les premiers kilomètres.</li>
<li><strong>Après un gros effort</strong> (autoroute rapide, montée), rouler tranquillement la dernière minute avant de couper. Si on coupe net, l'huile arrête de circuler alors que la turbine est encore brûlante : elle cuit et forme des dépôts.</li>
</ul>
<p>Signes d'usure : sifflement aigu qui augmente avec l'accélération, perte de puissance, fumée bleue (de l'huile fuit par les joints de l'axe), jeu quand on bouge l'axe à la main.</p>`,
      keys: ['Plus d\'air = plus de carburant brûlé = plus de puissance', 'Turbine entraînée par l\'échappement, compresseur côté admission', 'L\'échangeur refroidit l\'air comprimé (air froid = plus dense)', 'Le turbo vit grâce à l\'huile moteur : vidanges et ralenti après effort'] },

    { id: 'echappement', title: 'Échappement et dépollution', min: 13,
      goals: ['Connaître les polluants produits par un moteur', 'Comprendre le rôle de chaque élément de la ligne d\'échappement', 'Savoir pourquoi FAP et EGR s\'encrassent', 'Comprendre l\'AdBlue'],
      body: `
<h3>Ce qui sort d'un moteur</h3>
<p>Dans un monde parfait, la combustion ne produirait que de la vapeur d'eau (H₂O) et du dioxyde de carbone (CO₂). En réalité, elle n'est jamais parfaite et produit aussi des polluants :</p>
<table class="tbl"><thead><tr><th>Polluant</th><th>D'où il vient</th><th>Pourquoi c'est un problème</th></tr></thead><tbody>
<tr><td>CO (monoxyde de carbone)</td><td>Carburant mal brûlé, manque d'oxygène</td><td>Gaz toxique, mortel en espace clos</td></tr>
<tr><td>HC (hydrocarbures imbrûlés)</td><td>Carburant pas brûlé du tout</td><td>Irritant, participe à la pollution à l'ozone</td></tr>
<tr><td>NOx (oxydes d'azote)</td><td>L'azote de l'air brûle quand la combustion est très chaude</td><td>Irritant pour les poumons, pluies acides</td></tr>
<tr><td>Particules (suie)</td><td>Surtout sur diesel et injection directe essence</td><td>Pénètrent profondément dans les poumons</td></tr>
</tbody></table>
<p>La ligne d'échappement moderne est une véritable usine chimique qui traite ces polluants. Suis le trajet des gaz :</p>
<div data-d="exhaust"></div>
<dl class="defs">
<dt>Le collecteur</dt><dd>Il regroupe les gaz de chaque cylindre en un seul tuyau. C'est la pièce la plus chaude de la voiture.</dd>
<dt>La sonde lambda amont</dt><dd>« Lambda » (λ) est le nom que les ingénieurs donnent au rapport air/carburant comparé à l'idéal : λ = 1 quand on est pile à 14,7:1. La sonde mesure l'oxygène restant dans les gaz. S'il en reste trop, le mélange est pauvre ; s'il n'en reste pas, il est riche. Le calculateur corrige l'injection en permanence, plusieurs fois par seconde, grâce à elle.</dd>
<dt>Le catalyseur</dt><dd>Une céramique en nid d'abeille (des milliers de petits canaux) recouverte d'une fine couche de métaux précieux : platine, palladium, rhodium. Ces métaux provoquent des réactions chimiques qui transforment le CO en CO₂, les HC en CO₂ et eau, et les NOx en azote. Il ne fonctionne qu'une fois chaud, à partir de 300 °C environ : c'est pour ça qu'une voiture pollue surtout les premières minutes.</dd>
<dt>La sonde lambda aval</dt><dd>Placée après le catalyseur, elle vérifie qu'il fait bien son travail. Un catalyseur en bon état absorbe les variations d'oxygène : la sonde aval affiche un signal stable. S'il est usé, son signal ressemble à celui de la sonde amont, et le calculateur allume le voyant moteur (code P0420).</dd>
<dt>Le FAP (filtre à particules)</dt><dd>Une céramique dont les canaux sont bouchés une fois sur deux, alternativement à l'entrée et à la sortie. Les gaz sont obligés de traverser les parois poreuses, qui retiennent la suie.</dd>
<dt>Les silencieux</dt><dd>Des boîtes avec des chicanes et de la laine isolante qui cassent les ondes sonores des explosions.</dd>
</dl>
<h3>La régénération du FAP</h3>
<p>Un filtre se remplit. Quand le FAP est chargé de suie, le calculateur lance une <strong>régénération</strong> : il modifie l'injection pour faire monter la température des gaz au-delà de 550–600 °C. La suie brûle et devient du CO₂. Ça prend une dizaine de minutes, et il faut rouler à un régime régulier pour y arriver.</p>
<div class="note ex">Un diesel qui ne fait que 5 km par jour en ville n'atteint jamais ces conditions. Les régénérations s'interrompent, la suie s'accumule, un voyant FAP s'allume, puis le moteur passe en puissance réduite. La solution simple : un trajet de 20 à 30 minutes sur voie rapide de temps en temps. C'est aussi pour ça qu'un diesel n'est pas adapté à un usage purement urbain.</div>
<h3>La vanne EGR</h3>
<p>Les NOx se forment quand la combustion est très chaude. L'astuce de l'<strong>EGR</strong> (Exhaust Gas Recirculation, recirculation des gaz d'échappement) : renvoyer une partie des gaz d'échappement dans l'admission. Ces gaz ont déjà brûlé et ne contiennent presque plus d'oxygène : ils prennent de la place dans le cylindre sans participer à la combustion, ce qui la refroidit. Moins de chaleur, moins de NOx.</p>
<p>Inconvénient : ces gaz sont chargés de suie, qui se mélange aux vapeurs d'huile et forme une pâte noire. La vanne finit par se gripper, ouverte ou fermée. Symptômes : perte de puissance, fumée noire, à-coups, voyant moteur.</p>
<h3>L'AdBlue et le système SCR</h3>
<p>Les diesels récents ont un réservoir supplémentaire, au bouchon bleu, rempli d'<strong>AdBlue</strong> : un mélange d'eau et d'urée (32,5 %). Il est pulvérisé dans l'échappement, devant un catalyseur spécial (SCR). Sous l'effet de la chaleur, l'urée libère de l'ammoniac, qui réagit avec les NOx et les transforme en azote et en eau, deux composants inoffensifs de l'air.</p>
<p>La consommation est faible, souvent de l'ordre de 1 litre pour 1 000 km. Mais la loi impose que la voiture refuse de redémarrer si le réservoir est vide : l'ordinateur de bord prévient longtemps à l'avance avec un compte à rebours en kilomètres.</p>
<div class="note warn">Ne verse jamais d'AdBlue dans le réservoir de gazole. Ça détruit le circuit d'injection. Le bouchon et le pistolet sont de taille différente, mais l'erreur arrive avec un bidon et un entonnoir.</div>`,
      keys: ['Polluants : CO, HC, NOx, particules', 'Sonde lambda amont = réglage du mélange, aval = surveillance du catalyseur', 'FAP piège la suie, régénère en roulant sur route', 'EGR recycle des gaz pour baisser les NOx, s\'encrasse en ville', 'AdBlue (urée) transforme les NOx en azote et eau'] }

    { id: 'bases-elec', title: 'Les bases de l\'électricité', min: 14,
      goals: ['Comprendre volts, ampères, ohms et watts avec une image simple', 'Savoir utiliser la loi d\'Ohm sur des exemples concrets', 'Comprendre ce qu\'est la masse', 'Savoir utiliser un multimètre'],
      body: `
<p>L'électricité fait peur aux débutants parce qu'on ne la voit pas. La bonne nouvelle : en automobile, tout repose sur quatre notions et deux formules. On va les rendre concrètes avec une image que tu garderas toute ta vie.</p>
<h3>L'image du château d'eau</h3>
<div class="note ana">Imagine un réservoir d'eau en hauteur, relié à un tuyau qui descend vers un moulin. Plus le réservoir est haut, plus l'eau arrive avec <strong>pression</strong>. Plus le tuyau est large, plus il passe d'eau, plus le <strong>débit</strong> est grand. Si on pince le tuyau, on crée une <strong>résistance</strong> et le débit baisse. Et la force avec laquelle l'eau fait tourner le moulin, c'est la <strong>puissance</strong>.</div>
<table class="tbl"><thead><tr><th>Grandeur</th><th>Symbole / unité</th><th>Équivalent eau</th><th>Sur une voiture</th></tr></thead><tbody>
<tr><td>Tension</td><td>U, en volts (V)</td><td>La pression</td><td>12 V fournis par la batterie</td></tr>
<tr><td>Intensité</td><td>I, en ampères (A)</td><td>Le débit</td><td>Environ 5 A pour un phare, 150 A ou plus pour le démarreur</td></tr>
<tr><td>Résistance</td><td>R, en ohms (Ω)</td><td>Le rétrécissement</td><td>Le filament d'une ampoule, un fil trop fin, un contact oxydé</td></tr>
<tr><td>Puissance</td><td>P, en watts (W)</td><td>Le travail fourni</td><td>55 W pour un phare halogène</td></tr>
</tbody></table>
<h3>Les deux formules</h3>
<p class="formula">Loi d'Ohm : U = R × I &nbsp;(tension = résistance × intensité)<br>Puissance : P = U × I &nbsp;(puissance = tension × intensité)</p>
<p>On peut les retourner dans tous les sens : I = U ÷ R, R = U ÷ I, I = P ÷ U.</p>
<div class="note ex">Une ampoule de phare de 55 W en 12 V consomme I = P ÷ U = 55 ÷ 12 ≈ <strong>4,6 A</strong>. Ses deux phares allumés : environ 9 A. La lunette arrière dégivrante, environ 150 W : 150 ÷ 12 ≈ 12,5 A. Le démarreur, environ 1 800 W : 1 800 ÷ 12 = 150 A. Tu comprends pourquoi son câble est aussi gros qu'un doigt.</div>
<div class="note ex">Une résistance chauffante de siège a une résistance de 2 Ω. En 12 V, elle consomme I = U ÷ R = 12 ÷ 2 = 6 A, soit une puissance de 12 × 6 = 72 W.</div>
<p>Voici un circuit électrique de base. Touche chaque élément :</p>
<div data-d="circuit"></div>
<p>Pour qu'un courant circule, il faut un <strong>circuit fermé</strong> : le courant part du + de la batterie, traverse l'appareil (la lampe), et revient au –. Si le circuit est ouvert quelque part (interrupteur ouvert, fil coupé, fusible grillé), plus rien ne circule. La plupart des pannes électriques sont simplement un circuit ouvert à un endroit qu'il faut trouver.</p>
<h3>La masse</h3>
<p>Une voiture contient des centaines d'appareils électriques. Pour éviter de tirer deux fils jusqu'à chacun, on utilise la carrosserie métallique comme fil de retour : elle est reliée à la borne – de la batterie par un gros câble. On l'appelle la <strong>masse</strong>. Chaque appareil reçoit un fil + et se « met à la masse » en étant vissé sur la caisse ou par un fil court jusqu'à un point de masse.</p>
<div class="note ex">Les feux arrière d'une voiture s'allument faiblement quand tu freines, et le clignotant fait clignoter aussi le feu de position. Diagnostic classique : une mauvaise masse dans le bloc de feu. Le courant cherche un autre chemin pour revenir et passe par les autres ampoules. Nettoyer et resserrer le point de masse règle le problème.</div>
<h3>Le multimètre</h3>
<p>C'est l'outil qui rend l'électricité visible. Il a deux pointes de touche, une rouge et une noire, et une molette pour choisir ce qu'on mesure.</p>
<table class="tbl"><thead><tr><th>Mesure</th><th>Position de la molette</th><th>Comment</th></tr></thead><tbody>
<tr><td>Tension (V)</td><td>V avec un trait droit (courant continu), calibre 20 V</td><td>Circuit <strong>alimenté</strong>. Pointe noire à la masse, pointe rouge sur le point à mesurer. On dit qu'on mesure « en parallèle ».</td></tr>
<tr><td>Résistance (Ω) et continuité</td><td>Ω ou symbole de son</td><td>Circuit <strong>coupé</strong> (sinon l'appareil peut être abîmé). Une pointe à chaque bout du fil. Un fil en bon état affiche presque 0 Ω et l'appareil bipe. « OL » (Over Limit) veut dire résistance infinie : le fil est coupé.</td></tr>
<tr><td>Intensité (A)</td><td>A, et souvent changer la pointe rouge de prise</td><td>Il faut ouvrir le circuit et faire passer le courant <strong>à travers</strong> l'appareil (« en série »). Délicat : le multimètre grille facilement si le courant est trop fort. Les mécaniciens préfèrent une pince ampèremétrique.</td></tr>
</tbody></table>
<div class="note ex">Ton feu stop gauche ne marche pas. L'ampoule est bonne. Pédale enfoncée (un ami appuie), tu mesures la tension au connecteur : 12 V entre le fil d'alimentation et la masse. Le courant arrive donc. Tu mesures entre le fil d'alimentation et le fil de masse du connecteur : 0 V. Conclusion : le fil de masse est coupé ou mal fixé.</div>
<h3>La chute de tension, l'outil du pro</h3>
<p>Un fil ou un contact en bon état ne « consomme » presque pas de tension. Un contact oxydé, lui, se comporte comme une résistance et en « mange » une partie, qui manque ensuite à l'appareil. On mesure ça <strong>circuit en marche</strong>, une pointe de chaque côté du fil ou du contact suspect. Plus de 0,5 V perdus sur un câble = mauvais contact à nettoyer.</p>`,
      keys: ['Tension = pression (V), intensité = débit (A), résistance = rétrécissement (Ω)', 'U = R × I et P = U × I (55 W ÷ 12 V ≈ 4,6 A)', 'La carrosserie est la masse (relié au –)', 'Tension en parallèle circuit alimenté, résistance circuit coupé, intensité en série'] },

    { id: 'charge', title: 'Batterie, alternateur, démarreur', min: 13,
      goals: ['Comprendre qui fournit le courant moteur arrêté et moteur tournant', 'Savoir lire l\'étiquette d\'une batterie (Ah, A EN)', 'Diagnostiquer une batterie et un alternateur au multimètre', 'Démarrer avec des câbles sans risque'],
      body: `
<p>Trois pièces travaillent en équipe pour l'électricité d'une voiture. Touche-les sur le schéma :</p>
<div data-d="charging"></div>
<div class="note ana">La batterie est un réservoir d'eau. L'alternateur est une pompe qui le remplit quand le moteur tourne. Le démarreur est le plus gros consommateur, qui vide d'un coup une bonne quantité du réservoir pendant quelques secondes.</div>
<h3>La batterie</h3>
<p>Elle sert à deux choses : <strong>démarrer</strong> le moteur, et alimenter la voiture quand le moteur est arrêté (alarme, horloge, calculateurs en veille, plafonnier). Moteur tournant, c'est l'alternateur qui prend le relais.</p>
<p>Sur l'étiquette d'une batterie, tu trouveras par exemple : <strong>12 V 70 Ah 640 A (EN)</strong>.</p>
<ul>
<li><strong>12 V</strong> : la tension, toujours la même sur une voiture.</li>
<li><strong>70 Ah</strong> (ampères-heures) : la <strong>capacité</strong>, la quantité d'énergie stockée. En théorie, elle peut fournir 1 A pendant 70 heures, ou 3,5 A pendant 20 heures. C'est la taille du réservoir.</li>
<li><strong>640 A (EN)</strong> : le <strong>courant de démarrage à froid</strong> (aussi noté CCA). C'est le courant maximal qu'elle peut fournir pendant quelques secondes par grand froid (−18 °C) sans s'effondrer. C'est la force du jet.</li>
</ul>
<div class="note ex">Tu oublies tes phares allumés (deux fois 55 W, plus les feux arrière : environ 10 A). Une batterie de 70 Ah est réellement utilisable sur environ la moitié de sa capacité pour démarrer encore, soit 35 Ah. 35 Ah ÷ 10 A = 3,5 heures. Au-delà, elle ne pourra plus faire tourner le démarreur.</div>
<p><strong>Lire l'état de charge au multimètre</strong> (batterie au repos, moteur coupé depuis au moins 2 heures pour que la tension se stabilise) :</p>
<table class="tbl"><thead><tr><th>Tension mesurée</th><th>État de charge</th><th>Que faire</th></tr></thead><tbody>
<tr><td>12,6 V et plus</td><td>Pleine (100 %)</td><td>Rien</td></tr>
<tr><td>Environ 12,4 V</td><td>Environ 75 %</td><td>Correct</td></tr>
<tr><td>Environ 12,2 V</td><td>Environ 50 %</td><td>À recharger avec un chargeur</td></tr>
<tr><td>Moins de 12,0 V</td><td>Déchargée</td><td>Recharger tout de suite, et si elle ne tient pas la charge, la remplacer</td></tr>
</tbody></table>
<p>Tu remarques que l'écart entre « pleine » et « vide » n'est que de 0,6 V. C'est pour ça qu'il faut un multimètre précis et une batterie vraiment au repos.</p>
<p>Les voitures avec <strong>Start&amp;Stop</strong> (moteur qui se coupe aux feux rouges) démarrent des dizaines de fois par trajet. Elles utilisent des batteries renforcées <strong>EFB</strong> ou <strong>AGM</strong>. On remplace toujours par la même technologie, et certaines marques demandent d'« enregistrer » la nouvelle batterie au calculateur avec un outil de diagnostic, pour qu'il adapte la charge.</p>
<h3>L'alternateur</h3>
<p>C'est une dynamo, comme celle d'un vélo mais en beaucoup plus puissant. Entraîné par la courroie d'accessoires, il produit du courant dès que le moteur tourne, alimente tous les équipements et recharge la batterie.</p>
<p>Pour recharger la batterie, il doit fournir une tension un peu plus élevée qu'elle (comme une pompe doit pousser plus fort que la pression du réservoir pour le remplir). C'est pour ça que moteur tournant, on doit mesurer <strong>entre 13,8 et 14,7 V</strong> aux bornes de la batterie.</p>
<div class="note ex">Test en 30 secondes : moteur coupé, tu mesures 12,5 V. Tu démarres : la tension monte à 14,2 V. L'alternateur charge, tout va bien. Si elle reste à 12,3 V moteur tournant, l'alternateur ne charge pas : la voiture roule sur la batterie, qui sera vide dans quelques dizaines de minutes. Le voyant rouge « batterie » au tableau de bord s'allume d'ailleurs dans ce cas.</div>
<h3>Le démarreur</h3>
<p>Un moteur électrique très puissant pour sa taille. Quand tu tournes la clé, un électroaimant pousse un petit pignon qui s'engrène sur la couronne dentée du volant moteur, et le démarreur fait tourner le moteur thermique jusqu'à ce qu'il parte. Il tire 100 à 300 A pendant quelques secondes.</p>
<ul>
<li>Un seul « clac » sans rotation, ou un « clac-clac-clac » rapide : batterie trop faible pour faire tourner le démarreur (ou cosses oxydées).</li>
<li>Le démarreur tourne lentement, péniblement : batterie fatiguée, surtout par temps froid.</li>
<li>Batterie pleine mais rien ne se passe ou un clac franc : démarreur ou son alimentation.</li>
</ul>
<h3>Démarrer avec des câbles</h3>
<ol class="steps">
<li>Les deux voitures coupées, contact coupé.</li>
<li>Câble rouge : sur le + de la batterie à plat.</li>
<li>L'autre bout du rouge : sur le + de la batterie de secours.</li>
<li>Câble noir : sur le – de la batterie de secours.</li>
<li>L'autre bout du noir : sur une partie métallique nue du moteur en panne (une patte, une vis), loin de la batterie. Pourquoi ? Une batterie peut dégager un peu d'hydrogène, un gaz explosif. La dernière connexion fait souvent une petite étincelle : on la fait à l'écart.</li>
<li>Démarrer la voiture de secours, attendre une minute, puis démarrer l'autre. Débrancher dans l'ordre inverse.</li>
</ol>`,
      keys: ['Batterie : 70 Ah = capacité, 640 A EN = force au démarrage', 'Batterie au repos : 12,6 V pleine, 12,2 V à moitié, < 12 V vide', 'Moteur tournant : 13,8 à 14,7 V = l\'alternateur charge', 'Câbles : rouge, rouge, noir, noir sur masse loin de la batterie'] },

    { id: 'allumage', title: 'L\'allumage et le préchauffage', min: 10,
      goals: ['Comprendre comment on passe de 12 V à une étincelle', 'Savoir ce qu\'est l\'avance à l\'allumage', 'Diagnostiquer un raté d\'allumage', 'Comprendre le rôle du préchauffage diesel'],
      body: `
<p>Sur un moteur essence, il faut une étincelle dans chaque cylindre, au bon moment, des dizaines de fois par seconde. Problème : pour qu'une étincelle saute entre deux électrodes dans un gaz comprimé, il faut une tension énorme, <strong>de l'ordre de 20 000 à 40 000 volts</strong>. La batterie n'en fournit que 12.</p>
<h3>La bobine : un transformateur</h3>
<p>La <strong>bobine d'allumage</strong> contient deux enroulements de fil autour d'un noyau de fer : un primaire de quelques centaines de tours, et un secondaire de plusieurs dizaines de milliers de tours de fil très fin. On envoie du 12 V dans le primaire, puis on le coupe brutalement. La coupure crée dans le secondaire une tension multipliée par le rapport du nombre de tours : des dizaines de milliers de volts, pendant une fraction de milliseconde.</p>
<p>Les moteurs modernes ont une <strong>bobine crayon</strong> par cylindre, posée directement sur la bougie. Plus besoin de fils haute tension.</p>
<h3>La bougie</h3>
<p>Vissée dans la culasse, elle débouche dans la chambre de combustion. Le courant haute tension arrive par son électrode centrale et saute vers l'électrode de masse : c'est l'étincelle. L'espace entre les deux (l'<strong>écartement</strong>) est précis, souvent entre 0,7 et 1,1 mm. Avec l'usure, les électrodes s'arrondissent et l'écartement augmente : il faut alors plus de tension, et parfois l'étincelle ne se produit plus.</p>
<div class="note ex">Les bougies se changent selon le carnet, souvent tous les 30 000 à 100 000 km selon leur matériau. Les bougies en iridium ou en platine durent bien plus longtemps que les bougies en nickel classiques.</div>
<h3>L'avance à l'allumage</h3>
<p>La combustion n'est pas instantanée : il faut quelques millisecondes pour que la flamme traverse la chambre. Si on allumait pile au PMH, la pression maximale arriverait trop tard, quand le piston est déjà en train de redescendre : on perdrait de la force. On allume donc un peu <strong>avant</strong> le PMH : c'est l'<strong>avance</strong>, exprimée en degrés de vilebrequin.</p>
<div class="note ana">Un lanceur de ballon qui veut toucher un coureur ne vise pas où il est, mais là où il sera. L'avance, c'est pareil : on déclenche l'étincelle là où le piston sera quand la pression montera.</div>
<p>Plus le moteur tourne vite, plus le piston va vite, plus il faut d'avance. Le calculateur l'ajuste en permanence (par exemple 10° avant PMH au ralenti, 35° à haut régime). Si un capteur entend du cliquetis, il réduit l'avance pour protéger le moteur.</p>
<h3>Les ratés d'allumage</h3>
<p>Quand un cylindre n'explose pas, on dit qu'il a des <strong>ratés</strong>. Le moteur tourne alors sur 3 cylindres au lieu de 4 : il tremble, surtout au ralenti, perd de la puissance, et le voyant moteur s'allume. S'il clignote, les ratés sont graves : du carburant non brûlé part dans le catalyseur et peut le faire fondre.</p>
<p>Le calculateur détecte les ratés en mesurant la vitesse du vilebrequin : à chaque explosion, il accélère un tout petit peu. S'il n'accélère pas au moment où le cylindre 2 devait exploser, c'est un raté sur le 2. Il enregistre alors un code P0302 (le dernier chiffre est le numéro du cylindre).</p>
<div class="note tip">La méthode d'échange : tu as un code P0302 (raté cylindre 2). Inverse la bobine du cylindre 2 avec celle du cylindre 3. Efface le code et roule. Si le défaut devient P0303, le problème a suivi la bobine : c'est elle. S'il reste P0302, refais la même chose avec les bougies. S'il reste encore sur le 2, pense à l'injecteur ou à un problème de compression.</div>
<h3>Et le diesel ?</h3>
<p>Pas d'étincelle : le gazole s'enflamme par la chaleur de la compression. Mais moteur froid, les parois glacées refroidissent l'air comprimé, qui n'atteint pas toujours la température d'inflammation. Les <strong>bougies de préchauffage</strong> sont des tiges métalliques qui deviennent rouges (plus de 1 000 °C) en quelques secondes et chauffent la chambre. Le voyant orange en forme de ressort s'allume au contact : on attend qu'il s'éteigne avant de démarrer.</p>
<p>Une bougie de préchauffage hors service : démarrage difficile à froid, moteur qui tourne irrégulièrement et fume blanc les premières secondes, puis tout rentre dans l'ordre une fois chaud.</p>`,
      keys: ['La bobine transforme le 12 V en 20 000 à 40 000 V', 'Avance : on allume avant le PMH car la combustion prend du temps', 'P0302 = raté cylindre 2 ; méthode d\'échange des bobines', 'Diesel : bougies de préchauffage, uniquement pour le démarrage à froid'] },

    { id: 'fusibles', title: 'Fusibles, relais et éclairage', min: 10,
      goals: ['Comprendre ce que protège vraiment un fusible', 'Savoir lire un calibre et trouver un fusible grillé', 'Comprendre le rôle d\'un relais', 'Connaître les ampoules courantes'],
      body: `
<h3>Le fusible protège le câble</h3>
<p>Un câble électrique supporte un courant maximal selon sa grosseur. Au-delà, il chauffe, son isolant fond, et il peut mettre le feu. Ça arrive lors d'un <strong>court-circuit</strong> : un fil dénudé touche la carrosserie, le courant revient à la masse sans passer par l'appareil, et sans la résistance de l'appareil pour le limiter, il devient énorme.</p>
<p>Le <strong>fusible</strong> est un petit fil calibré pour fondre à un courant précis, avant que le câble qu'il protège ne chauffe dangereusement. Un fusible de 10 A fond si le courant dépasse durablement 10 A. Il se sacrifie pour protéger le câble.</p>
<div class="note why">Pourquoi on dit qu'il protège le câble et pas l'appareil ? Parce que son calibre est choisi selon la grosseur du fil. Si tu mets un fusible de 30 A sur un fil prévu pour 10 A, le fil peut brûler bien avant que le fusible ne fonde. C'est comme ça que démarrent des incendies de voiture.</div>
<h3>Les couleurs</h3>
<p>Les fusibles enfichables (les plus courants) ont une couleur par calibre, normalisée. Le calibre est aussi gravé sur le dessus :</p>
<div class="fuses">
<span style="--f:#d8b98a">5 A beige</span><span style="--f:#8a5a2b;color:#fff">7,5 A marron</span><span style="--f:#d33;color:#fff">10 A rouge</span><span style="--f:#2b6fd6;color:#fff">15 A bleu</span><span style="--f:#f2c500">20 A jaune</span><span style="--f:#eee">25 A blanc</span><span style="--f:#2e9b4a;color:#fff">30 A vert</span>
</div>
<p>On trouve en général une boîte à fusibles dans l'habitacle (sous le volant, sur le côté de la planche de bord ou dans la boîte à gants) et une autre sous le capot, pour les gros consommateurs. Le couvercle ou le manuel indique quel fusible protège quoi.</p>
<div class="note ex">Ton allume-cigare ne fonctionne plus depuis que tu y as branché un vieux chargeur. Tu ouvres la boîte, tu trouves le fusible « prise 12 V » (souvent 15 ou 20 A). En le regardant par transparence, le petit fil en forme de S est coupé. Tu le remplaces par un fusible de <strong>même calibre</strong>. S'il grille à nouveau aussitôt, c'est que le chargeur est en court-circuit.</div>
<div class="note danger">On ne remplace jamais un fusible par un calibre supérieur, et on ne le shunte jamais avec un fil ou du papier d'aluminium. Si un fusible neuf grille immédiatement, il y a un court-circuit à trouver.</div>
<h3>Les relais</h3>
<p>Problème : un bouton du tableau de bord ne peut pas laisser passer 30 A (il fondrait), et on ne veut pas tirer un gros câble jusqu'au tableau de bord. Solution : le <strong>relais</strong>, un interrupteur commandé à distance.</p>
<p>À l'intérieur, une petite bobine (un électroaimant) et un contact. Quand un petit courant (0,1 A) traverse la bobine, l'aimant attire le contact, qui se ferme et laisse passer le gros courant vers l'appareil. Le bouton ne gère que le petit courant.</p>
<p>Ses bornes sont numérotées selon une norme :</p>
<ul>
<li><strong>85 et 86</strong> : la bobine de commande (le petit courant).</li>
<li><strong>30</strong> : l'arrivée du courant de puissance (depuis la batterie).</li>
<li><strong>87</strong> : la sortie vers l'appareil.</li>
</ul>
<div class="note tip">Le ventilateur ne démarre plus ? Si tu trouves dans la boîte un autre relais identique (même référence) qui commande quelque chose de non essentiel, comme le klaxon, tu peux les inverser pour tester. Si le ventilateur repart et que le klaxon ne marche plus, le relais était en cause.</div>
<h3>L'éclairage</h3>
<p>Les références d'ampoules sont normalisées. Les plus courantes :</p>
<table class="tbl"><thead><tr><th>Référence</th><th>Description</th><th>Usage typique</th></tr></thead><tbody>
<tr><td>H7</td><td>Halogène, 1 filament, 55 W</td><td>Croisement ou route (une ampoule par fonction)</td></tr>
<tr><td>H4</td><td>Halogène, 2 filaments, 60/55 W</td><td>Croisement et route dans la même ampoule</td></tr>
<tr><td>H1</td><td>Halogène, 1 filament</td><td>Route, antibrouillards</td></tr>
<tr><td>P21W</td><td>21 W, culot à baïonnette</td><td>Clignotant, feu stop, recul</td></tr>
<tr><td>P21/5W</td><td>2 filaments, 21 W et 5 W</td><td>Feu stop + feu de position arrière</td></tr>
<tr><td>W5W</td><td>5 W, sans culot (wedge)</td><td>Veilleuses, plaque, plafonnier</td></tr>
</tbody></table>
<p>Ne touche jamais le verre d'une ampoule halogène avec les doigts : le gras de la peau crée un point chaud qui la fait éclater ou griller prématurément. Manipule-la par son culot, ou avec un chiffon propre. On change toujours les ampoules de phare par paire : si l'une a grillé, l'autre a le même âge et faiblit.</p>`,
      keys: ['Le fusible protège le câble : jamais de calibre supérieur', 'Couleurs : 10 A rouge, 15 A bleu, 20 A jaune, 30 A vert', 'Relais : petit courant (85/86) commande gros courant (30 → 87)', 'Ne pas toucher le verre d\'une halogène'] }
  ],
  quiz: [
    { q: 'Une ampoule de 60 W en 12 V consomme environ…', a: ['0,2 A', '5 A', '72 A', '720 A'], c: 1, e: 'I = P ÷ U = 60 ÷ 12 = 5 A.' },
    { q: 'Une résistance de 3 Ω alimentée en 12 V laisse passer…', a: ['36 A', '4 A', '0,25 A', '15 A'], c: 1, e: 'I = U ÷ R = 12 ÷ 3 = 4 A.' },
    { q: 'Dans l\'image du château d\'eau, la tension correspond à…', a: ['Le débit', 'La pression', 'Le diamètre du tuyau', 'Le moulin'], c: 1, e: 'Tension = pression, intensité = débit, résistance = rétrécissement.' },

MODULES.push({
  id: 'fluides', title: 'Refroidissement et lubrification', sub: 'Circuits, huile, vidange, fluides',
  lessons: [
    { id: 'refroidissement', title: 'Le circuit de refroidissement', min: 12,
      goals: ['Comprendre pourquoi un moteur doit être refroidi, mais pas trop', 'Suivre le trajet du liquide dans le circuit', 'Comprendre le rôle du thermostat et de la pression', 'Réagir correctement à une surchauffe'],
      body: `
<h3>Un moteur gaspille beaucoup de chaleur</h3>
<p>Sur 100 % de l'énergie contenue dans le carburant, un moteur thermique n'en transforme qu'environ 30 à 40 % en mouvement. Le reste part en chaleur : environ un tiers par l'échappement, et un autre tiers dans le métal du moteur lui-même. Les explosions atteignent plus de 2 000 °C. Sans refroidissement, l'aluminium de la culasse (qui fond vers 600 °C) se déformerait en quelques minutes.</p>
<h3>Mais pas trop froid non plus</h3>
<p>Le but n'est pas de refroidir au maximum, mais de maintenir le moteur autour de <strong>90 °C</strong>. Un moteur trop froid :</p>
<ul>
<li>s'use plus vite, car l'huile reste épaisse et les pièces n'ont pas encore leurs jeux de fonctionnement ;</li>
<li>consomme plus, car le calculateur enrichit le mélange tant qu'il est froid ;</li>
<li>pollue plus, car le catalyseur n'est pas encore chaud.</li>
</ul>
<div class="note ana">Le circuit de refroidissement fonctionne comme ta transpiration. Ton corps veut rester à 37 °C. Quand tu as chaud, tu transpires et l'eau qui s'évapore te rafraîchit. Quand tu as froid, tu arrêtes de transpirer. Le thermostat joue le rôle de ton cerveau qui décide.</div>
<div data-d="cooling"></div>
<h3>Le trajet du liquide</h3>
<ol class="steps">
<li>La <strong>pompe à eau</strong> fait circuler le liquide en permanence dès que le moteur tourne.</li>
<li>Le liquide passe dans des canaux autour des cylindres et dans la culasse (les « chemises d'eau ») et se charge de chaleur.</li>
<li>Il arrive au <strong>thermostat</strong>. Moteur froid, le thermostat est fermé : le liquide fait demi-tour vers la pompe, sans passer par le radiateur. Le moteur chauffe donc vite.</li>
<li>Vers 85–95 °C, le thermostat s'ouvre. Le liquide chaud part au <strong>radiateur</strong>, à l'avant de la voiture.</li>
<li>Dans le radiateur, il circule dans de fins tubes entourés d'ailettes. L'air qui traverse la calandre en roulant le refroidit.</li>
<li>À l'arrêt ou en ville, l'air ne passe pas assez : le <strong>motoventilateur</strong> se déclenche pour forcer l'air à travers le radiateur.</li>
<li>Le liquide refroidi revient à la pompe, et le tour recommence.</li>
</ol>
<p>En parallèle, une partie du liquide chaud passe dans le <strong>radiateur de chauffage</strong>, caché derrière la planche de bord. Quand tu mets le chauffage, un ventilateur souffle de l'air à travers ce petit radiateur : c'est la chaleur du moteur qui te réchauffe. C'est pour ça que le chauffage reste froid les premières minutes.</p>
<h3>Le thermostat, une vanne à cire</h3>
<p>À l'intérieur, une capsule de cire qui se dilate en chauffant. Vers 85–95 °C (la valeur est gravée dessus), la cire gonfle et pousse un clapet qui s'ouvre. Pas d'électronique, juste de la physique.</p>
<div class="note ex">Deux pannes de thermostat, deux symptômes opposés.<br><strong>Bloqué ouvert</strong> : le liquide va toujours au radiateur, le moteur peine à chauffer. L'aiguille reste basse sur autoroute en hiver, le chauffage est tiède, la consommation augmente.<br><strong>Bloqué fermé</strong> : le liquide ne va jamais au radiateur. L'aiguille monte vite dans le rouge, en quelques minutes. Beaucoup plus grave.</div>
<h3>Pourquoi le circuit est sous pression</h3>
<p>L'eau bout à 100 °C. Le moteur fonctionne à 90 °C, mais certains points chauds (autour des soupapes d'échappement) dépassent largement 100 °C. Pour éviter que le liquide ne bouille, on le met sous pression : le bouchon du <strong>vase d'expansion</strong> est taré, souvent autour de 1,2 à 1,5 bar. Sous cette pression, le point d'ébullition monte vers 120–125 °C. Le glycol de l'antigel le monte encore un peu.</p>
<p>Le vase sert aussi de réserve : le liquide se dilate en chauffant, et le surplus y monte. Il y a deux repères, MIN et MAX : le niveau se contrôle <strong>moteur froid</strong>.</p>
<h3>Le liquide de refroidissement</h3>
<p>Ce n'est pas de l'eau pure : c'est un mélange d'eau et de <strong>glycol</strong> (environ 50/50), avec des additifs anticorrosion. Le glycol l'empêche de geler (jusqu'à environ −35 °C pour un mélange 50/50) et élève son point d'ébullition. Les additifs protègent l'aluminium, la pompe et le radiateur de la rouille et des dépôts.</p>
<div class="note warn">La couleur (rose, vert, bleu, jaune) n'est pas une norme fiable : deux liquides de même couleur peuvent être incompatibles. On achète le liquide qui correspond à la norme du constructeur (indiquée dans le carnet), et on évite de mélanger des types différents.</div>
<div class="note danger">Si l'aiguille de température monte dans le rouge, ou si le voyant rouge de température s'allume : arrête-toi dès que tu peux le faire en sécurité et coupe le moteur. Ne rouvre pas le vase avant que tout soit froid. Continuer de rouler peut déformer la culasse et détruire le joint de culasse : une réparation qui se chiffre en milliers d'euros.</div>`,
      keys: ['Température de fonctionnement ≈ 90 °C : ni trop chaud, ni trop froid', 'Thermostat fermé à froid, ouvert vers 85–95 °C', 'Pression du circuit = ébullition repoussée vers 120 °C', 'Le chauffage habitacle vient du liquide de refroidissement'] },

    { id: 'lubrification', title: 'Le circuit de lubrification', min: 10,
      goals: ['Comprendre les 4 rôles de l\'huile', 'Suivre son trajet dans le moteur', 'Comprendre pourquoi le voyant de pression d\'huile est si grave', 'Savoir contrôler le niveau correctement'],
      body: `
<h3>Le film d'huile</h3>
<p>Dans un moteur, des pièces métalliques frottent les unes contre les autres à grande vitesse : le vilebrequin dans ses paliers, les pistons dans les cylindres, les cames sur les soupapes. Métal contre métal, elles chaufferaient jusqu'à se souder en quelques secondes.</p>
<p>L'huile forme entre elles un <strong>film</strong> de quelques millièmes de millimètre. Les pièces ne se touchent jamais : elles glissent sur l'huile.</p>
<div class="note ana">Un aquaplaning, c'est un pneu qui glisse sur un film d'eau sans toucher la route. Pour la voiture, c'est dangereux. Pour les pièces du moteur, c'est exactement ce qu'on veut : qu'elles « aquaplanent » en permanence sur l'huile.</div>
<p>L'huile a en fait quatre missions :</p>
<ol class="steps">
<li><strong>Lubrifier</strong> : réduire les frottements, donc l'usure et la chaleur.</li>
<li><strong>Refroidir</strong> : elle évacue la chaleur des pièces que le liquide de refroidissement n'atteint pas, comme le dessous des pistons ou le turbo.</li>
<li><strong>Nettoyer</strong> : elle contient des détergents qui captent les suies et les microparticules métalliques et les emmènent vers le filtre. C'est pour ça qu'une huile noircit : elle fait son travail.</li>
<li><strong>Protéger</strong> : contre la corrosion et l'acidité des résidus de combustion.</li>
</ol>
<div data-d="oil"></div>
<h3>Le trajet de l'huile</h3>
<p>L'huile repose dans le <strong>carter</strong>, sous le moteur. La <strong>pompe à huile</strong>, entraînée par le vilebrequin, l'aspire à travers une <strong>crépine</strong> (une grille qui arrête les gros débris). Elle la pousse sous pression dans le <strong>filtre à huile</strong>, qui retient les particules fines, puis dans les <strong>galeries</strong> : des canaux percés dans le bloc et la culasse qui l'amènent à chaque point à lubrifier. Ensuite, elle redescend tout simplement par gravité dans le carter.</p>
<div class="note why">C'est la <strong>pression</strong> qui maintient le film d'huile entre les pièces. Sans pression, l'huile n'arrive plus, le film disparaît et le métal touche le métal. En quelques secondes à quelques minutes, les paliers du vilebrequin fondent : on dit que le moteur « coule une bielle ». Le moteur est alors bon pour la casse.</div>
<div class="note danger">Le voyant rouge en forme de <strong>burette</strong> (une petite lampe à huile) signale une pression d'huile insuffisante. S'il s'allume en roulant : arrêt immédiat et moteur coupé. Pas « au prochain garage ». Tout de suite.</div>
<p>Note la différence : certaines voitures ont aussi un voyant orange de <strong>niveau</strong> d'huile bas. Lui demande de compléter rapidement, mais n'impose pas l'arrêt immédiat.</p>
<h3>Contrôler le niveau</h3>
<ol class="steps">
<li>Voiture sur sol plat. Sur une pente, l'huile penche dans le carter et la lecture est fausse.</li>
<li>Moteur arrêté depuis au moins 5 à 10 minutes (idéalement le matin, moteur froid), le temps que l'huile redescende dans le carter.</li>
<li>Sortir la jauge (souvent poignée jaune ou orange), l'essuyer avec un chiffon, la replonger à fond, la ressortir.</li>
<li>Lire où s'arrête l'huile entre les repères MIN et MAX. Sur beaucoup de moteurs, l'écart entre les deux représente environ 1 litre.</li>
<li>Si besoin, compléter par le bouchon de remplissage (sur le dessus du moteur, marqué d'une burette), par petites quantités (0,2 à 0,3 L), avec la bonne huile, en attendant une minute avant de recontrôler.</li>
</ol>
<div class="note warn">Trop d'huile est aussi néfaste que pas assez. Au-dessus du MAX, le vilebrequin tape dans l'huile et la fait mousser : une huile mousseuse lubrifie mal, et l'excès peut être aspiré et brûlé, endommageant le catalyseur.</div>
<div class="note ex">Un moteur peut consommer un peu d'huile : jusqu'à environ 0,5 L pour 1 000 km, beaucoup de constructeurs le considèrent comme normal. Au-delà de 1 L pour 1 000 km, il y a un problème (segments, turbo, joints de soupapes).</div>
<p>Beaucoup de voitures récentes n'ont plus de jauge : le niveau se lit dans l'ordinateur de bord, après une procédure indiquée dans le manuel.</p>`,
      keys: ['L\'huile lubrifie, refroidit, nettoie, protège', 'Circuit : carter → crépine → pompe → filtre → galeries → retour', 'Voyant rouge pression d\'huile (burette) = arrêt immédiat', 'Niveau : sol plat, moteur au repos, entre MIN et MAX'] },

    { id: 'vidange', title: 'Choisir son huile et faire une vidange', min: 15,
      goals: ['Comprendre ce que veut dire 5W-30', 'Lire les normes ACEA et constructeur sur un bidon', 'Savoir pourquoi et quand vidanger', 'Faire une vidange pas à pas'],
      body: `
<h3>Pourquoi l'huile s'use</h3>
<p>L'huile ne disparaît pas, mais elle se dégrade. La chaleur la fait vieillir, les suies et le carburant non brûlé la polluent, ses additifs s'épuisent. Une huile usée lubrifie mal et ne nettoie plus. La <strong>vidange</strong> consiste à remplacer toute l'huile, et le filtre avec.</p>
<h3>La viscosité : décoder « 5W-30 »</h3>
<p>La <strong>viscosité</strong>, c'est l'épaisseur d'un liquide, sa résistance à l'écoulement. Le miel est très visqueux, l'eau très peu. Le problème de l'huile : elle est épaisse quand elle est froide, et fluide quand elle est chaude. Or le moteur a besoin des deux :</p>
<ul>
<li>à froid, au démarrage, elle doit être <strong>fluide</strong> pour circuler vite partout. C'est au démarrage que se produit la majorité de l'usure, pendant les quelques secondes où l'huile n'est pas encore arrivée ;</li>
<li>à chaud, elle doit rester <strong>assez épaisse</strong> pour maintenir le film entre les pièces.</li>
</ul>
<p>Les huiles modernes sont « multigrades » : elles se comportent comme une huile fine à froid et comme une huile plus épaisse à chaud. L'étiquette <strong>5W-30</strong> donne les deux comportements :</p>
<ul>
<li><strong>5W</strong> : le grade à froid. W veut dire <em>Winter</em> (hiver). Plus le chiffre est petit, plus l'huile est fluide à froid. Une 0W est plus fluide qu'une 5W, elle-même plus fluide qu'une 10W.</li>
<li><strong>30</strong> : le grade à chaud, mesuré vers 100 °C. Plus le chiffre est grand, plus l'huile reste épaisse à chaud.</li>
</ul>
<div class="note ex">Une 5W-30 démarre en garantissant une bonne circulation jusqu'à environ −30 °C, et à 100 °C elle a l'épaisseur d'une huile de grade 30. Une 10W-40 sera un peu plus épaisse à froid comme à chaud : elle convient à des moteurs plus anciens, aux jeux plus grands. Une 0W-20 est très fluide : elle n'est utilisée que sur des moteurs récents conçus pour, souvent hybrides ou japonais, pour réduire la consommation.</div>
<p>Joue avec les grades pour voir la différence :</p>
<div data-w="viscosite"></div>
<h3>Les normes : aussi importantes que la viscosité</h3>
<p>Deux huiles 5W-30 peuvent être très différentes. Leur composition (additifs, cendres, résistance à la chaleur) est garantie par des <strong>normes</strong>, imprimées au dos du bidon :</p>
<ul>
<li><strong>ACEA</strong> (norme européenne). La lettre indique l'usage : A/B pour les moteurs essence et diesel classiques (par exemple A3/B4), C pour les moteurs équipés d'un filtre à particules ou d'un catalyseur sensible (C2, C3, C4…). Les huiles C sont dites « low SAPS » : elles contiennent peu de cendres, de soufre et de phosphore, qui colmateraient le FAP.</li>
<li><strong>Normes constructeurs</strong> : les marques imposent souvent leur propre cahier des charges. Exemples : VW 504.00/507.00, PSA B71 2290, Renault RN0720, BMW Longlife-04, Mercedes 229.51, Ford WSS-M2C913-D.</li>
</ul>
<div class="note ex">Ton carnet indique : « huile 5W-30 répondant à la norme Renault RN0720 ». En magasin, tu cherches un bidon où sont écrits <strong>5W-30</strong> en grand <strong>et</strong> <strong>RN0720</strong> au dos. Une 5W-30 « universelle » sans cette norme ne convient pas, surtout si la voiture a un FAP.</div>
<h3>Quand vidanger</h3>
<p>Le carnet indique par exemple « tous les 20 000 km ou tous les ans ». Encore une fois, <strong>le premier seuil atteint</strong>. Selon les marques, on trouve de 10 000 à 30 000 km. Beaucoup de voitures calculent elles-mêmes l'échéance et l'affichent au tableau de bord.</p>
<p>Les petits trajets (moins de 10 km), la ville, la conduite sportive, le remorquage ou la poussière sont des <strong>conditions sévères</strong> : l'huile n'a jamais le temps de bien chauffer, l'eau de condensation et le carburant s'y accumulent. Il est alors sage de raccourcir l'intervalle.</p>
<h3>La vidange pas à pas</h3>
<p><strong>Matériel</strong> : la bonne huile (quantité indiquée dans le manuel, souvent 4 à 5 L), un filtre à huile neuf, un joint de bouchon neuf, une clé pour le bouchon, une clé à filtre, un bac de vidange d'au moins 6 L, des gants, du chiffon.</p>
<ol class="steps">
<li>Faire tourner le moteur quelques minutes : une huile tiède coule mieux et entraîne plus d'impuretés. Pas brûlante, pour ne pas te brûler.</li>
<li>Lever l'avant et le poser sur chandelles, ou travailler sur une fosse ou un pont. Retirer le cache sous moteur s'il y en a un.</li>
<li>Ouvrir le bouchon de remplissage en haut du moteur : l'air entre et l'huile coulera mieux.</li>
<li>Placer le bac sous le bouchon de vidange (au point le plus bas du carter), dévisser à la main les derniers tours en appuyant, puis retirer vite. Le jet part en biais : place le bac en conséquence. Laisser couler complètement, 10 à 15 minutes.</li>
<li>Dévisser le filtre à huile avec la clé à filtre (il contient encore de l'huile : bac dessous). Vérifier que son vieux joint est bien parti avec lui.</li>
<li>Huiler du bout du doigt le joint du filtre neuf avec de l'huile neuve. Le visser à la main jusqu'au contact, puis serrer de 3/4 de tour à la main ou au couple indiqué sur le filtre. Pour une cartouche (filtre en papier dans un boîtier), changer aussi les joints du couvercle.</li>
<li>Nettoyer le bouchon de vidange, poser un <strong>joint neuf</strong> (le joint est écrasé au serrage : c'est une pièce à usage unique), revisser et serrer au couple (souvent entre 20 et 40 N·m).</li>
<li>Remplir avec la quantité indiquée <strong>moins un demi-litre</strong>, refermer, démarrer 30 secondes (le voyant d'huile doit s'éteindre en quelques secondes), couper.</li>
<li>Attendre 5 minutes, contrôler à la jauge, compléter jusqu'au repère entre MIN et MAX.</li>
<li>Vérifier qu'il n'y a pas de fuite au bouchon et au filtre, remettre le cache, réinitialiser l'indicateur d'entretien (procédure dans le manuel), et apporter l'huile usagée en déchetterie dans les bidons vides.</li>
</ol>
<div class="note tip">Note la date, le kilométrage, la marque et la norme de l'huile dans ton carnet. C'est ta preuve d'entretien à la revente.</div>`,
      keys: ['5W-30 : 5W = fluidité à froid (W = winter), 30 = épaisseur à chaud', 'La norme (ACEA, constructeur) compte autant que la viscosité', 'ACEA C = low SAPS, compatible FAP', 'Joint de bouchon neuf, serrage au couple, remplir un peu moins puis ajuster'] },

    { id: 'autres-fluides', title: 'Les autres fluides', min: 9,
      goals: ['Connaître tous les fluides d\'une voiture', 'Comprendre pourquoi le liquide de frein se change tous les 2 ans', 'Savoir reconnaître chaque réservoir sous le capot'],
      body: `
<p>En plus de l'huile moteur et du liquide de refroidissement, une voiture contient plusieurs autres fluides. Chacun a sa fonction, sa norme et son réservoir.</p>
<h3>Le liquide de frein : le plus important pour la sécurité</h3>
<p>Il transmet la force de ta pédale jusqu'aux roues (module 7). On utilise ses propriétés : il est incompressible et résiste à de très fortes températures. La norme la plus courante est <strong>DOT 4</strong> (le DOT est l'organisme américain qui a fixé ces normes ; plus le chiffre est élevé, plus le point d'ébullition est haut : DOT 3, DOT 4, DOT 5.1).</p>
<p>Son défaut : il est <strong>hygroscopique</strong>. Ça veut dire qu'il absorbe l'humidité de l'air, lentement, à travers les durites et le bouchon du bocal. Or chaque pourcentage d'eau abaisse son point d'ébullition.</p>
<div class="note ex">Un liquide DOT 4 neuf bout vers 230 °C. Avec 3 % d'eau (environ 2 ans d'âge), il peut bouillir vers 155 °C. Dans une longue descente de col, les étriers chauffent : si le liquide bout, il forme des bulles de vapeur. La vapeur se comprime, donc la pédale s'enfonce sans freiner. C'est pour ça qu'on le remplace tous les <strong>2 ans</strong>, même si le niveau est bon.</div>
<p>Le niveau baisse lentement avec l'usure des plaquettes (les pistons d'étriers sortent un peu plus et contiennent plus de liquide). Un niveau qui baisse vite indique une fuite : à faire vérifier tout de suite.</p>
<h3>Le tableau des fluides</h3>

  id: 'transmission', title: 'La transmission', sub: 'Embrayage, boîte, différentiel, cardans',
  lessons: [
    { id: 'chaine', title: 'Du moteur aux roues', min: 9,
      goals: ['Comprendre les deux problèmes que la transmission résout', 'Connaître l\'ordre des éléments du moteur aux roues', 'Distinguer traction, propulsion et 4x4'],
      body: `
<h3>Deux problèmes à résoudre</h3>
<p>Le moteur tourne, il faut faire tourner les roues. Pourquoi ne pas les relier directement ? À cause de deux problèmes.</p>
<p><strong>Problème 1 : les vitesses ne collent pas.</strong> Un moteur tourne entre environ 800 tr/min (ralenti) et 6 000 tr/min. Il ne produit de la force que dans une certaine plage. Les roues, elles, tournent de 0 tr/min (à l'arrêt) à environ 1 500 tr/min (à 180 km/h). Il faut un intermédiaire qui adapte la vitesse : c'est la <strong>boîte de vitesses</strong>.</p>
<p><strong>Problème 2 : le moteur ne peut pas s'arrêter.</strong> Un moteur thermique ne démarre pas tout seul et cale en dessous d'environ 600 tr/min. À un feu rouge, les roues sont arrêtées mais le moteur doit continuer de tourner. Il faut pouvoir séparer le moteur des roues : c'est l'<strong>embrayage</strong>.</p>
<div class="note ana">Sur un vélo, tes jambes sont le moteur. Elles sont efficaces à un certain rythme de pédalage, ni trop lent ni trop rapide. Le dérailleur (la boîte) te permet de garder ce rythme que tu montes une côte ou que tu fonces en descente. Et tu peux arrêter de pédaler en roue libre (l'embrayage) sans que le vélo s'arrête.</div>
<div data-d="drivetrain"></div>
<h3>L'ordre des éléments</h3>
<ol class="steps">
<li><strong>Embrayage</strong> : relie ou sépare le moteur de la boîte. Il est fixé au volant moteur.</li>
<li><strong>Boîte de vitesses</strong> : choisit le rapport, c'est-à-dire combien de tours fait le moteur pour un tour de sortie de boîte.</li>
<li><strong>Arbre de transmission</strong> (seulement en propulsion et 4x4) : un long tube qui amène la rotation à l'arrière.</li>
<li><strong>Différentiel</strong> : renvoie la rotation vers les deux roues et leur permet de tourner à des vitesses différentes en virage.</li>
<li><strong>Transmissions (ou cardans, demi-arbres)</strong> : relient le différentiel à chaque roue.</li>
</ol>
<h3>Traction, propulsion, 4x4</h3>
<p>Le schéma montre une <strong>propulsion</strong>, où chaque élément est bien séparé : c'est plus facile pour apprendre.</p>
<p>Sur une <strong>traction</strong> (la grande majorité des voitures), tout est regroupé à l'avant : le moteur transversal, et juste à côté un carter unique qui contient la boîte <em>et</em> le différentiel. On l'appelle la <strong>boîte-pont</strong>. Deux transmissions en partent directement vers les roues avant. Avantages : compact, moins cher, plus d'espace dans l'habitacle, et rassurant sur route glissante (les roues avant tirent dans la direction où elles pointent).</p>
<p>Sur un <strong>4x4</strong>, un élément supplémentaire répartit la force entre l'avant et l'arrière : une boîte de transfert, un différentiel central ou un coupleur.</p>`,
      keys: ['La boîte adapte la vitesse du moteur à celle des roues', 'L\'embrayage permet de séparer moteur et roues', 'Embrayage → boîte → (arbre) → différentiel → cardans → roues', 'Traction : boîte et différentiel réunis (boîte-pont)'] },

    { id: 'embrayage', title: 'L\'embrayage', min: 11,
      goals: ['Comprendre comment un frottement transmet la rotation', 'Savoir ce qui se passe quand on appuie sur la pédale', 'Reconnaître un embrayage usé', 'Comprendre le volant bimasse'],
      body: `
<h3>Le principe : un frottement contrôlé</h3>
<p>L'embrayage transmet la rotation par <strong>friction</strong>. Un disque garni d'un matériau qui accroche (proche d'une plaquette de frein) est pressé très fort contre le volant moteur. Tant qu'il est pressé, il tourne avec lui. Quand on relâche la pression, il est libre.</p>
<div class="note ana">Pose la paume de ta main sur un disque vinyle qui tourne. Si tu appuies fort, ta main est entraînée. Si tu appuies à peine, elle glisse. Si tu la retires, le disque tourne sans toi. L'embrayage, c'est ça, avec beaucoup plus de force.</div>
<div data-d="clutch"></div>
<h3>Les pièces</h3>
<dl class="defs">
<dt>Le volant moteur</dt><dd>Fixé au vilebrequin, il tourne avec le moteur. Sa face sert de surface de frottement.</dd>
<dt>Le disque d'embrayage</dt><dd>Un disque avec des garnitures de friction des deux côtés. En son centre, un moyeu cannelé glisse sur l'arbre d'entrée de la boîte. C'est la pièce qui s'use, comme une plaquette.</dd>
<dt>Le mécanisme (plateau de pression)</dt><dd>Boulonné sur le volant, il contient le <strong>diaphragme</strong> : un grand ressort en forme de cône, découpé en lamelles. Au repos, il presse très fort le plateau contre le disque, donc le disque contre le volant. Le tout tourne ensemble : c'est <strong>embrayé</strong>.</dd>
<dt>La butée</dt><dd>Un roulement qui vient appuyer au centre du diaphragme.</dd>
<dt>La commande</dt><dd>Par câble, ou le plus souvent hydraulique : un petit cylindre derrière la pédale (l'émetteur) envoie du liquide (souvent le même que le liquide de frein, et parfois le même bocal) vers un second cylindre (le récepteur) qui pousse la butée.</dd>
</dl>
<h3>Ce qui se passe quand tu appuies</h3>
<ol class="steps">
<li>La pédale envoie le liquide au récepteur, qui pousse la butée.</li>
<li>La butée appuie sur le centre du diaphragme. Comme un levier, le diaphragme bascule et relâche le plateau.</li>
<li>Le disque n'est plus pressé : il ne tourne plus avec le moteur. C'est <strong>débrayé</strong>. Tu peux changer de vitesse.</li>
<li>Quand tu relâches doucement, le diaphragme reprend appui progressivement : le disque glisse d'abord un peu (c'est le <strong>point de patinage</strong>, là où la voiture commence à avancer), puis accroche complètement.</li>
</ol>
<p>Donc à retenir, c'est contre-intuitif : <strong>pédale enfoncée = débrayé = moteur séparé des roues</strong>.</p>
<h3>Le volant bimasse</h3>
<p>Les moteurs modernes, surtout diesel, donnent des à-coups à chaque explosion. Le volant <strong>bimasse</strong> est coupé en deux parties reliées par de gros ressorts, qui absorbent ces à-coups avant qu'ils n'arrivent dans la boîte. Usé, il se manifeste par un claquement métallique au démarrage ou à l'arrêt du moteur, et des vibrations à bas régime. Il se change en même temps que l'embrayage, ce qui fait souvent grimper la facture à plus de 1 000 €.</p>
<h3>Reconnaître un embrayage usé</h3>
<p>Le disque s'use comme une gomme. Quand ses garnitures sont trop fines, le diaphragme ne le presse plus assez fort : il <strong>patine</strong>.</p>
<div class="note ex">Le test simple : sur une route dégagée, en 4e vers 50 km/h (bas régime), accélère à fond. Si le compte-tours grimpe brusquement sans que la voiture accélère en proportion, l'embrayage patine. Autre indice : le point de patinage se trouve tout en haut de la course de la pédale.</div>
<ul>
<li>Odeur de brûlé âcre après un démarrage en côte ou un créneau difficile : les garnitures chauffent.</li>
<li>Un bruit de roulement qui disparaît quand on enfonce la pédale (ou qui apparaît seulement pédale enfoncée) : souvent la butée.</li>
<li>Vitesses qui craquent alors que la pédale est au plancher : l'embrayage ne débraye pas complètement (commande hydraulique, air dans le circuit).</li>
</ul>
<div class="note tip">Un embrayage dure souvent entre 100 000 et 250 000 km selon la conduite. Pour le préserver : ne reste pas pied sur la pédale au feu rouge (mets au point mort), ne laisse pas le pied posé dessus en roulant, et ne fais pas patiner longtemps en côte (utilise le frein à main).</div>`,
      keys: ['Le disque est pressé entre volant moteur et plateau par le diaphragme', 'Pédale enfoncée = débrayé (moteur séparé)', 'Patinage : le régime monte sans que la voiture accélère', 'Volant bimasse : absorbe les à-coups, se change souvent avec l\'embrayage'] },

    { id: 'boite', title: 'La boîte de vitesses', min: 14,
      goals: ['Comprendre ce qu\'est un rapport de démultiplication (3,5:1, 0,8:1…)', 'Comprendre le lien entre couple et vitesse dans la boîte', 'Savoir comment fonctionne une boîte manuelle', 'Connaître les différents types de boîtes automatiques'],
      body: `
<h3>L'idée : échanger de la force contre de la vitesse</h3>
<p>Quand deux roues dentées de tailles différentes s'engrènent, la petite tourne plus vite que la grande. Si un pignon de 15 dents entraîne un pignon de 45 dents, il doit faire 3 tours pour que le grand en fasse 1. Mais en échange, le grand tourne avec 3 fois plus de force.</p>
<div class="note ana">Sur un vélo, le petit plateau devant et le grand pignon derrière, c'est facile de monter une côte, mais tu pédales vite pour avancer lentement. Le grand plateau et le petit pignon : tu vas vite, mais pédaler est dur. Tu échanges de la force contre de la vitesse. Il n'y a pas de magie : l'énergie reste la même.</div>
<h3>Lire un rapport : 3,5:1</h3>
<p>Le <strong>rapport de démultiplication</strong> indique combien de tours fait l'entrée de la boîte (côté moteur) pour un tour de sortie. Il s'écrit avec deux points, comme le taux de compression.</p>
<ul>
<li><strong>3,5:1</strong> veut dire : l'entrée fait 3,5 tours pendant que la sortie en fait 1. La sortie tourne 3,5 fois moins vite, mais avec 3,5 fois plus de couple. C'est un rapport <strong>court</strong>, typique d'une 1re.</li>
<li><strong>1:1</strong> : entrée et sortie tournent à la même vitesse. On l'appelle la « prise directe ».</li>
<li><strong>0,8:1</strong> : l'entrée fait 0,8 tour pour un tour de sortie : la sortie tourne <em>plus vite</em> que le moteur. C'est un rapport <strong>long</strong>, une surmultipliée, typique de la 5e ou 6e.</li>
</ul>
<div class="note ex">Une boîte typique : 1re = 3,7:1, 2e = 2,0:1, 3e = 1,3:1, 4e = 1,0:1, 5e = 0,8:1. Ensuite, le différentiel ajoute une démultiplication finale, par exemple 4,0:1.<br>En 1re, le rapport total est 3,7 × 4,0 = 14,8. Le moteur fait 14,8 tours pour un tour de roue. À 3 000 tr/min, les roues tournent à 3 000 ÷ 14,8 ≈ 200 tr/min, soit environ 23 km/h. Beaucoup de force pour démarrer.<br>En 5e : 0,8 × 4,0 = 3,2. À 3 000 tr/min, les roues tournent à 3 000 ÷ 3,2 ≈ 940 tr/min, soit environ 110 km/h. Le moteur tourne au même régime, mais la voiture va 5 fois plus vite.</div>
<p>Et le couple suit le chemin inverse : avec 200 N·m au moteur, en 1re la roue reçoit environ 200 × 14,8 ≈ 3 000 N·m (moins les pertes). En 5e, seulement 200 × 3,2 = 640 N·m. Voilà pourquoi on ne démarre pas en 5e : il n'y a pas assez de force aux roues.</p>
<h3>La boîte manuelle</h3>
<p>À l'intérieur, deux arbres parallèles portent des paires de pignons, une paire par vitesse. Les pignons sont toujours engrenés entre eux, mais sur l'un des arbres, ils tournent fou (librement, sans entraîner l'arbre). Quand tu passes une vitesse, le levier déplace un <strong>manchon</strong> (le baladeur) qui vient verrouiller un de ces pignons sur son arbre. Seule cette paire transmet alors la rotation.</p>
<p>Problème : au moment de verrouiller, le pignon et l'arbre ne tournent pas à la même vitesse. Les forcer ensemble ferait craquer les dents. Le <strong>synchroniseur</strong> est un petit cône de friction qui, juste avant l'enclenchement, freine ou accélère le pignon pour égaliser les vitesses. C'est pour ça qu'on sent une légère résistance avant que la vitesse « rentre ».</p>
<div class="note ex">Une vitesse qui craque (surtout la 2e, la plus sollicitée) quand on la passe vite : synchroniseur usé. Si toutes les vitesses craquent, même passées lentement, c'est plutôt l'embrayage qui ne débraye pas complètement. La marche arrière n'a souvent pas de synchro : c'est pour ça qu'il faut être à l'arrêt complet pour l'engager.</div>
<h3>Les boîtes automatiques</h3>
<table class="tbl"><thead><tr><th>Type</th><th>Principe</th><th>Points à connaître</th></tr></thead><tbody>
<tr><td>Automatique à convertisseur</td><td>Un <strong>convertisseur de couple</strong> (deux turbines face à face dans de l'huile) remplace l'embrayage : le moteur fait tourner l'huile, qui fait tourner la seconde turbine. Des <strong>trains épicycloïdaux</strong> (engrenages imbriqués comme un système solaire) donnent les rapports.</td><td>Douce, robuste. Vidange d'huile ATF importante.</td></tr>
<tr><td>Double embrayage (DSG, EDC, EAT, PDK…)</td><td>Deux boîtes manuelles imbriquées, chacune avec son embrayage : une pour les rapports impairs, une pour les pairs. Pendant que tu roules en 3e, la 4e est déjà engagée sur l'autre embrayage. Le changement consiste à passer d'un embrayage à l'autre.</td><td>Changements très rapides. Peut être saccadée à très basse vitesse.</td></tr>
<tr><td>CVT (variation continue)</td><td>Deux poulies dont le diamètre varie, reliées par une courroie métallique. Pas de rapports fixes : le rapport change en continu.</td><td>Effet « mobylette » : le régime reste constant pendant que la vitesse monte. Courante sur Toyota, Nissan, Honda.</td></tr>
<tr><td>Robotisée</td><td>Une boîte manuelle classique dont l'embrayage et les passages sont actionnés par des vérins.</td><td>Peu chère, souvent lente et saccadée. Moins répandue aujourd'hui.</td></tr>
</tbody></table>`,
      keys: ['3,5:1 = l\'entrée fait 3,5 tours pour 1 en sortie : couple × 3,5, vitesse ÷ 3,5', 'Rapport court (1re) = force ; rapport long (5e, 6e) = vitesse', 'Synchroniseurs : égalisent les vitesses, évitent les craquements', 'Auto à convertisseur, double embrayage, CVT, robotisée'] },

    { id: 'differentiel', title: 'Le différentiel et les cardans', min: 11,
      goals: ['Comprendre pourquoi les roues ne tournent pas à la même vitesse en virage', 'Comprendre le fonctionnement du différentiel', 'Connaître son défaut et les solutions', 'Reconnaître un cardan usé'],
      body: `
<h3>Le problème du virage</h3>
<p>Dans un virage, les deux roues d'un même essieu ne parcourent pas la même distance. La roue extérieure décrit un cercle plus grand que la roue intérieure.</p>
<div class="note ex">Un rond-point de 10 m de rayon, une voiture large de 1,5 m entre ses roues. La roue intérieure parcourt un cercle de 10 m de rayon : 2 × 3,14 × 10 ≈ 63 m. La roue extérieure, un cercle de 11,5 m de rayon : 2 × 3,14 × 11,5 ≈ 72 m. Elle parcourt 9 m de plus, soit environ 15 %. Elle doit donc tourner 15 % plus vite.</div>
<div class="note ana">Une fanfare qui défile et tourne au coin de la rue : le musicien à l'intérieur fait presque du sur-place, celui à l'extérieur doit allonger le pas pour garder l'alignement.</div>
<p>Si les deux roues étaient reliées par un axe rigide, l'une d'elles devrait glisser sur la route à chaque virage : usure des pneus, voiture qui refuse de tourner, transmission qui force. Le <strong>différentiel</strong> résout ce problème.</p>
<div data-d="differential"></div>
<h3>Comment il fonctionne</h3>
<ol class="steps">
<li>Le <strong>pignon d'attaque</strong>, un petit pignon conique, reçoit la rotation de la boîte (ou de l'arbre de transmission). Il entraîne une grande roue dentée, la <strong>couronne</strong>. Le rapport entre les deux donne la démultiplication finale (par exemple 4:1, vue à la leçon précédente). Sur une propulsion, ce couple d'engrenages renvoie aussi la rotation à 90°.</li>
<li>La couronne est fixée sur un <strong>boîtier</strong>, qui tourne avec elle.</li>
<li>Dans le boîtier, deux (ou quatre) petits pignons, les <strong>satellites</strong>, sont montés sur un axe. Ils peuvent tourner sur eux-mêmes.</li>
<li>Les satellites s'engrènent sur deux pignons, les <strong>planétaires</strong>, chacun relié à une roue.</li>
</ol>
<p><strong>En ligne droite</strong>, les deux roues résistent pareil. Les satellites ne tournent pas sur eux-mêmes : ils agissent comme des cales et entraînent les deux planétaires à la même vitesse. Tout tourne en bloc.</p>
<p><strong>En virage</strong>, la roue intérieure freine un peu. Les satellites se mettent alors à tourner sur eux-mêmes : ce qu'un planétaire perd en vitesse, l'autre le gagne. La moyenne des deux roues reste égale à la vitesse de la couronne.</p>
<h3>Son défaut</h3>
<p>Le différentiel envoie la même force aux deux roues, limitée par celle qui accroche le moins. Si une roue est sur la glace ou dans la boue, elle patine dans le vide, et l'autre, sur le sec, ne reçoit presque rien. La voiture reste bloquée.</p>
<p>Les solutions :</p>
<ul>
<li>le <strong>différentiel autobloquant</strong> (sportives, 4x4) : un mécanisme qui freine la roue qui patine et renvoie la force vers l'autre ;</li>
<li>l'<strong>antipatinage électronique</strong> (sur presque toutes les voitures récentes) : le système ABS freine la roue qui patine, ce qui oblige le différentiel à envoyer la force à l'autre ;</li>
<li>le <strong>blocage de différentiel</strong> (vrais 4x4) : on verrouille les deux roues ensemble, uniquement en tout-terrain.</li>
</ul>
<h3>Les cardans et leurs soufflets</h3>
<p>Sur une traction, les roues avant doivent à la fois tourner (rouler), braquer (direction) et monter et descendre (suspension). Les transmissions qui les relient au différentiel ont donc à chaque extrémité un joint articulé : le <strong>joint homocinétique</strong>. « Homocinétique » veut dire « à vitesse constante » : la roue tourne régulièrement, quel que soit l'angle du joint.</p>
<p>Ce joint contient des billes qui roulent dans des chemins graissés. Il est protégé par un <strong>soufflet</strong> en caoutchouc, en forme d'accordéon, rempli de graisse.</p>
<div class="note warn">Le soufflet vieillit, se craquelle, puis se fend. La graisse est projetée par la force centrifuge (tu verras des traces noires à l'intérieur de la jante), et la poussière et l'eau entrent. Le joint s'use alors en quelques milliers de kilomètres. Le symptôme : un <strong>claquement rythmé quand tu braques à fond en manœuvre</strong>, qui accélère avec la vitesse. Changer un soufflet coûte quelques dizaines d'euros de pièce ; un cardan complet, bien plus.</div>
<div class="note tip">Profite de chaque changement de roue ou de pneus pour regarder les soufflets de cardan avec une lampe, roues braquées. C'est un contrôle de 30 secondes qui évite une grosse réparation.</div>`,
