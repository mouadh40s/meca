<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier Méca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Atelier : gris acier froid, accent orange signalisation, schémas aux couleurs des fluides. Barre d'onglets en bas, contenu en colonne de lecture. */
:root{
  --bg:#eceff2; --surface:#ffffff; --surface-2:#f5f7f9; --ink:#141c24; --muted:#5a6774; --line:#d3d9df;
  --accent:#d9480f; --accent-ink:#ffffff; --steel:#1f5c99;
  --good:#1f8a4c; --warn:#c77700; --bad:#c62f2f;
  --metal:#d3d9df; --metal-2:#a9b3bd; --bore:#f1f3f5; --tyre:#2b3138; --ink-d:#3b4651;
  --c-hot:#d9443a; --c-cool:#2f7fd1; --c-oil:#c98a12; --c-fuel:#2e9b5a; --c-elec:#e3b505; --c-hv:#f07800; --c-air:#6aaee6; --c-exh:#7d8791; --c-brake:#9a6bd1;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'IBM Plex Sans',system-ui,-apple-system,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1418; --surface:#182027; --surface-2:#1e2730; --ink:#e4e9ee; --muted:#93a0ac; --line:#2a343e;
  --accent:#ff7034; --accent-ink:#1a0d05; --steel:#6fa8e6; --good:#43c07a; --warn:#f0a43a; --bad:#ff6b6b;
  --metal:#3b4650; --metal-2:#55616d; --bore:#222b33; --tyre:#0b0e11; --ink-d:#9aa7b3;
  --c-hot:#ff6a5c; --c-cool:#4b9ff0; --c-oil:#e0a530; --c-fuel:#45bf78; --c-elec:#f2c94c; --c-hv:#ff8c1a; --c-air:#86c1f0; --c-exh:#8a949e; --c-brake:#b48cf0;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1418; --surface:#182027; --surface-2:#1e2730; --ink:#e4e9ee; --muted:#93a0ac; --line:#2a343e;
  --accent:#ff7034; --accent-ink:#1a0d05; --steel:#6fa8e6; --good:#43c07a; --warn:#f0a43a; --bad:#ff6b6b;
  --metal:#3b4650; --metal-2:#55616d; --bore:#222b33; --tyre:#0b0e11; --ink-d:#9aa7b3;
  --c-hot:#ff6a5c; --c-cool:#4b9ff0; --c-oil:#e0a530; --c-fuel:#45bf78; --c-elec:#f2c94c; --c-hv:#ff8c1a; --c-air:#86c1f0; --c-exh:#8a949e; --c-brake:#b48cf0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:var(--steel)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;display:flex;align-items:center;gap:10px}
.top .back{border:0;background:var(--surface);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none;border:1px solid var(--line)}
.top .back[hidden]{display:none}
.top h1{font:700 22px/1 var(--display);letter-spacing:.02em;margin:0;text-transform:uppercase;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .xp{font:500 12px var(--mono);color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:4px 8px;border-radius:999px;white-space:nowrap}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font:600 11px var(--body);padding:6px 0;border-radius:10px}
.tabs a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs a.on{color:var(--accent)}
h2{font:700 30px/1.05 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:8px 0 4px;text-wrap:balance}
h3{font:700 21px/1.15 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:28px 0 8px;text-wrap:balance}
.eyebrow{font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.lead{color:var(--muted);margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:12px;align-items:center}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 16px;font-weight:600;cursor:pointer;text-decoration:none;background:var(--accent);color:var(--accent-ink);min-height:46px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.level{display:grid;gap:10px;background:var(--ink);color:var(--bg);border:0}
.level .lv{font:700 34px/1 var(--display);text-transform:uppercase}
.level .bar{background:color-mix(in srgb,var(--bg) 18%,transparent);border-color:transparent}
.level .muted{color:color-mix(in srgb,var(--bg) 70%,var(--ink))}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-decoration:none;color:inherit}
.tile b{display:block;font:700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted);line-height:1.3;display:block;margin-top:4px}
.next{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;border-left:4px solid var(--accent)}
.next .go{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.mod{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-decoration:none;color:inherit}
.mod .num{width:44px;height:44px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font:700 22px var(--display);font-variant-numeric:tabular-nums}
.mod.done .num{background:var(--good);color:#fff;border-color:transparent}
.mod h4{margin:0;font:600 16px/1.25 var(--body)}
.mod p{margin:2px 0 6px;font-size:13px;color:var(--muted);line-height:1.35}
.mod .pc{font:500 12px var(--mono);color:var(--muted)}
.lessons{display:grid;gap:0;margin-top:12px;border-top:1px solid var(--line)}
.lessons a{display:flex;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;font-size:15px}
.lessons a .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.lessons a.done .ck{background:var(--good);border-color:var(--good);color:#fff}
.lessons a .mn{margin-left:auto;font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.lessons a.quiz .ck{border-color:var(--accent);color:var(--accent);font:700 11px var(--mono)}
.prose p,.prose li,.prose dd{max-width:65ch}
.prose ul,.prose ol{padding-left:20px}
.prose li{margin:4px 0}
.prose strong{font-weight:600}
.defs{margin:0;display:grid;gap:10px}
.defs dt{font-weight:600;color:var(--ink)}
.defs dd{margin:0 0 4px;padding-left:12px;border-left:3px solid var(--line);color:var(--ink)}
.steps{counter-reset:s;list-style:none;padding:0!important;display:grid;gap:8px}
.steps li{counter-increment:s;position:relative;padding:10px 12px 10px 46px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:0!important}
.steps li::before{content:counter(s);position:absolute;left:10px;top:9px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 15px var(--display)}
.note{border-radius:10px;padding:12px 14px;margin:16px 0;border:1px solid;font-size:15px}
.note.tip{background:color-mix(in srgb,var(--steel) 9%,var(--surface));border-color:color-mix(in srgb,var(--steel) 35%,transparent)}
.note.warn{background:color-mix(in srgb,var(--warn) 11%,var(--surface));border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.note.danger{background:color-mix(in srgb,var(--bad) 10%,var(--surface));border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.formula{font:500 14px/1.7 var(--mono);background:var(--surface);border:1px dashed var(--metal-2);padding:10px 12px;border-radius:8px;overflow-x:auto}
.tblw{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tbl{border-collapse:collapse;width:100%;font-size:14px;line-height:1.45}
.tbl th,.tbl td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font:700 13px var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2)}
.tbl tr:last-child td{border-bottom:0}
.keys{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:16px;margin-top:24px}
.keys h3{margin:0 0 8px;color:var(--bg)}
.keys ul{margin:0;padding-left:18px}
.keys li{margin:4px 0}
.pill{display:inline-block;font:600 12px var(--body);padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.r{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.o{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.g{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.fuses{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.fuses span{background:var(--f);color:#111;font:600 13px var(--mono);padding:6px 10px;border-radius:6px;border:1px solid rgba(0,0,0,.2)}
.lights{display:grid;gap:8px;margin:10px 0}
.light{display:flex;gap:10px;align-items:baseline;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);border-left:6px solid}
.light.r{border-left-color:var(--bad)}.light.o{border-left-color:var(--warn)}.light.g{border-left-color:var(--good)}
.light b{min-width:84px}
.smoke{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--s);border:1px solid var(--line);margin-right:8px;vertical-align:-2px}
/* Schémas */
.dg{margin:16px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dg-head{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font:700 15px var(--display);text-transform:uppercase;letter-spacing:.04em}
.dg-head span{font:500 11px var(--mono);color:var(--muted);text-transform:none;letter-spacing:0}
.dg-svg{padding:12px;background:var(--bore);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:20px 20px;background-position:-1px -1px}
.dg-svg svg{display:block;width:100%;height:auto;max-height:420px}
.dg-info{padding:12px 14px;min-height:72px;border-top:1px solid var(--line)}
.dg-info b{display:block;font-weight:600}
.dg-info span{font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 14px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:5px 10px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dg svg [data-p]{cursor:pointer;transition:opacity .2s}
.dg svg.sel [data-p]:not(.on){opacity:.35}
.dg svg [data-p].on,.dg svg [data-p].on *{stroke:var(--accent)!important;stroke-width:3}
.t{font:600 11px var(--body);fill:var(--muted);pointer-events:none}
.tc{text-anchor:middle;font-size:14px;fill:var(--ink)}
.f-m{fill:var(--metal);stroke:var(--ink-d);stroke-width:1.4}
.f-m2{fill:var(--metal-2);stroke:var(--ink-d);stroke-width:1.4}
.f-bore{fill:var(--bore);stroke:none}
.f-body{fill:var(--surface);stroke:var(--ink-d);stroke-width:2}
.f-glass{fill:color-mix(in srgb,var(--c-air) 22%,transparent);stroke:var(--ink-d);stroke-width:1.2}
.f-tyre{fill:var(--tyre);stroke:var(--ink-d);stroke-width:1.2}
.f-disc{fill:var(--metal-2);stroke:var(--ink-d);stroke-width:1.4}
.f-cool{fill:color-mix(in srgb,var(--c-cool) 55%,var(--surface));stroke:var(--ink-d);stroke-width:1.4}
.f-hot{fill:var(--c-hot);stroke:var(--ink-d);stroke-width:1.2}
.f-oil{fill:color-mix(in srgb,var(--c-oil) 75%,var(--surface));stroke:var(--ink-d);stroke-width:1.2}
.f-fuel{fill:color-mix(in srgb,var(--c-fuel) 65%,var(--surface));stroke:var(--ink-d);stroke-width:1.2}
.f-elec{fill:color-mix(in srgb,var(--c-elec) 70%,var(--surface));stroke:var(--ink-d);stroke-width:1.4}
.f-hv{fill:color-mix(in srgb,var(--c-hv) 70%,var(--surface));stroke:var(--ink-d);stroke-width:1.4}
.f-air{fill:color-mix(in srgb,var(--c-air) 60%,var(--surface));stroke:var(--ink-d);stroke-width:1.4}
.f-piston{fill:var(--metal);stroke:var(--ink-d);stroke-width:1.6}
.f-shaft{fill:var(--metal-2);stroke:var(--ink-d);stroke-width:1}
.f-lining{fill:#8b5a3c;stroke:var(--ink-d);stroke-width:.8}
.f-gear{fill:var(--metal);stroke:var(--ink-d);stroke-width:1.4;stroke-dasharray:3 2}
.f-caliper{fill:color-mix(in srgb,var(--c-hot) 70%,var(--metal));stroke:var(--ink-d);stroke-width:1.4}
.f-brakefluid{fill:color-mix(in srgb,var(--c-brake) 45%,var(--surface));stroke:var(--ink-d);stroke-width:1.4}
.f-cata{fill:color-mix(in srgb,var(--c-oil) 35%,var(--metal));stroke:var(--ink-d);stroke-width:1.4}
.f-fap{fill:color-mix(in srgb,var(--ink-d) 45%,var(--metal));stroke:var(--ink-d);stroke-width:1.4}
.f-inj{fill:var(--metal);stroke:var(--c-fuel);stroke-width:2}
.f-sensor{fill:color-mix(in srgb,var(--c-cool) 18%,var(--surface));stroke:var(--c-cool);stroke-width:1.4}
.f-act{fill:color-mix(in srgb,var(--accent) 14%,var(--surface));stroke:var(--accent);stroke-width:1.4}
.s-ln{fill:none;stroke:var(--ink-d);stroke-width:2;stroke-linecap:round}
.s-ground{stroke:var(--ink-d);stroke-width:2;stroke-dasharray:6 4}
.s-outline{fill:none;stroke:var(--ink-d);stroke-width:1.6;stroke-dasharray:5 4}
.s-dash{stroke-dasharray:6 5}
.s-hot{fill:none;stroke:var(--c-hot);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.s-cool{fill:none;stroke:var(--c-cool);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.s-oil{fill:none;stroke:var(--c-oil);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.s-fuel{fill:none;stroke:var(--c-fuel);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.s-fuelhp{fill:none;stroke:var(--c-fuel);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.s-air{fill:none;stroke:var(--c-air);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.s-exh{fill:none;stroke:var(--c-exh);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.s-exhflow{fill:none;stroke:var(--c-exh);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.s-elec{fill:none;stroke:var(--c-hot);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.s-hv{fill:none;stroke:var(--c-hv);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.s-brake{fill:none;stroke:var(--c-brake);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.s-sig{fill:none;stroke:var(--metal-2);stroke-width:1.5}
.s-can{fill:none;stroke:var(--steel);stroke-width:4;stroke-linecap:round}
.s-belt{fill:none;stroke:var(--ink);stroke-width:7;stroke-linejoin:round;stroke-dasharray:3 1.5}
.s-spring{fill:none;stroke:var(--c-cool);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.s-valve{fill:none;stroke:var(--ink-d);stroke-width:4;stroke-linecap:round}
.s-ring{fill:none;stroke:var(--ink-d);stroke-width:2}
.s-fin{fill:none;stroke:var(--ink-d);stroke-width:1;opacity:.6}
.s-fuse{fill:none;stroke:var(--c-hot);stroke-width:5}
.s-diaph{fill:none;stroke:var(--ink-d);stroke-width:5;stroke-linecap:round}
.s-fork{fill:none;stroke:var(--ink-d);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.s-bar{fill:none;stroke:var(--metal-2);stroke-width:9;stroke-linecap:round}
.s-pad{fill:none;stroke:#8b5a3c;stroke-width:9;stroke-linecap:round}
.s-hose{fill:none;stroke:var(--tyre);stroke-width:6;stroke-linecap:round}
.s-teeth{fill:none;stroke:var(--ink-d);stroke-width:4;stroke-dasharray:2 4}
.s-axis{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.mk-hot{fill:var(--c-hot)}.mk-cool{fill:var(--c-cool)}.mk-oil{fill:var(--c-oil)}.mk-air{fill:var(--c-air)}.mk-exh{fill:var(--c-exh)}.mk-ln{fill:var(--ink-d)}
/* 4 temps */
.fs-ctrl{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 14px}
.fs-ctrl button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer}
.fs-ctrl button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fs-ctrl .play{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fs-deg{font:500 12px var(--mono);color:var(--muted)}
/* Widgets */
.wd{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:14px 0;display:grid;gap:12px}
.wd-t{font:700 15px var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.inp{width:100%;font:500 16px var(--mono);padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.out{font:700 30px/1.1 var(--display);font-variant-numeric:tabular-nums}
.out small{font:500 13px var(--body);color:var(--muted);display:block;margin-top:2px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 12px;font:600 15px var(--mono);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tyre-code{display:flex;flex-wrap:wrap;gap:4px;font:600 26px var(--mono);background:var(--tyre);color:#e8e8e8;padding:14px;border-radius:10px;justify-content:center}
.tyre-code button{background:transparent;border:1px dashed transparent;color:inherit;font:inherit;padding:2px 4px;border-radius:6px;cursor:pointer}
.tyre-code button.on{border-color:var(--accent);color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.checks label:last-child{border-bottom:0}
.checks input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:2px}
/* Quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;font:500 13px var(--mono);color:var(--muted)}
.qq{font:600 19px/1.35 var(--body);margin:6px 0 4px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;cursor:pointer;font-size:16px;line-height:1.35;display:flex;gap:10px;align-items:flex-start}
.opt .lt{font:700 14px var(--mono);color:var(--muted);flex:none;width:18px}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.ko{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.opt:disabled{cursor:default;color:var(--ink)}
.expl{border-radius:10px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line);font-size:15px}
.expl b{display:block;margin-bottom:2px}
.score{font:700 72px/1 var(--display);font-variant-numeric:tabular-nums}
/* Flashcards */
.fc-wrap{perspective:1200px}
.fc{position:relative;min-height:260px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s}
.fc.flip{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:22px;display:flex;flex-direction:column;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--surface)}
.fc-face.back{transform:rotateY(180deg);background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fc-face .tag{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.fc-face p{font:600 22px/1.3 var(--body);margin:0;text-wrap:balance}
.fc-face.back p{font-weight:500;font-size:19px}
.fc-face .hint{font-size:12px;color:var(--muted);margin-top:auto}
.fc-face.back .hint{color:color-mix(in srgb,var(--bg) 60%,var(--ink))}
.fc-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.no{background:var(--surface);color:var(--bad);border:1.5px solid var(--bad)}
.btn.yes{background:var(--good);color:#fff}
.boxes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;text-align:center}
.boxes div{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 2px}
.boxes b{display:block;font:700 22px var(--display);font-variant-numeric:tabular-nums}
.boxes span{font-size:10px;color:var(--muted)}
.deck{display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;width:100%;text-align:left}
.deck .n{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.deck .due{background:var(--accent);color:var(--accent-ink);font:600 12px var(--mono);padding:2px 8px;border-radius:99px}
/* Outils */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:inherit;display:grid;gap:6px;align-content:start}
.tool svg{width:28px;height:28px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool b{font:700 18px/1.1 var(--display);text-transform:uppercase}
.tool span{font-size:13px;color:var(--muted);line-height:1.35}
.symp{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);overflow:hidden}
.symp summary{list-style:none;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.symp summary::-webkit-details-marker{display:none}
.symp summary .sv{width:10px;height:10px;border-radius:50%;flex:none;margin-top:7px}
.sv.r{background:var(--bad)}.sv.o{background:var(--warn)}.sv.g{background:var(--good)}
.symp .body{padding:0 14px 14px;display:grid;gap:8px}
.cause{border-left:3px solid var(--metal-2);padding:2px 0 2px 10px}
.cause b{display:block;font-weight:600;font-size:15px}
.cause span{font-size:14px;color:var(--muted)}
.gl{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.gl div{padding:10px 14px;border-bottom:1px solid var(--line)}
.gl div:last-child{border-bottom:0}
.gl b{font-weight:600}
.gl p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.gl a{font-size:12px}
.prac{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line)}
.prac:last-child{border-bottom:0}
.prac input{width:22px;height:22px;accent-color:var(--good);flex:none;margin-top:2px}
.diff{display:inline-flex;gap:2px;vertical-align:middle}
.diff i{width:8px;height:8px;border-radius:2px;background:var(--line)}
.diff i.f{background:var(--accent)}
.lnav{display:grid;gap:10px;margin-top:24px}
.empty{text-align:center;padding:28px 16px}
.goals{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--steel);border-radius:10px;padding:12px 14px;margin:12px 0 18px}
.goals b{font:700 14px var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--steel)}
.goals ul{margin:6px 0 0;padding-left:18px}.goals li{margin:3px 0;font-size:15px}
.note.ex,.note.ana,.note.why{position:relative;padding-top:30px}
.note.ex::before,.note.ana::before,.note.why::before{position:absolute;top:9px;left:14px;font:700 12px var(--display);text-transform:uppercase;letter-spacing:.07em}
.note.ex{background:color-mix(in srgb,var(--good) 9%,var(--surface));border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.note.ex::before{content:"Exemple concret";color:var(--good)}
.note.ana{background:color-mix(in srgb,var(--c-brake) 10%,var(--surface));border-color:color-mix(in srgb,var(--c-brake) 38%,transparent)}
.note.ana::before{content:"Pour imaginer";color:var(--c-brake)}
.note.why{background:color-mix(in srgb,var(--accent) 8%,var(--surface));border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.note.why::before{content:"Pourquoi ?";color:var(--accent)}
.cpviz{display:grid;gap:8px}.cpviz span{font-size:12px;color:var(--muted)}
.cpbar{height:22px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.cpbar i{display:block;height:100%;background:color-mix(in srgb,var(--c-air) 70%,var(--surface));transition:width .3s}
.fo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fo{border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;display:grid;gap:2px;font-size:12px;background:var(--surface-2)}
.fo b{font:700 15px var(--display)}.fo .arr{font-size:20px;line-height:1}
.fo.air{background:color-mix(in srgb,var(--c-air) 22%,var(--surface))}
.fo.comp{background:color-mix(in srgb,var(--c-air) 45%,var(--surface))}
.fo.pow{background:color-mix(in srgb,var(--c-hot) 30%,var(--surface))}
.fo.exh{background:color-mix(in srgb,var(--c-exh) 25%,var(--surface))}
.fo.on{outline:3px solid var(--c-hot);outline-offset:-1px}
.prose h3+p,.prose p{margin:10px 0}
@media (min-width:640px){h2{font-size:38px}.tools{grid-template-columns:repeat(3,1fr)}}

<script>
const MODULES = [];

MODULES.push({
  id: 'bases', title: 'Découvrir la voiture', sub: 'Les grands systèmes, la sécurité, les outils',
  lessons: [
    { id: 'systemes', title: 'Les grands systèmes d\'une voiture', min: 10,
      goals: ['Savoir nommer les 6 grandes familles de pièces d\'une voiture', 'Comprendre comment elles s\'enchaînent, du carburant jusqu\'aux roues', 'Maîtriser le vocabulaire de base : avant/arrière, traction/propulsion, transversal/longitudinal'],
      body: `
<p>Quand on ouvre un capot pour la première fois, on voit un enchevêtrement de tuyaux, de câbles et de blocs de métal. Ça paraît impossible à comprendre. En réalité, une voiture n'est qu'une <strong>chaîne de systèmes</strong> qui se passent le relais. Si tu comprends cette chaîne, chaque pièce trouve naturellement sa place.</p>
<div class="note ana">Pense à un corps humain. Le cœur et les poumons (le <strong>moteur</strong>) produisent l'énergie. Les muscles et les tendons (la <strong>transmission</strong>) la transmettent. Les jambes et les pieds (les <strong>liaisons au sol</strong>) touchent le sol. Le cerveau et les nerfs (l'<strong>électronique</strong>) coordonnent tout. Le squelette et la peau (la <strong>caisse</strong>) tiennent l'ensemble.</div>
<p>Touche chaque élément du schéma pour voir où il se trouve :</p>
<div data-d="carOverview"></div>
<h3>La chaîne de l'énergie, étape par étape</h3>
<p>Suivons le trajet de l'énergie quand tu appuies sur l'accélérateur :</p>
<ol class="steps">
<li><strong>Le réservoir</strong> envoie le carburant vers le moteur.</li>
<li><strong>Le moteur</strong> brûle ce carburant mélangé à de l'air. La combustion fait tourner un arbre, le vilebrequin. À ce stade, l'énergie chimique du carburant est devenue une <em>rotation</em>.</li>
<li><strong>L'embrayage et la boîte de vitesses</strong> récupèrent cette rotation et l'adaptent : beaucoup de force pour démarrer, beaucoup de vitesse sur autoroute.</li>
<li><strong>Le différentiel et les cardans</strong> amènent la rotation jusqu'aux roues motrices.</li>
<li><strong>Les pneus</strong> transforment la rotation en déplacement grâce à leur adhérence sur la route.</li>
</ol>
<p>Et pendant tout ce temps, d'autres systèmes travaillent en parallèle : la <strong>direction</strong> oriente les roues, la <strong>suspension</strong> absorbe les bosses, les <strong>freins</strong> font le chemin inverse (ils transforment le mouvement en chaleur pour ralentir), et l'<strong>électronique</strong> surveille et pilote tout.</p>
<h3>Les 6 familles à connaître</h3>
<dl class="defs">
<dt>1. Le moteur</dt><dd>La source d'énergie. Il transforme l'énergie du carburant (ou de la batterie sur une électrique) en rotation. C'est le module 2 et 3 de ce parcours.</dd>
<dt>2. La transmission</dt><dd>Embrayage, boîte de vitesses, différentiel, cardans. Elle amène la rotation du moteur jusqu'aux roues en l'adaptant à la situation. Module 6.</dd>
<dt>3. Les liaisons au sol</dt><dd>Suspension, direction, roues et pneus. Tout ce qui garde la voiture en contact avec la route et permet de la diriger. Module 8.</dd>
<dt>4. Le freinage</dt><dd>Il ralentit la voiture en transformant son mouvement en chaleur par frottement. Module 7.</dd>
<dt>5. L'électricité et l'électronique</dt><dd>Batterie, alternateur, démarreur, calculateurs, capteurs. Sur une voiture récente, même l'accélérateur n'est plus relié mécaniquement au moteur : c'est un capteur qui informe un ordinateur. Modules 4 et 9.</dd>
<dt>6. La caisse</dt><dd>La structure et l'habitacle. Sur presque toutes les voitures modernes, la carrosserie et le châssis ne forment qu'une seule pièce soudée : on parle de <strong>caisse monocoque</strong>. Les 4x4 et les utilitaires lourds gardent parfois un châssis séparé, en forme d'échelle, sur lequel on boulonne la carrosserie.</dd>
</dl>
<h3>Le vocabulaire de base</h3>
<p><strong>Gauche et droite se lisent toujours assis au volant</strong>, en regardant vers l'avant. Ce n'est pas un détail : quand tu commandes un phare « avant gauche », c'est celui côté conducteur en France, même si, debout devant la voiture, il est à ta droite. Beaucoup de débutants commandent la mauvaise pièce à cause de ça.</p>
<p>On utilise souvent des abréviations : <strong>AVG</strong> (avant gauche), <strong>AVD</strong> (avant droit), <strong>ARG</strong>, <strong>ARD</strong>.</p>
<table class="tbl"><thead><tr><th>Terme</th><th>Signification</th><th>Exemples</th></tr></thead><tbody>
<tr><td>Traction</td><td>Les roues <strong>avant</strong> sont motrices : elles tirent la voiture.</td><td>Clio, 208, Golf : l'immense majorité des voitures courantes</td></tr>
<tr><td>Propulsion</td><td>Les roues <strong>arrière</strong> sont motrices : elles poussent la voiture.</td><td>BMW Série 3, Mercedes Classe C, Mazda MX-5</td></tr>
<tr><td>4x4 / intégrale</td><td>Les <strong>quatre</strong> roues sont motrices.</td><td>Dacia Duster 4x4, Audi quattro, Subaru</td></tr>
</tbody></table>
<p>Le moteur peut être posé de deux façons :</p>
<ul>
<li><strong>Transversal</strong> : en travers, perpendiculaire à la route. C'est compact, idéal pour une traction. Ouvre le capot d'une Clio : la courroie est sur le côté, près d'une roue avant.</li>
<li><strong>Longitudinal</strong> : dans l'axe de la voiture, courroie vers la calandre. Typique des propulsions.</li>
</ul>
<div class="note ex">Tu ouvres le capot et tu vois les poulies et la courroie du moteur sur le côté droit, près de l'aile ? Moteur transversal, donc très probablement une traction. Tu les vois face à toi, juste derrière la calandre ? Moteur longitudinal, souvent une propulsion ou un 4x4.</div>`,
      keys: ['6 systèmes : moteur, transmission, liaisons au sol, freinage, électricité, caisse', 'L\'énergie va : carburant → moteur → boîte → différentiel → roues', 'Gauche/droite se lisent assis au volant (AVG = côté conducteur)', 'Traction = roues avant motrices, propulsion = arrière'] },

    { id: 'securite', title: 'La sécurité à l\'atelier', min: 9,
      goals: ['Connaître les 3 grands dangers de la mécanique amateur', 'Savoir lever une voiture sans risque', 'Appliquer les bons réflexes avec la batterie, les liquides et la haute tension'],
      body: `
<p>Avant de toucher une clé, il faut connaître les règles qui évitent les accidents graves. Ce n'est pas pour te faire peur : la mécanique est une activité sûre <em>si</em> on respecte quelques règles simples. Les accidents viennent presque toujours de trois choses : <strong>une voiture qui tombe</strong>, <strong>un liquide ou une pièce brûlante</strong>, et <strong>l'électricité</strong>.</p>
<h3>Danger n°1 : la voiture qui tombe</h3>
<p>Une voiture pèse entre 1 000 et 2 000 kg. Si elle tombe sur toi, il n'y a pas de seconde chance.</p>
<div class="note danger"><strong>Règle absolue :</strong> on ne met jamais une partie de son corps sous une voiture tenue uniquement par un cric. Le cric sert à <strong>lever</strong>. Les <strong>chandelles</strong> servent à <strong>tenir</strong>.</div>
<p>Pourquoi ? Un cric, surtout le cric losange fourni avec la voiture, repose sur un petit appui et un mécanisme qui peut glisser, se replier ou fuir (pour un cric hydraulique). Une chandelle, elle, est un trépied en acier avec un cran de blocage : elle ne peut pas descendre toute seule.</p>
<ol class="steps">
<li>Sol dur et plat : jamais sur l'herbe, le gravier ou une pente.</li>
<li>Frein à main serré, une vitesse engagée (ou P en automatique).</li>
<li>Cales derrière les roues qui restent au sol.</li>
<li>Lever avec le cric au <strong>point de levage</strong> prévu (indiqué dans le manuel, souvent une encoche ou un renfort sous le bas de caisse).</li>
<li>Glisser la chandelle sous un point solide, régler sa hauteur, puis redescendre doucement le cric jusqu'à ce que la voiture repose sur la chandelle.</li>
<li>Secouer légèrement la voiture : elle ne doit pas bouger. Seulement maintenant, tu peux aller dessous.</li>
</ol>
<div class="note tip">Astuce de pro : laisse la roue que tu as démontée posée à plat sous le bas de caisse. Si tout lâche, la voiture tombe sur la roue et pas sur toi.</div>
<h3>Danger n°2 : la chaleur et les liquides</h3>
<ul>
<li><strong>Le circuit de refroidissement est sous pression.</strong> Le liquide est à environ 90 °C, et la pression l'empêche de bouillir. Si tu ouvres le bouchon du vase d'expansion moteur chaud, la pression chute d'un coup, le liquide se met à bouillir instantanément et jaillit. Brûlure garantie au visage. Attends que le moteur soit froid (au moins une heure).</li>
<li><strong>L'échappement et le collecteur</strong> peuvent dépasser 500 °C après un trajet. Un frôlement suffit à brûler.</li>
<li><strong>Le motoventilateur</strong> (le ventilateur derrière le radiateur) peut démarrer tout seul moteur coupé, pour finir de refroidir. Garde les doigts, les cheveux longs et les manches amples à distance.</li>
<li><strong>L'huile usagée</strong> contient des substances cancérigènes : gants nitrile obligatoires.</li>
<li><strong>Le liquide de frein</strong> est irritant pour les yeux et décape la peinture. Lunettes, et rinçage immédiat à l'eau en cas d'éclaboussure.</li>
</ul>
<h3>Danger n°3 : l'électricité</h3>
<p>La batterie d'une voiture est en 12 volts : ça ne t'électrocutera pas si tu touches les bornes. Le vrai danger, c'est le <strong>court-circuit</strong>. Une batterie peut débiter plusieurs centaines d'ampères : si une clé métallique relie la borne + à la carrosserie, elle devient rouge en une seconde, peut souder, brûler la main ou faire exploser la batterie.</p>
<div class="note why">La carrosserie est reliée à la borne <strong>négative (–)</strong>. Si tu débranches d'abord le –, la batterie n'est plus reliée à la voiture. Ensuite, même si ta clé touche la carrosserie en travaillant sur le +, il ne se passe rien. Si tu fais l'inverse (+ d'abord), ta clé est sur le + pendant que la carrosserie est toujours reliée au – : un contact et c'est le court-circuit.</div>
<p>Donc : <strong>débranchement : – puis +. Rebranchement : + puis –.</strong></p>
<ul>
<li><strong>Airbags</strong> : après avoir débranché la batterie, attends quelques minutes avant de toucher un airbag ou un connecteur jaune. Un condensateur garde de l'énergie pour les déclencher.</li>
<li><strong>Hybrides et électriques</strong> : les câbles <strong>orange</strong> transportent plusieurs centaines de volts. Là, le contact peut tuer. On n'y touche jamais sans formation.</li>
</ul>
<h3>Les déchets</h3>
<p>Huile, liquide de refroidissement, liquide de frein, filtres, batteries : tout va en <strong>déchetterie</strong> ou chez un garage qui les récupère. Un litre d'huile peut polluer un million de litres d'eau.</p>`,
      keys: ['Cric pour lever, chandelles pour tenir', 'Batterie : – en premier au débranchement, en dernier au rebranchement', 'Jamais ouvrir le vase d\'expansion moteur chaud', 'Câbles orange = haute tension, ne pas toucher'] },

    { id: 'outils', title: 'La caisse à outils du débutant', min: 10,
      goals: ['Savoir quels outils acheter en premier', 'Comprendre les tailles (mm, 1/4", 3/8", 1/2")', 'Comprendre ce qu\'est un couple de serrage et pourquoi il compte'],
      body: `
<p>Pas besoin d'un atelier complet pour commencer. Avec un budget de 150 à 300 €, tu peux t'équiper pour faire 90 % de l'entretien courant. Voici l'essentiel, avec ce que veulent dire toutes les tailles qu'on te proposera en magasin.</p>
<h3>Les douilles et le cliquet</h3>
<p>C'est l'outil n°1. Une <strong>douille</strong> est un petit tube qui s'emboîte sur la tête d'une vis ou d'un écrou. On la monte sur un <strong>cliquet</strong>, une poignée avec un mécanisme qui tourne dans un sens et « cliquette » dans l'autre : tu peux serrer ou desserrer sans retirer l'outil à chaque mouvement.</p>
<p>Deux tailles différentes existent, et c'est là que les débutants se perdent :</p>
<ul>
<li><strong>La taille de la douille</strong>, en millimètres : c'est la taille de l'écrou qu'elle attrape. Une douille de 13 mm attrape un écrou dont les côtés opposés sont espacés de 13 mm.</li>
<li><strong>Le carré d'entraînement</strong>, en pouces : c'est la taille du trou carré à l'arrière de la douille, où s'emboîte le cliquet. Il en existe trois courants.</li>
</ul>
<table class="tbl"><thead><tr><th>Carré</th><th>Taille réelle</th><th>Usage</th></tr></thead><tbody>
<tr><td>1/4"</td><td>6,35 mm</td><td>Petites vis (5 à 13 mm), espaces étroits, serrages légers</td></tr>
<tr><td>3/8"</td><td>9,5 mm</td><td>L'usage général : la majorité du travail moteur</td></tr>
<tr><td>1/2"</td><td>12,7 mm</td><td>Gros serrages : roues, étriers de frein, suspension</td></tr>
</tbody></table>
<p>Le symbole <strong>"</strong> veut dire « pouce » (1 pouce = 2,54 cm). Le système en pouces vient des États-Unis et s'est imposé pour les outils, même si les vis des voitures européennes et japonaises sont en millimètres.</p>
<div class="note ex">Un coffret « 1/4" + 1/2" de 4 à 32 mm, 94 pièces » contient deux cliquets (un petit, un gros) et des douilles allant de 4 à 32 mm. C'est un très bon premier achat.</div>
<p>Les tailles d'écrous qu'on rencontre le plus sur une voiture : <strong>8, 10, 13, 15, 16, 17, 18 et 19 mm</strong>. Le 10 mm est partout (et c'est toujours celui qu'on perd). Les écrous de roue font souvent 17 ou 19 mm.</p>
<h3>Les autres outils</h3>
<table class="tbl"><thead><tr><th>Outil</th><th>À quoi il sert</th></tr></thead><tbody>
<tr><td>Clés mixtes</td><td>Une extrémité plate (ouverte), une extrémité à œil (fermée). Pour les endroits où la douille ne passe pas, ou pour tenir un écrou pendant qu'on tourne la vis.</td></tr>
<tr><td>Embouts Torx et six-pans (Allen)</td><td>Torx = empreinte en étoile à 6 branches (T20, T30, T45…). Six-pans = hexagone creux. Très utilisés sur les voitures récentes.</td></tr>
<tr><td>Clé dynamométrique</td><td>Serre à une valeur précise. On en parle juste en dessous.</td></tr>
<tr><td>Cric rouleur + 2 chandelles</td><td>Lever et tenir la voiture. Prends un cric d'au moins 2 tonnes et des chandelles de 3 tonnes.</td></tr>
<tr><td>Multimètre</td><td>Mesurer une tension (volts), une résistance (ohms), la continuité d'un fil. Un modèle à 20 € suffit au début.</td></tr>
<tr><td>Valise OBD2</td><td>Se branche sur la prise de diagnostic et lit les codes défaut du calculateur. Un modèle Bluetooth à 20–40 € avec une appli sur téléphone suffit pour débuter.</td></tr>
<tr><td>Bac de vidange, clé à filtre, entonnoir</td><td>Pour la vidange.</td></tr>
<tr><td>Lampe frontale, gants nitrile, lunettes</td><td>On voit mal sous un capot, et on se salit vite.</td></tr>
</tbody></table>
<h3>Le couple de serrage : la notion clé</h3>
<p>Chaque vis d'une voiture doit être serrée avec une force précise, donnée par le constructeur : c'est le <strong>couple de serrage</strong>. Il s'exprime en <strong>newtons-mètres (N·m)</strong>.</p>
<p>Décortiquons cette unité :</p>
<ul>
<li>Le <strong>newton (N)</strong> est une unité de force. Pour te représenter : 1 newton, c'est à peu près le poids d'un objet de 100 grammes (une tablette de chocolat). 10 newtons ≈ le poids de 1 kg.</li>
<li>Le <strong>mètre (m)</strong>, ici, c'est la longueur du bras de levier : la distance entre l'écrou et l'endroit où tu appuies sur la clé.</li>
<li>Le couple, c'est <strong>force × longueur du levier</strong>.</li>
</ul>
<div class="note ex">Le constructeur demande de serrer tes roues à 110 N·m. Avec une clé de 50 cm (0,5 m), il faut appuyer avec une force de 110 ÷ 0,5 = 220 newtons, soit l'équivalent de 22 kg posés au bout de la clé. Avec une clé de 25 cm, il faudrait le double : 44 kg. C'est pour ça qu'une clé longue rend le serrage plus facile.</div>
<p><strong>Pourquoi c'est si important ?</strong> Une vis serrée fonctionne comme un ressort très raide : elle s'étire de quelques centièmes de millimètre et c'est cette tension qui maintient les pièces.</p>
<ul>
<li><strong>Pas assez serré</strong> : la vis se desserre avec les vibrations. Pour une roue, ça peut finir par la perte de la roue.</li>
<li><strong>Trop serré</strong> : la vis s'étire au-delà de sa limite et casse, ou arrache le filetage. Le bouchon de vidange vissé dans un carter en aluminium est la victime classique : un filetage arraché, et c'est le carter à changer.</li>
</ul>
<p>Pour te donner des ordres de grandeur : une petite vis de cache plastique, 5 à 10 N·m. Un bouchon de vidange, 20 à 40 N·m. Une roue de voiture courante, 90 à 140 N·m. Une vis de moyeu, plus de 200 N·m. La bonne valeur est toujours celle du constructeur.</p>
<div class="note tip">Une clé dynamométrique ne sert qu'à <strong>serrer</strong>. Ne l'utilise jamais pour desserrer, et range-la réglée sur sa valeur la plus basse pour que son ressort ne se fatigue pas.</div>`,
      keys: ['Douille en mm = taille de l\'écrou ; carré en pouces = taille du cliquet', 'Couple de serrage = force × longueur du levier, en N·m', '1 N ≈ poids de 100 g ; 110 N·m = 22 kg au bout d\'une clé de 50 cm', 'Trop serré casse, pas assez se desserre'] },

<div class="note tip">Les sites de pièces en ligne proposent presque tous une recherche par plaque d'immatriculation. C'est pratique, mais vérifie toujours que la version proposée correspond à ta carte grise (cylindrée et puissance).</div>`,

  id: 'moteur', title: 'Le moteur thermique', sub: 'Cycle 4 temps, pièces, distribution, puissance',

    { id: '4temps', title: 'Le cycle à 4 temps', min: 18,
      goals: ['Comprendre comment une explosion devient une rotation', 'Connaître les 4 temps et ce qui se passe dans chacun', 'Comprendre ce qu\'est un taux de compression (10:1, 16:1…)', 'Comprendre l\'ordre d\'allumage 1-3-4-2', 'Savoir ce qui distingue vraiment un essence d\'un diesel'],
      body: `
<h3>L'idée de départ</h3>
<p>Quand on brûle un mélange d'air et de carburant dans un espace fermé, il se produit une <strong>explosion</strong> (on dit plutôt « combustion » car elle est très rapide mais contrôlée). Les gaz chauffent brutalement, se dilatent, et poussent sur tout ce qui les entoure. Le moteur thermique récupère cette poussée.</p>
<div class="note ana">Imagine une seringue bouchée. Tu enfonces le piston : l'air à l'intérieur est comprimé. Maintenant, imagine que cet air comprimé explose : le piston de la seringue est violemment repoussé. Un moteur, c'est ça, répété des milliers de fois par minute.</div>
<p>Dans le moteur, l'espace fermé s'appelle le <strong>cylindre</strong> : un tube parfaitement rond. Dedans coulisse un <strong>piston</strong>. L'explosion pousse le piston vers le bas. Mais on ne veut pas un mouvement de haut en bas, on veut faire tourner des roues. C'est là qu'interviennent la <strong>bielle</strong> et le <strong>vilebrequin</strong>.</p>
<div class="note ana">Pense à un cycliste. Sa cuisse monte et descend (c'est le piston). Son tibia relie le genou à la pédale (c'est la bielle). La pédale fait tourner le pédalier (c'est le vilebrequin). Un mouvement de haut en bas devient une rotation. Le moteur fait exactement pareil.</div>
<h3>Deux mots à connaître : PMH et PMB</h3>
<p>Le piston fait des allers-retours entre deux positions extrêmes :</p>
<ul>
<li>le <strong>point mort haut (PMH)</strong> : le piston est tout en haut ;</li>
<li>le <strong>point mort bas (PMB)</strong> : le piston est tout en bas.</li>
</ul>
<p>On dit « mort » parce qu'à ces deux instants, le piston s'arrête une fraction de seconde avant de repartir dans l'autre sens. La distance entre PMH et PMB s'appelle la <strong>course</strong>.</p>
<h3>Les 4 temps</h3>
<p>Pour qu'une explosion ait lieu, il faut d'abord faire entrer de l'air, le comprimer, l'enflammer, puis évacuer les gaz brûlés. Ces quatre étapes sont les <strong>quatre temps</strong>. Le cylindre a deux « portes » en haut : la <strong>soupape d'admission</strong> (qui laisse entrer l'air) et la <strong>soupape d'échappement</strong> (qui laisse sortir les gaz).</p>
<p>Lance l'animation, puis clique sur chaque temps pour l'observer à l'arrêt. Regarde bien les soupapes et la couleur du gaz :</p>
<div data-d="fourStroke"></div>
<ol class="steps">
<li><strong>Admission</strong> (piston du PMH vers le PMB) : la soupape d'admission est ouverte. En descendant, le piston crée un vide qui aspire l'air, comme une seringue qu'on tire. Sur certains moteurs essence, le carburant est déjà mélangé à cet air.</li>
<li><strong>Compression</strong> (du PMB vers le PMH) : les deux soupapes se ferment. Le piston remonte et écrase l'air dans un tout petit volume en haut du cylindre. En étant comprimé, l'air chauffe (comme une pompe à vélo qui chauffe quand tu gonfles un pneu).</li>
<li><strong>Combustion – détente</strong> (du PMH vers le PMB) : le mélange s'enflamme juste avant le PMH. La pression grimpe énormément (plusieurs dizaines de fois la pression atmosphérique) et chasse le piston vers le bas avec force. C'est le <strong>seul</strong> des quatre temps qui produit de l'énergie : on l'appelle le « temps moteur ».</li>
<li><strong>Échappement</strong> (du PMB vers le PMH) : la soupape d'échappement s'ouvre. Le piston remonte et pousse les gaz brûlés vers le pot d'échappement. Puis tout recommence.</li>
</ol>
<div class="note why">Chaque temps correspond à un demi-tour de vilebrequin (le piston fait une descente ou une montée). Quatre temps = quatre demi-tours = <strong>deux tours complets</strong> de vilebrequin, soit 720°. C'est pour ça que l'animation affiche un compteur qui va jusqu'à 720°.</div>
<div class="note ex">À 3 000 tours par minute sur autoroute, le vilebrequin fait 50 tours par seconde. Chaque cylindre réalise donc 25 cycles complets par seconde : 25 explosions par seconde et par cylindre. Sur un 4 cylindres, ça fait 100 explosions par seconde.</div>
<h3>Le taux de compression : que veut dire « 10:1 » ?</h3>
<p>C'est l'un des chiffres les plus importants d'un moteur, et il se lit simplement. Le taux de compression compare deux volumes :</p>
<ul>
<li>le volume du cylindre quand le piston est <strong>en bas</strong> (PMB) : c'est le maximum d'air qu'il peut contenir ;</li>
<li>le volume qui reste quand le piston est <strong>en haut</strong> (PMH) : ce petit espace s'appelle la <strong>chambre de combustion</strong>.</li>
</ul>
<p class="formula">Taux de compression = volume piston en bas ÷ volume piston en haut</p>
<p>On l'écrit avec deux points, comme une proportion : <strong>10:1</strong> se lit « dix pour un » et veut dire que l'air est écrasé dans un volume <strong>10 fois plus petit</strong>.</p>
<div class="note ex">Un cylindre de moteur essence contient 440 cm³ d'air quand le piston est en bas. Quand le piston remonte, il ne reste plus que 40 cm³ dans la chambre. 440 ÷ 40 = 11. Le taux de compression est de 11:1 : l'air a été comprimé 11 fois. Pour un diesel, on pourrait avoir 400 cm³ écrasés dans 25 cm³ : 400 ÷ 25 = 16, soit 16:1.</div>
<p>Essaie toi-même : fais varier les volumes et regarde le taux changer.</p>
<div data-w="compression"></div>
<p><strong>Pourquoi comprimer ?</strong> Plus on comprime le mélange avant de l'enflammer, plus l'explosion pousse fort et plus on récupère d'énergie pour une même quantité de carburant. Un moteur avec un taux plus élevé est plus efficace. Mais il y a une limite, et cette limite est justement ce qui sépare l'essence du diesel.</p>
<h3>Essence ou diesel : la vraie différence</h3>
<p>Quand on comprime de l'air, il chauffe. À 16:1, l'air atteint environ 500 à 600 °C en fin de compression. Or le gazole s'enflamme spontanément, sans flamme ni étincelle, bien en dessous de cette température. Le diesel exploite ça : il comprime fortement de l'air pur, puis injecte le gazole au dernier moment. Le gazole s'enflamme tout seul au contact de cet air brûlant. C'est l'<strong>allumage par compression</strong>.</p>
<p>L'essence fonctionne à l'inverse. On veut qu'elle ne s'enflamme <em>pas</em> toute seule : c'est la <strong>bougie</strong> qui déclenche l'explosion, au moment exact choisi, par une étincelle. C'est l'<strong>allumage commandé</strong>. Si on comprimait l'essence autant qu'un diesel, elle s'enflammerait trop tôt, de façon anarchique : c'est le <strong>cliquetis</strong>, un bruit métallique qui peut percer un piston. On est donc limité à environ 10:1 à 13:1.</p>
<div class="note ex">Le chiffre 95 ou 98 à la pompe (SP95, SP98), c'est l'<strong>indice d'octane</strong> : la résistance de l'essence à l'auto-inflammation. Plus il est élevé, plus on peut comprimer sans cliquetis. Un moteur sportif à fort taux de compression demande souvent du 98.</div>
<p>Relisons le tableau maintenant que tu as les clés :</p>
<table class="tbl"><thead><tr><th></th><th>Essence</th><th>Diesel</th></tr></thead><tbody>
<tr><td>Allumage</td><td>Une bougie produit une étincelle au moment choisi</td><td>L'air comprimé est si chaud que le gazole s'enflamme seul en arrivant</td></tr>
<tr><td>Taux de compression</td><td>10:1 à 13:1 : l'air est écrasé 10 à 13 fois. Pas plus, sinon l'essence s'enflammerait trop tôt</td><td>15:1 à 20:1 : l'air est écrasé 15 à 20 fois, ce qui le chauffe assez pour enflammer le gazole</td></tr>
<tr><td>Bougies</td><td>Bougies d'allumage : elles déclenchent chaque explosion</td><td>Bougies de préchauffage : elles ne servent qu'à aider le démarrage quand le moteur est froid, car un moteur froid refroidit l'air comprimé</td></tr>
<tr><td>Caractère</td><td>Tourne vite (jusqu'à 6 000–7 000 tr/min)</td><td>Tourne moins vite (4 500–5 000 tr/min max) mais pousse fort dès les bas régimes</td></tr>
<tr><td>Consommation</td><td>Plus élevée</td><td>Plus faible grâce au taux de compression élevé</td></tr>
</tbody></table>
<h3>Pourquoi plusieurs cylindres ? L'ordre d'allumage</h3>
<p>Un seul temps sur quatre pousse le piston. Avec un seul cylindre, le moteur recevrait une grosse poussée, puis rien pendant un tour et demi : il tournerait par à-coups, comme une tondeuse à gazon. La solution : plusieurs cylindres qui explosent <strong>chacun leur tour</strong>, de façon à ce qu'il y ait toujours un piston en train de pousser.</p>
<p>Sur un 4 cylindres, le cycle dure 720° et on a 4 explosions : une tous les 720 ÷ 4 = <strong>180°</strong>, soit une tous les demi-tours. La poussée est continue.</p>
<p>On numérote les cylindres de 1 à 4, le n°1 étant généralement du côté de la courroie de distribution. L'<strong>ordre d'allumage</strong> indique dans quel ordre ils explosent. Sur presque tous les 4 cylindres en ligne, c'est <strong>1-3-4-2</strong> : le cylindre 1 explose, puis le 3, puis le 4, puis le 2, puis à nouveau le 1, et ainsi de suite.</p>
<p>Avance demi-tour par demi-tour pour voir ce que fait chaque cylindre :</p>
<div data-w="allumage"></div>
<p><strong>Pourquoi pas tout simplement 1-2-3-4 ?</strong> Sur un 4 cylindres en ligne, les pistons 1 et 4 montent et descendent ensemble, et les pistons 2 et 3 aussi (c'est la forme du vilebrequin qui veut ça). À chaque demi-tour, il faut donc choisir entre le 1 ou le 4 d'un côté, le 2 ou le 3 de l'autre. L'ordre 1-3-4-2 alterne les explosions entre les deux extrémités et le centre du moteur, ce qui répartit les efforts sur le vilebrequin et limite les vibrations.</p>
<div class="note why">Pourquoi c'est utile en pratique ? Quand tu remontes des fils de bougie ou que tu lis un code défaut « raté d'allumage cylindre 3 », tu dois savoir quel cylindre est lequel. Et un fil de bougie inversé fait tourner le moteur sur 2 ou 3 pattes.</div>`,
      keys: ['Admission, compression, combustion-détente, échappement : un cycle = 2 tours de vilebrequin', 'Taux 10:1 = l\'air est écrasé dans un volume 10 fois plus petit', 'Essence : étincelle, 10–13:1. Diesel : auto-inflammation, 15–20:1', 'Ordre 1-3-4-2 : une explosion tous les 180°, efforts répartis'] },

    { id: 'pieces', title: 'Les pièces du moteur', min: 14,
      goals: ['Reconnaître les pièces principales d\'un moteur', 'Distinguer le haut moteur du bas moteur', 'Comprendre le rôle de chaque pièce et ce qui arrive quand elle s\'use', 'Savoir décoder « DOHC 16V »'],
      body: `
<p>Maintenant que tu connais le principe des 4 temps, on va regarder les pièces qui le rendent possible. Touche chaque pièce du schéma :</p>
<div data-d="engineParts"></div>
<p>Les mécaniciens séparent le moteur en deux parties, parce qu'on intervient rarement sur les deux en même temps :</p>
<ul>
<li>le <strong>haut moteur</strong> : la culasse et tout ce qu'elle contient (soupapes, arbres à cames). C'est la partie qui « respire » ;</li>
<li>le <strong>bas moteur</strong> : le bloc et tout ce qui bouge dedans (pistons, bielles, vilebrequin). C'est la partie qui transforme l'énergie.</li>
</ul>
<h3>Le bas moteur</h3>
<dl class="defs">
<dt>Le bloc-cylindres</dt><dd>La plus grosse pièce, en fonte ou en aluminium. C'est la colonne vertébrale du moteur : il contient les cylindres (des tubes usinés au centième de millimètre) et des canaux intérieurs où circulent l'huile et le liquide de refroidissement. Sur la plupart des moteurs, tous les autres éléments sont fixés sur lui.</dd>
<dt>Le piston</dt><dd>Un cylindre court en aluminium qui coulisse dans le cylindre. Sa tête reçoit directement l'explosion, à plus de 2 000 °C pendant un instant. Il fait des allers-retours à des vitesses folles : à 6 000 tr/min, il change de sens 200 fois par seconde.</dd>
<dt>Les segments</dt><dd>Le piston n'est pas parfaitement ajusté au cylindre (sinon il gripperait en chauffant). Les segments sont trois anneaux en acier, fendus et élastiques, logés dans des gorges autour du piston. Ils plaquent contre la paroi du cylindre. Les deux du haut assurent l'<strong>étanchéité</strong> : ils empêchent les gaz de passer sous le piston, donc ils gardent la compression. Celui du bas est un <strong>racleur</strong> : il essuie l'huile de la paroi pour qu'elle ne monte pas brûler dans la chambre.</dd>
<dt>La bielle</dt><dd>La tige qui relie le piston au vilebrequin. Son extrémité haute (le « pied ») tourne autour d'un axe dans le piston. Son extrémité basse (la « tête ») tourne autour du vilebrequin.</dd>
<dt>Le vilebrequin</dt><dd>L'arbre qui tourne. Il a une forme en zigzag : chaque bielle s'accroche sur une partie décalée de l'axe, appelée <strong>maneton</strong>. C'est ce décalage qui transforme la poussée de la bielle en rotation, exactement comme une manivelle. Il porte aussi des <strong>contrepoids</strong> qui équilibrent les masses en mouvement.</dd>
<dt>Le carter d'huile</dt><dd>Le « bac » sous le moteur qui contient l'huile. Il porte le bouchon de vidange.</dd>
<dt>Le volant moteur</dt><dd>Un disque lourd fixé au bout du vilebrequin. Son poids lisse la rotation entre deux explosions (c'est un réservoir d'élan), il sert de surface de friction à l'embrayage, et sa couronne dentée reçoit le démarreur.</dd>
</dl>
<div class="note ex">Une voiture qui consomme un litre d'huile tous les 1 000 km et fume bleu : souvent des segments usés. L'huile passe au-dessus du piston et brûle avec le carburant. Une voiture qui manque de puissance et démarre mal : peut-être des segments qui n'étanchéifient plus, donc une compression faible. Un mécanicien le vérifie avec un <strong>compressiomètre</strong> vissé à la place de la bougie.</div>
<h3>Le haut moteur</h3>
<dl class="defs">
<dt>La culasse</dt><dd>Le « couvercle » boulonné sur le bloc. Elle referme les cylindres par le haut. Elle contient les conduits d'admission et d'échappement, les soupapes, les bougies (ou injecteurs en diesel) et souvent les arbres à cames. Le creux sculpté au-dessus de chaque cylindre forme la chambre de combustion.</dd>
<dt>Le joint de culasse</dt><dd>Une feuille de métal multicouche coincée entre le bloc et la culasse. Il a un travail énorme : rester étanche aux explosions, et séparer trois fluides qui passent juste à côté les uns des autres : les gaz de combustion, l'huile et le liquide de refroidissement.</dd>
<dt>Les soupapes</dt><dd>Les portes du cylindre. Une soupape ressemble à un gros clou à tête plate. Un ressort la maintient fermée, plaquée sur son siège. Pour l'ouvrir, on pousse sur sa tige : elle descend dans le cylindre et laisse passer le gaz. On en trouve souvent 4 par cylindre : 2 d'admission et 2 d'échappement, pour faire passer plus d'air plus vite.</dd>
<dt>L'arbre à cames</dt><dd>Un arbre avec des bosses ovales, les <strong>cames</strong>. Quand il tourne, chaque bosse vient appuyer sur une soupape et l'ouvre, puis la laisse se refermer. La forme de la came détermine quand et combien de temps la soupape reste ouverte. Il tourne exactement deux fois moins vite que le vilebrequin, car chaque soupape ne s'ouvre qu'une fois tous les deux tours (une fois par cycle).</dd>
</dl>
<div class="note ex">Le joint de culasse « claqué », c'est la panne redoutée. S'il laisse passer le liquide de refroidissement dans le cylindre : fumée blanche épaisse et niveau qui baisse. S'il le laisse passer dans l'huile : une mayonnaise beige sous le bouchon de remplissage. S'il laisse passer les gaz dans le circuit de refroidissement : des bulles dans le vase d'expansion et une surchauffe. La cause n°1 : un moteur qui a surchauffé.</div>
<h3>Décoder une fiche technique : « DOHC 16V »</h3>
<p>Tu verras souvent des sigles sur les moteurs. Voici comment les lire :</p>
<ul>
<li><strong>16V</strong> = 16 soupapes (valves en anglais). Sur un 4 cylindres, ça fait 16 ÷ 4 = 4 soupapes par cylindre. Un « 8V » en a 2 par cylindre, un « 12V » 3 cylindres × 4.</li>
<li><strong>OHC</strong> (OverHead Camshaft) = arbre à cames en tête, c'est-à-dire dans la culasse.</li>
<li><strong>SOHC</strong> = Single OHC, un seul arbre à cames qui commande toutes les soupapes.</li>
<li><strong>DOHC</strong> = Double OHC, deux arbres à cames : un pour l'admission, un pour l'échappement. C'est le cas du schéma ci-dessus.</li>
</ul>
<div class="note tip">Pour t'aider à mémoriser : le haut moteur gère <em>quand</em> le gaz entre et sort (soupapes, cames), le bas moteur gère <em>la force</em> (piston, bielle, vilebrequin).</div>`,
      keys: ['Bas moteur : bloc, pistons, segments, bielles, vilebrequin, carter', 'Haut moteur : culasse, soupapes, arbre(s) à cames', 'Segments : étanchéité + raclage de l\'huile', 'Le joint de culasse sépare gaz, huile et liquide de refroidissement', 'DOHC 16V = 2 arbres à cames, 4 soupapes par cylindre'] },

    { id: 'distribution', title: 'La distribution', min: 12,
      goals: ['Comprendre pourquoi les soupapes doivent être synchronisées avec les pistons', 'Savoir ce qu\'est le calage', 'Comprendre pourquoi une courroie cassée peut détruire un moteur', 'Lire un intervalle de remplacement'],
      body: `
<h3>Le problème à résoudre</h3>
<p>Les soupapes doivent s'ouvrir à des moments précis : la soupape d'admission pendant que le piston descend en admission, la soupape d'échappement pendant qu'il remonte en échappement. Et elles doivent être fermées pendant la compression et la combustion. Autrement dit, l'arbre à cames (qui ouvre les soupapes) doit être parfaitement synchronisé avec le vilebrequin (qui porte les pistons).</p>
<p>La <strong>distribution</strong> est le système qui relie les deux. Le vilebrequin entraîne le ou les arbres à cames par une <strong>courroie crantée</strong> (en caoutchouc renforcé, avec des dents) ou par une <strong>chaîne</strong> (comme une chaîne de vélo).</p>
<div class="note ana">C'est un orchestre. Le vilebrequin est le chef d'orchestre, les soupapes sont les musiciens. La courroie de distribution, c'est la partition qui les relie. Si un musicien a une mesure de décalage, la musique devient du bruit.</div>
<div data-d="distribution"></div>
<h3>Le rapport 2 pour 1</h3>
<p>Regarde les poulies du schéma : celles des arbres à cames sont <strong>deux fois plus grandes</strong> que celle du vilebrequin. Elles ont deux fois plus de dents. Résultat : quand le vilebrequin fait 2 tours, les arbres à cames n'en font qu'un.</p>
<div class="note ex">La poulie de vilebrequin a 21 dents, celles des arbres à cames en ont 42. Quand le vilebrequin tourne d'un tour, la courroie avance de 21 dents, ce qui fait tourner les arbres à cames de 21 sur 42, soit un demi-tour. Il faut donc 2 tours de vilebrequin pour un tour d'arbre à cames. Et c'est parfait : un cycle à 4 temps dure 2 tours, et chaque soupape doit s'ouvrir une fois par cycle.</div>
<h3>Le calage</h3>
<p>Au remontage, il ne suffit pas de mettre la courroie : il faut que chaque poulie soit dans la bonne position par rapport aux autres. C'est le <strong>calage</strong>. On utilise des repères (traits, encoches, points de peinture) à aligner, ou des <strong>piges de calage</strong> : des tiges métalliques qu'on glisse dans des trous pour bloquer le vilebrequin et les arbres à cames exactement dans la bonne position pendant qu'on pose la courroie.</p>
<p>Une seule dent de décalage, et les soupapes s'ouvrent quelques degrés trop tôt ou trop tard : le moteur perd de la puissance, tourne mal, et le calculateur affiche un défaut (par exemple P0016, corrélation vilebrequin / arbre à cames).</p>
<h3>La casse de courroie : pourquoi c'est si grave</h3>
<p>Dans la plupart des moteurs modernes, pour gagner en efficacité, les soupapes ouvertes descendent dans l'espace que le piston occupe quand il est en haut. Ça marche parce qu'ils ne sont jamais au même endroit au même moment : la soupape est remontée quand le piston arrive. On dit que ces moteurs sont <strong>interférents</strong>.</p>
<div class="note danger">Si la courroie casse, les arbres à cames s'arrêtent net, avec certaines soupapes ouvertes. Mais le vilebrequin, lui, continue de tourner sur son élan. Les pistons montent et frappent les soupapes ouvertes. Résultat : soupapes tordues, parfois pistons percés. La réparation coûte souvent entre 1 500 et 4 000 €, parfois plus que la valeur de la voiture. Un kit de distribution changé à temps coûte entre 300 et 900 € posé.</div>
<h3>Lire un intervalle de remplacement</h3>
<p>Le carnet d'entretien indique par exemple : « courroie de distribution : 120 000 km ou 6 ans ». Ça veut dire <strong>le premier des deux atteint</strong>. Le caoutchouc vieillit même quand la voiture roule peu : une voiture de 7 ans avec 60 000 km doit quand même changer sa courroie.</p>
<div class="note ex">Tu achètes une voiture d'occasion de 2016 avec 110 000 km, et l'intervalle est de 150 000 km ou 6 ans. On est en 2026 : 10 ans, la limite des 6 ans est dépassée depuis longtemps. Sans facture prouvant le remplacement, considère qu'il faut la faire tout de suite.</div>
<h3>Courroie ou chaîne ?</h3>
<table class="tbl"><thead><tr><th></th><th>Courroie</th><th>Chaîne</th></tr></thead><tbody>
<tr><td>Durée de vie</td><td>Remplacement obligatoire selon l'intervalle du constructeur (souvent entre 5 et 10 ans, ou 60 000 à 240 000 km)</td><td>Prévue pour durer la vie du moteur, mais elle peut s'allonger et ses guides s'user</td></tr>
<tr><td>Signe d'usure</td><td>Aucun bruit, souvent aucun signe avant la casse : d'où l'importance de l'intervalle</td><td>Un cliquetis métallique de quelques secondes au démarrage à froid</td></tr>
<tr><td>Lubrification</td><td>Fonctionne à sec, derrière un carter plastique</td><td>Baigne dans l'huile moteur : une huile négligée l'use plus vite</td></tr>
</tbody></table>
<p>On remplace la courroie en <strong>kit</strong> : courroie, galet tendeur (qui la maintient tendue), galets enrouleurs (qui la guident). Quand la <strong>pompe à eau</strong> est entraînée par la courroie, on la change aussi : si elle lâchait plus tard, il faudrait tout redémonter.</p>
<p>Ne confonds pas avec la <strong>courroie d'accessoires</strong>, la courroie striée visible à l'avant du moteur. Elle entraîne l'alternateur et la climatisation. Si elle casse, la voiture s'arrête de charger la batterie, mais le moteur n'est pas détruit.</p>`,
      keys: ['La distribution synchronise soupapes et pistons', 'Poulies d\'arbre à cames 2 fois plus grandes : elles tournent 2 fois moins vite', 'Moteur interférent : casse de courroie = soupapes tordues', 'Intervalle « km ou années » : le premier atteint'] },

    { id: 'puissance', title: 'Cylindrée, couple et puissance', min: 14,
      goals: ['Comprendre ce que veut dire « 1.5 » ou « 1 461 cm³ »', 'Faire la différence entre couple et puissance', 'Savoir convertir kW en ch', 'Comprendre les différentes architectures de moteur'],
      body: `
<h3>La cylindrée</h3>
<p>Quand on dit « un moteur 1.5 » ou « un 2 litres », on parle de sa <strong>cylindrée</strong>. C'est le volume d'air que tous les pistons balayent en descendant du PMH au PMB. En gros, c'est la quantité d'air que le moteur peut avaler à chaque cycle. Plus elle est grande, plus on peut brûler de carburant à chaque cycle, donc plus le moteur est potentiellement puissant.</p>
<p>Elle se calcule avec deux mesures :</p>
<ul>
<li>l'<strong>alésage</strong> : le diamètre du cylindre ;</li>
<li>la <strong>course</strong> : la distance parcourue par le piston entre PMH et PMB.</li>
</ul>
<p>Le volume balayé par un piston, c'est un cylindre de géométrie : surface du disque × hauteur.</p>
<p class="formula">Surface du piston = π × (alésage ÷ 2)²<br>Cylindrée unitaire = surface × course<br>Cylindrée totale = cylindrée unitaire × nombre de cylindres</p>
<div class="note ex">Le moteur 1.5 dCi de Renault a un alésage de 76 mm et une course de 80,5 mm. En centimètres : 7,6 cm et 8,05 cm.<br>Surface du piston : 3,14 × (3,8)² = 3,14 × 14,44 ≈ 45,4 cm².<br>Volume d'un cylindre : 45,4 × 8,05 ≈ 365 cm³.<br>4 cylindres : 365 × 4 ≈ <strong>1 461 cm³</strong>. Arrondi, on dit « 1.5 litre » (1 000 cm³ = 1 litre).</div>
<div data-w="cylindree"></div>
<h3>Le couple : la force de rotation</h3>
<p>Tu as vu le couple de serrage au module 1 : force × longueur du levier, en N·m. Le couple moteur, c'est exactement la même chose, mais produit par le moteur : la force avec laquelle le vilebrequin tourne.</p>
<p>C'est le couple que tu ressens dans ton dos quand tu accélères : la poussée, la capacité à reprendre sans rétrograder, à tirer une remorque, à monter une côte chargé.</p>
<div class="note ex">Une petite essence de 1.0 litre fait environ 100 N·m. Un 1.5 diesel environ 250 N·m. Un gros diesel de SUV, 400 à 600 N·m. Voilà pourquoi un diesel « pousse » plus fort à bas régime qu'une petite essence de même puissance.</div>
<h3>La puissance : la force × la vitesse</h3>
<p>La puissance, c'est le couple <strong>multiplié par la vitesse de rotation</strong>. Un moteur peut être puissant de deux façons : en produisant beaucoup de couple, ou en tournant très vite.</p>
<div class="note ana">Deux personnes doivent monter 20 sacs de ciment au premier étage. La première est très forte : elle monte 2 sacs à la fois, lentement. La seconde n'en porte qu'un, mais court. Si elles finissent en même temps, elles ont la même <em>puissance</em>. La première a plus de <em>couple</em>, la seconde a plus de <em>régime</em>. C'est la différence entre un diesel et une essence sportive.</div>
<p class="formula">Puissance (kW) = Couple (N·m) × Régime (tr/min) ÷ 9 549</p>
<p>Le nombre 9 549 est juste un facteur de conversion pour passer des tours par minute et des N·m aux kilowatts (il vient de 60 secondes × 1 000 ÷ 2π). Pas besoin de le comprendre, juste de l'utiliser.</p>
<div data-w="puissance"></div>
<h3>kW, ch et CV</h3>
<p>Le <strong>kilowatt (kW)</strong> est l'unité officielle de puissance, la même que pour un radiateur électrique ou une bouilloire. Le <strong>cheval (ch)</strong> est une vieille unité qu'on continue d'utiliser par habitude.</p>
<p class="formula">1 kW = 1,36 ch &nbsp;·&nbsp; 1 ch = 0,736 kW</p>
<div class="note ex">Une voiture de 66 kW fait 66 × 1,36 ≈ 90 ch. Une voiture annoncée 130 ch fait 130 × 0,736 ≈ 96 kW.</div>
<p>Et rappel : le <strong>CV fiscal</strong> de la carte grise n'est ni l'un ni l'autre, c'est une valeur administrative.</p>
<h3>Lire une fiche technique</h3>
<p>Les constructeurs annoncent souvent : « 90 ch à 4 000 tr/min, 220 N·m à 1 750 tr/min ». Ça veut dire que le moteur atteint sa puissance maximale vers 4 000 tours, et son couple maximal dès 1 750 tours. Un couple maximal disponible bas veut dire une voiture agréable en conduite quotidienne, sans avoir besoin de monter dans les tours.</p>
<h3>Les architectures</h3>
<ul>
<li><strong>En ligne</strong> : les cylindres sont alignés les uns derrière les autres. 3 cylindres (petites voitures récentes) ou 4 cylindres (la majorité). Simple et compact.</li>
<li><strong>En V</strong> : deux rangées de cylindres formant un V. Permet de loger 6, 8 ou 12 cylindres dans un moteur court. On dit V6, V8, V12.</li>
<li><strong>À plat (boxer)</strong> : deux rangées face à face, à plat. Les pistons bougent comme deux boxeurs qui échangent des coups. Centre de gravité très bas (Subaru, Porsche).</li>
</ul>`,
      keys: ['Cylindrée = π × (alésage/2)² × course × nombre de cylindres ; 1 000 cm³ = 1 L', 'Couple = force de rotation (N·m), la poussée ressentie', 'Puissance = couple × régime ÷ 9 549 (kW)', '1 kW = 1,36 ch'] }
  ],
